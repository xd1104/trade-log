/* ==========================================================================
   設計 Demo：【回顧】分頁
   - 配色／圓角／字體全部沿用 live_panel.py 的 PAGE 常數，不另立一套。
   - 台股慣例：紅色 = 漲／賺，綠色 = 跌／賠。
   - 純原生 HTML/CSS/JS + 手繪 SVG，零外部相依，雙擊即可打開。

:root{

  --down:#34B37E; --down-soft:rgba(52,179,126,.16);
  --radius:16px; --radius-sm:11px;
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC","Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg); color:var(--text); font-family:var(--font-sans); line-height:1.5;
  background-image:radial-gradient(1200px 500px at 50% -8%, rgba(227,169,81,.06), transparent 70%);
  background-repeat:no-repeat; min-height:100vh}
.app{max-width:1560px; margin:0 auto; padding:0 22px 24px}
.cols{display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:16px; align-items:start}
.right{display:flex; flex-direction:column; gap:10px}

/* ---------- 頂列 + 分頁 ---------- */

<script>
/* ============================================================================
   1. 假資料產生器
   ---------------------------------------------------------------------------
   全部在 5 分 K 這一層定義故事（關鍵日子手寫 OHLC），再展開成 1 分 K，
   保證兩個週期互相對得起來。正式版是跟後端要真資料，這裡只是為了能玩。
   ============================================================================ */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const OPEN_MIN=525;                       // 08:45
const pad=n=>String(n).padStart(2,'0');
const tm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const mt=t=>parseInt(t.slice(0,2))*60+parseInt(t.slice(3,5));
const T5=i=>tm(OPEN_MIN+5*i);

/* 一天 60 根 5 分 K：pin 指定的照抄，其餘用種子亂數往 anchors 走 */
function genDay5(seed,open,anchors,pin,volb){
  const r=mulberry32(hash(seed));
  const A=[[0,open]].concat(anchors);
  const tgt=[];
  for(let i=0;i<60;i++){
    let a=A[0],b=A[A.length-1];
    for(let k=0;k<A.length-1;k++){ if(i>=A[k][0]&&i<=A[k+1][0]){a=A[k];b=A[k+1];break;} }
    const f=b[0]===a[0]?0:(i-a[0])/(b[0]-a[0]);
    tgt.push(a[1]+(b[1]-a[1])*f);
  }
  const prof=i=>1.75*Math.exp(-i/7)+0.30+(i>=3&&i<=7?0.22:0)+(i>=56?0.45:0);
  const out=[]; let prevC=open;
  for(let i=0;i<60;i++){
    if(pin[i]){ const p=Object.assign({t:T5(i)},pin[i]); out.push(p); prevC=p.c; continue; }
    const o=Math.round(prevC);
    let c=Math.round(prevC+(tgt[i]-prevC)*0.5+(r()-0.5)*24);
    const h=Math.round(Math.max(o,c)+r()*13+2), l=Math.round(Math.min(o,c)-(r()*13+2));
    out.push({t:T5(i),o:o,h:h,l:l,c:c,v:Math.round(volb*prof(i)*(0.7+r()*0.6))});
    prevC=c;
  }
  return out;
}

/* 5 分 K → 5 根 1 分 K。上漲棒＝低點先出現、高點最後；下跌棒相反。 */
function expand5(b,r){
  const up=b.c>=b.o, ext=up?b.l:b.h, other=up?b.h:b.l;
  const cs=[];
  const w=[0.55,0.25,0.55,0.82,1.0];
  for(let i=0;i<4;i++){
    let base=i===0? b.o+(ext-b.o)*w[0] : ext+(b.c-ext)*w[i];
    base+=(r()-0.5)*Math.max(2,Math.abs(b.h-b.l)*0.07);
    cs.push(Math.round(Math.min(b.h,Math.max(b.l,base))));
  }
  cs.push(b.c);
  const out=[]; const m0=mt(b.t);
  for(let i=0;i<5;i++){
    const o=i===0?b.o:cs[i-1], c=cs[i];
    let h=Math.max(o,c)+Math.round(r()*3), l=Math.min(o,c)-Math.round(r()*3);
    if(up){ if(i===0)l=b.l; if(i===4)h=b.h; } else { if(i===0)h=b.h; if(i===4)l=b.l; }
    if(i===2){ if(up)h=Math.max(h,Math.round(ext+(other-ext)*0.55)); }
    h=Math.min(b.h,Math.max(h,o,c)); l=Math.max(b.l,Math.min(l,o,c));
    out.push({t:tm(m0+i),o:o,h:h,l:l,c:c,v:Math.max(1,Math.round(b.v/5*(0.65+r()*0.7)))});
  }
  out[0].o=b.o; out[4].c=b.c;
  return out;
}
function build1(b5,seed){
  const r=mulberry32(hash(seed+'|1m')); let out=[];
  b5.forEach(b=>{ out=out.concat(expand5(b,r)); });
  return out;
}
/* 讓某個時間點的那根 K 一定包得住某個價位（進出場標記才不會浮在棒子外） */
function forceCover(bars,t,px){
  const i=idxAt(bars,t); if(i<0)return;
  bars[i].h=Math.max(bars[i].h,px); bars[i].l=Math.min(bars[i].l,px);
}
function idxAt(bars,t){ let r=-1; for(let i=0;i<bars.length;i++){ if(bars[i].t<=t)r=i; else break; } return r; }

/* ============================================================================
   2. 客觀盤面數字（跟即時面板同一組欄位，回顧時才對得起來）
   ============================================================================ */
function featAt(day,i1){
  const D=DATA[day], B=D.b1, cur=B[i1].c;
  const back=k=>B[Math.max(0,i1-k)].c;
  let hi=-1e9,lo=1e9,cum=0;
  for(let i=0;i<=i1;i++){ hi=Math.max(hi,B[i].h); lo=Math.min(lo,B[i].l); cum+=B[i].v; }
  const rng=hi-lo, el=i1+1;
  const exp=D.volref*0.55*(1-Math.exp(-el/16)); // 到這一刻「正常」該有的累積量
  return {price:cur,mom5:cur-back(5),mom15:cur-back(15),ret_open:cur-D.open,
          gap:D.open-D.prev,rng:rng,pos:rng>0?(cur-lo)/rng:0.5,
          vol:exp>0?cum/exp:1, hi:hi, lo:lo, t:B[i1].t};
}
function tradeMeta(t){
  const D=DATA[t.date], B=D.b1;
  const ei=idxAt(B,t.time), xi=idxAt(B,t._exit_time.slice(0,5));
  const d=t.dir==='long'?1:-1;
  let mfe=0,mae=0;
  // 從進場的「下一根」算起 —— 進場那一分鐘的低點多半發生在進場之前，算進去會誤導
  for(let i=Math.min(ei+1,xi);i<=xi;i++){
    mfe=Math.max(mfe,d*(B[i].h-t.entry),d*(B[i].l-t.entry));
    mae=Math.min(mae,d*(B[i].l-t.entry),d*(B[i].h-t.entry));
  }
  return {ei:ei,xi:xi,mins:xi-ei,mfe:Math.round(mfe),mae:Math.round(mae),f:featAt(t.date,ei)};
}
const META={}; TRADES.forEach((t,i)=>META[i]=tradeMeta(t));

function filtered(){

    if(FILTER==='win')return x.t._net>0; if(FILTER==='loss')return x.t._net<=0;

  }).reverse();                                 // 新的在上面

function selTrade(){ const L=filtered(); if(!L.length)return null;
  const hit=L.find(x=>x.i===SEL); return hit||L[0]; }

/* 目前圖上是哪一天、哪個週期 */
function ctx(){
  if(MODE==='replay') return {day:RP.date,tf:1,bars:DATA[RP.date].b1};
  const s=selTrade();
  const day=s?s.t.date:DAYS[DAYS.length-1];
  return {day:day,tf:TF,bars:TF===1?DATA[day].b1:DATA[day].b5};
}

/* ============================================================================
   4. K 線圖（純 SVG）
   ============================================================================ */
const W=1040,H=430,R=64,TOP=10,BOT=24,VOLH=64,GAP=12;
const PB=H-BOT-VOLH-GAP;

function geom(){
  const C=ctx(), all=C.bars;
  if(MODE==='replay'){
    const n=Math.max(16,Math.min(RP.n,all.length));
    // RP.end＝null 時視窗跟著揭曉進度走；揭曉後才改成固定視窗（對準判斷的那一段）
    const end=Math.min(all.length,RP.end!=null?RP.end:RP.rev+1+FUT);
    return {C:C,all:all,from:Math.max(0,end-n),to:end,n:n,rev:RP.rev};
  }
  const n=Math.max(8,Math.min(VIEW.n,all.length));
  const end=VIEW.end==null?all.length:Math.max(n,Math.min(VIEW.end,all.length));
  return {C:C,all:all,from:end-n,to:end,n:n,rev:all.length-1};
}

function drawChart(){
  const G=geom(); const C=G.C, all=G.all;
  const B=all.slice(G.from,G.to);
  const vis=B.filter((b,i)=>G.from+i<=G.rev);         // 重播時只有揭曉過的才算數
  if(!vis.length) return;
  const trade=MODE==='review'?(selTrade()||null):null;
  const T=trade?trade.t:null, TM=trade?META[trade.i]:null;

  /* ---- 價格軸 ---- */
  let hi,lo;
  if(MODE==='replay'){
    let h=Math.max(...vis.map(b=>b.h)), l=Math.min(...vis.map(b=>b.l));
    if(RP.judge){ h=Math.max(h,RP.judge.tp); l=Math.min(l,RP.judge.sl); }
    const pad0=Math.max(40,(h-l)*0.28); h+=pad0; l-=pad0;
    // 只擴不縮：避免每揭曉一根就整個跳動，也避免用「未來的範圍」洩漏答案
    if(RP.axis){ hi=Math.max(RP.axis.hi,h); lo=Math.min(RP.axis.lo,l); } else { hi=h; lo=l; }
    RP.axis={hi:hi,lo:lo};
  } else {
    hi=Math.max(...B.map(b=>b.h)); lo=Math.min(...B.map(b=>b.l));
    // 選到的那一筆在畫面內時，價格軸要容得下它的停利／停損線
    if(T){ const ei=idxAt(all,T.time);
      if(ei>=G.from&&ei<G.to){ hi=Math.max(hi,T.entry+110); lo=Math.min(lo,T.entry-110); } }
    const p=(hi-lo)*0.08||10; hi+=p; lo-=p;
    const mid=(hi+lo)/2+VIEW.voff, half=((hi-lo)/2)/VIEW.vz; hi=mid+half; lo=mid-half;
  }
  const y=v=>TOP+(hi-v)/(hi-lo)*(PB-TOP);
  const cw=(W-R)/B.length, bw=Math.max(1.5,Math.min(16,cw*0.62));
  const x=i=>i*cw+cw/2;
  const vmax=Math.max(1,...vis.map(b=>b.v));
  const vy=v=>H-BOT-(v/vmax)*VOLH;
  const gi=i=>i-G.from;                                // 全域索引 → 畫面索引

  let g='<defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" '+
        'patternTransform="rotate(45)"><rect width="9" height="9" fill="#141922"/>'+
        '<line x1="0" y1="0" x2="0" y2="9" stroke="#1D2430" stroke-width="4"/></pattern></defs>';

  /* 下單時段 08:45~09:30 底色 */
  { let a=-1,b=-1; B.forEach((bar,i)=>{ if(bar.t>='08:45'&&bar.t<'09:30'){ if(a<0)a=i; b=i; } });
    if(a>=0) g+='<rect x="'+(a*cw).toFixed(1)+'" y="'+TOP+'" width="'+((b+1-a)*cw).toFixed(1)+
      '" height="'+(H-TOP-BOT)+'" fill="#E3A951" opacity=".05"/>'; }

  /* 進出場之間的區間著色（賺紅賠綠）——在 K 棒底下 */
  if(T){
    const a=gi(C.tf===1?TM.ei:idxAt(all,T.time)), b=gi(C.tf===1?TM.xi:idxAt(all,T._exit_time.slice(0,5)));
    if(b>=0&&a<B.length){
      const x0=Math.max(0,a*cw), x1=Math.min(W-R,(b+1)*cw);
      const col=T._net>0?'#EE5A54':'#34B37E';
      const yA=y(T.entry), yB=y(T.exit);
      g+='<rect x="'+x0.toFixed(1)+'" y="'+Math.min(yA,yB).toFixed(1)+'" width="'+(x1-x0).toFixed(1)+
         '" height="'+Math.abs(yB-yA).toFixed(1)+'" fill="'+col+'" opacity=".16"/>'+
         '<rect x="'+x0.toFixed(1)+'" y="'+TOP+'" width="'+(x1-x0).toFixed(1)+'" height="'+(PB-TOP)+
         '" fill="#E7E9ED" opacity=".025"/>';
    }
  }

  /* 價格格線 */
  g+='<rect x="'+(W-R)+'" y="0" width="'+R+'" height="'+H+'" fill="#1F2530" opacity=".45"/>';
  for(let k=0;k<=5;k++){
    const v=lo+(hi-lo)*k/5, yy=y(v);
    g+='<line x1="0" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+
       '" stroke="#262D39" stroke-width="1"/><text x="'+(W-R+8)+'" y="'+(yy+4).toFixed(1)+
       '" fill="#5A616E" font-size="12" font-family="ui-monospace,monospace">'+v.toFixed(0)+'</text>';
  }

  /* 停利／停損線 */
  const lines=[];
  if(T) lines.push([T.entry+ (T.dir==='long'?100:-100),'#EE5A54','停利'],
                   [T.entry+ (T.dir==='long'?-100:100),'#34B37E','停損']);
  if(RP.judge&&MODE==='replay') lines.push([RP.judge.tp,'#EE5A54','停利'],[RP.judge.sl,'#34B37E','停損']);
  lines.forEach(z=>{ const yy=y(z[0]); if(yy<TOP||yy>PB)return;
    g+='<line x1="0" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+
       '" stroke="'+z[1]+'" stroke-width="1.2" stroke-dasharray="5 4" opacity=".75"/>'+
       '<text x="6" y="'+(yy-5).toFixed(1)+'" fill="'+z[1]+'" font-size="11.5">'+z[2]+' '+z[0].toFixed(0)+'</text>'; });

  /* K 棒（重播時只畫揭曉過的） */
  B.forEach((b,i)=>{
    if(G.from+i>G.rev) return;
    const up=b.c>=b.o, col=up?'#EE5A54':'#34B37E', X=x(i);
    g+='<line x1="'+X.toFixed(1)+'" y1="'+y(b.h).toFixed(1)+'" x2="'+X.toFixed(1)+'" y2="'+
       y(b.l).toFixed(1)+'" stroke="'+col+'" stroke-width="1"/>';
    const yo=y(b.o),yc=y(b.c),tp=Math.min(yo,yc),hh=Math.max(1.2,Math.abs(yc-yo));
    g+='<rect x="'+(X-bw/2).toFixed(1)+'" y="'+tp.toFixed(1)+'" width="'+bw.toFixed(1)+
       '" height="'+hh.toFixed(1)+'" fill="'+col+'"/>';
  });

  /* 未揭曉區（重播） */
  if(MODE==='replay'&&G.rev<G.to-1){
    const x0=(gi(G.rev)+0.5)*cw+cw*0.2;
    g+='<rect x="'+x0.toFixed(1)+'" y="'+TOP+'" width="'+(W-R-x0).toFixed(1)+'" height="'+(H-TOP-BOT)+
       '" fill="url(#hatch)" opacity=".85"/>'+
       '<text x="'+(x0+(W-R-x0)/2).toFixed(1)+'" y="'+(TOP+26)+'" fill="#5A616E" font-size="12.5" '+
       'text-anchor="middle">後面還沒揭曉</text>';
  }

  /* 成交量 */
  g+='<line x1="0" y1="'+(H-BOT-VOLH-GAP/2).toFixed(1)+'" x2="'+(W-R)+'" y2="'+
     (H-BOT-VOLH-GAP/2).toFixed(1)+'" stroke="#262D39" stroke-width="1"/>';
  B.forEach((b,i)=>{ if(G.from+i>G.rev)return;
    const col=b.c>=b.o?'#EE5A54':'#34B37E', X=x(i), yy=vy(b.v);
    g+='<rect x="'+(X-bw/2).toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw.toFixed(1)+
       '" height="'+Math.max(0.8,H-BOT-yy).toFixed(1)+'" fill="'+col+'" opacity=".5"/>'; });
  g+='<text x="'+(W-R+8)+'" y="'+(H-BOT-VOLH+10)+'" fill="#5A616E" font-size="11" '+
     'font-family="ui-monospace,monospace">'+(vmax>=10000?(vmax/1000).toFixed(0)+'k':vmax.toFixed(0))+'</text>';

  /* 09:30 下單時段結束 */
  { const i=B.findIndex(b=>b.t>='09:30');
    if(i>0){ const X=(i*cw).toFixed(1);
      g+='<line x1="'+X+'" y1="'+TOP+'" x2="'+X+'" y2="'+(H-BOT)+'" stroke="#E3A951" '+
         'stroke-width="1" stroke-dasharray="2 5" opacity=".5"/>'+
         '<text x="'+(+X+5)+'" y="'+(H-BOT-6)+'" fill="#5A616E" font-size="10.5">09:30</text>'; } }

  /* 進出場標記 */
  function mark(px,t,dir,kind,net){
    const i=gi(idxAt(all,t)); if(i<0||i>=B.length)return;
    const X=x(i), Y=y(px), long=dir==='long', col=long?'#EE5A54':'#34B37E';
    if(kind==='in'){
      g+= long? '<path d="M'+(X-8)+' '+(Y+21)+' L'+X+' '+(Y+6)+' L'+(X+8)+' '+(Y+21)+' Z" fill="'+col+'"/>'
              : '<path d="M'+(X-8)+' '+(Y-21)+' L'+X+' '+(Y-6)+' L'+(X+8)+' '+(Y-21)+' Z" fill="'+col+'"/>';
      g+='<text x="'+(X+11)+'" y="'+(long?Y+25:Y-24)+'" fill="'+col+'" font-size="11" '+
         'font-family="ui-monospace,monospace">'+t+' '+px+'</text>';
    } else {
      const ec=net>0?'#EE5A54':'#34B37E';
      g+='<line x1="'+(X-6)+'" y1="'+(Y-6)+'" x2="'+(X+6)+'" y2="'+(Y+6)+'" stroke="'+ec+'" stroke-width="2.5"/>'+
         '<line x1="'+(X-6)+'" y1="'+(Y+6)+'" x2="'+(X+6)+'" y2="'+(Y-6)+'" stroke="'+ec+'" stroke-width="2.5"/>'+
         '<text x="'+(X+11)+'" y="'+(Y+4)+'" fill="'+ec+'" font-size="11" '+
         'font-family="ui-monospace,monospace">'+t+' '+px+'　'+pm(net)+'</text>';
    }
  }
  if(T){ mark(T.entry,T.time,T.dir,'in'); mark(T.exit,T._exit_time.slice(0,5),T.dir,'out',T._net); }
  if(MODE==='replay'&&RP.judge){
    mark(RP.judge.entry,RP.judge.time,RP.judge.dir,'in');
    if(RP.result) mark(RP.result.exit,RP.result.time,RP.judge.dir,'out',RP.result.net);
    // 揭曉後把「當天實際那筆」也疊上去對照
    if(RP.state==='revealed'){
      const rt=TRADES.find(t=>t.date===RP.date);
      if(rt){ const i=gi(idxAt(all,rt.time));
        if(i>=0&&i<B.length){ const X=x(i),Y=y(rt.entry);
          g+='<circle cx="'+X.toFixed(1)+'" cy="'+Y.toFixed(1)+'" r="7" fill="none" stroke="#E3A951" '+
             'stroke-width="1.6" stroke-dasharray="3 3"/>'+
             '<text x="'+(X+11)+'" y="'+(Y-11)+'" fill="#E3A951" font-size="10.5">當天你的進場</text>'; } }
    }
  }

  /* 游標十字線 */
  let lb=vis[vis.length-1], hovering=false;
  if(HOVER.i!=null&&HOVER.i>=G.from&&HOVER.i<G.to&&HOVER.i<=G.rev){
    lb=all[HOVER.i]; hovering=true;
    const X=x(gi(HOVER.i));
    g+='<line x1="'+X.toFixed(1)+'" y1="'+TOP+'" x2="'+X.toFixed(1)+'" y2="'+(H-BOT)+
       '" stroke="#8B92A0" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>';
  }

  /* 時間刻度 */
  const step=Math.max(1,Math.ceil(B.length/9));
  B.forEach((b,i)=>{ if(i%step)return;
    g+='<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" fill="#5A616E" font-size="11" '+
       'text-anchor="middle" font-family="ui-monospace,monospace">'+b.t+'</text>'; });

  /* ---- 只換 svg 內容，外框不動（重繪不打斷縮放／拖曳、也不閃） ---- */
  const sv=document.getElementById('csvg');
  sv.setAttribute('viewBox','0 0 '+W+' '+H);
  sv.innerHTML=g;

  /* 標題列 */
  const D=DATA[C.day];
  const px=lb.c, chg=px-D.open, pct=chg/D.open*100;
  const wd=['日','一','二','三','四','五','六'][new Date(C.day+'T00:00:00').getDay()];
  const rt=TRADES.find(t=>t.date===C.day);
  document.getElementById('chead').innerHTML=
    '<div><span class="cpx '+sgn(chg)+'">'+f(px)+'</span> <span class="cchg '+sgn(chg)+'">'+
    pm(chg)+' ('+pm(pct,2)+'%)</span></div>'+
    '<div style="flex:1"><span class="cday">'+C.day+'（'+wd+'）</span>'+
    (rt?'<span class="ctag">當天有 1 筆練習</span>':'<span class="ctag">當天沒下單</span>')+
    (MODE==='replay'?'<span class="ctag" style="color:var(--gold);border-color:rgba(227,169,81,.4)">重播中</span>':'')+'</div>'+
    (MODE==='review'
      ?'<div class="tfsw"><button data-tf="1" class="'+(TF===1?'on':'')+'">1 分</button>'+
       '<button data-tf="5" class="'+(TF===5?'on':'')+'">5 分</button></div>'
      :'<div class="cday" style="color:var(--faint)">1 分 K</div>');

  const vol=lb.v>=10000?(lb.v/1000).toFixed(1)+'k':lb.v.toFixed(0);
  document.getElementById('clegend').innerHTML=
    '<span class="lt">'+lb.t+'</span><span>開 <b>'+lb.o+'</b></span><span>高 <b>'+lb.h+'</b></span>'+
    '<span>低 <b>'+lb.l+'</b></span><span>收 <b style="color:'+(lb.c>=lb.o?'#EE5A54':'#34B37E')+'">'+
    lb.c+'</b></span><span>量 <b>'+vol+'</b></span>'+(hovering?'':'<span class="lt">（最新一根）</span>');
}

/* ---- 圖表滑鼠操作 ---- */
function bindChart(){
  const sv=document.getElementById('csvg');
  const AXIS=R/W;
  const onAxis=e=>{ const r=sv.getBoundingClientRect(); return (e.clientX-r.left)/r.width>1-AXIS; };
  sv.addEventListener('wheel',function(e){
    e.preventDefault();
    if(MODE==='replay'){                       // 重播只准改「看幾根」，看不到未來
      RP.n=Math.round(Math.min(120,Math.max(20,RP.n*(e.deltaY>0?1.15:0.87)))); render(); return; }
    if(e.shiftKey||onAxis(e)){
      VIEW.vz=Math.min(12,Math.max(0.25,VIEW.vz*(e.deltaY>0?0.88:1.14))); render(); return; }
    const G=geom(), total=G.all.length, r=sv.getBoundingClientRect();
    const frac=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    const anchor=G.from+frac*G.n;
    const n=Math.round(Math.min(total,Math.max(8,G.n*(e.deltaY>0?1.18:0.85))));
    let end=Math.round(anchor+(1-frac)*n); end=Math.max(n,Math.min(total,end));
    VIEW.n=n; VIEW.end=(end>=total)?null:end; render();
  },{passive:false});
  sv.addEventListener('mousedown',function(e){
    if(MODE==='replay')return;
    const G=geom(), r=sv.getBoundingClientRect();
    DRAG={x:e.clientX,y:e.clientY,end:G.to,n:G.n,w:r.width,h:r.height,vz:VIEW.vz,voff:VIEW.voff,
          axis:onAxis(e),span:0};
    sv.style.cursor=DRAG.axis?'ns-resize':'grabbing'; e.preventDefault();
  });
  window.addEventListener('mousemove',function(e){
    if(!DRAG)return;
    if(DRAG.axis){ VIEW.vz=Math.min(12,Math.max(0.25,DRAG.vz*Math.exp(-(e.clientY-DRAG.y)/220)));
      render(); return; }
    const G=geom(), total=G.all.length;
    const moved=Math.round((e.clientX-DRAG.x)/(DRAG.w/DRAG.n));
    let end=DRAG.end-moved; end=Math.max(DRAG.n,Math.min(total,end));
    VIEW.end=(end>=total)?null:end; render();
  });
  window.addEventListener('mouseup',function(){ if(DRAG){DRAG=null; sv.style.cursor='';} });
  sv.addEventListener('mousemove',function(e){
    if(DRAG)return;
    const G=geom(), r=sv.getBoundingClientRect();
    const frac=(e.clientX-r.left)/r.width;
    if(frac<0||frac>1-R/W){ if(HOVER.i!=null){HOVER.i=null;render();} return; }
    const i=G.from+Math.floor(frac/(1-R/W)*G.n);
    const ni=Math.max(G.from,Math.min(G.to-1,i));
    if(ni!==HOVER.i){ HOVER.i=ni; render(); }
  });
  sv.addEventListener('mouseleave',function(){ if(HOVER.i!=null){HOVER.i=null; render();} });
  sv.addEventListener('dblclick',function(e){
    if(MODE==='replay'){ RP.n=48; render(); return; }
    if(onAxis(e)){ VIEW.vz=1; VIEW.voff=0; } else focusTrade();
    render();
  });
}

/* 把畫面對準目前選到的那筆交易 */
function focusTrade(){
  const s=selTrade(); if(!s){ VIEW={n:60,end:null,vz:1,voff:0}; return; }
  const C=ctx(), all=C.bars;
  const xi=idxAt(all,s.t._exit_time.slice(0,5)), ei=idxAt(all,s.t.time);
  const span=Math.max(TF===1?45:12,(xi-ei)*2+ (TF===1?30:8));
  VIEW={n:Math.min(all.length,Math.round(span)),
        end:Math.min(all.length,xi+Math.round(span*0.35)),vz:1,voff:0};
}

/* ============================================================================
   7. 右欄：重播練習
   ============================================================================ */
function rpStop(){ if(RP.timer){clearInterval(RP.timer); RP.timer=null;} }
function rpReset(day){
  rpStop();
  RP.date=day||RP.date; RP.state='idle'; RP.rev=0; RP.judge=null; RP.result=null;
  RP.axis=null; RP.note=''; RP.end=null; RP.n=48; HOVER.i=null;
}
function rpPlay(){
  if(RP.state==='revealed')return;
  rpStop(); RP.state='running';
  const ms=(SPEEDS.find(s=>s[0]===RP.speed)||SPEEDS[1])[1];
  RP.timer=setInterval(function(){rpStep();},ms); render();
}
function rpPause(){ rpStop(); if(RP.state==='running')RP.state=RP.judge?'holding':'paused'; render(); }
function rpStep(back){
  if(RP.state==='revealed')return;                 // 揭曉後就別再逐根走，要重玩請按「再玩一次」
  const B=DATA[RP.date].b1;
  if(back){ RP.rev=Math.max(0,RP.rev-1); RP.axis=null; render(); return; }
  if(RP.rev>=B.length-1){ rpReveal(); return; }
  RP.rev++;
  /* 判斷過就要檢查有沒有觸及 ±100（同一根同時碰到，保守算停損） */
  if(RP.judge&&!RP.result){
    const b=B[RP.rev], J=RP.judge, d=J.dir==='long'?1:-1;
    const hitSL=d>0?b.l<=J.sl:b.h>=J.sl, hitTP=d>0?b.h>=J.tp:b.l<=J.tp;
    if(hitSL||hitTP){
      const tp=hitSL?false:true;
      RP.result={reason:tp?'tp':'sl',exit:tp?J.tp:J.sl,time:b.t,
                 points:tp?100:-100,net:tp?95:-105};
      rpReveal(); return;
    }
    if(b.t>='11:00'){ RP.result={reason:'close',exit:b.c,time:b.t,
        points:Math.round(d*(b.c-J.entry)),net:Math.round(d*(b.c-J.entry))-5}; rpReveal(); return; }
  }
  if(!RP.judge&&B[RP.rev].t>='10:00'){ rpReveal(); return; }
  render();
}
function rpJudge(dir){
  if(RP.state==='revealed')return;
  const B=DATA[RP.date].b1, b=B[RP.rev], d=dir==='long'?1:-1;
  RP.judge={dir:dir,entry:b.c,time:b.t,tp:b.c+d*100,sl:b.c-d*100,
            note:(document.getElementById('jnote')||{}).value||''};
  RP.state='holding'; rpPlay();
}
function rpReveal(){
  rpStop();
  const B=DATA[RP.date].b1;
  // 整天全部揭曉，但畫面停在「判斷的那一段＋後續 40 分鐘」，不要跳到下午去
  const anchor=RP.result?idxAt(B,RP.result.time):RP.rev;
  RP.end=Math.min(B.length,Math.max(anchor+40,RP.rev+20));
  RP.n=Math.min(B.length,Math.max(60,RP.end));
  RP.rev=B.length-1; RP.axis=null; RP.state='revealed';
  RP.tally.n++;
  if(RP.result){ if(RP.result.reason==='tp')RP.tally.tp++; else if(RP.result.reason==='sl')RP.tally.sl++; }
  const rt=TRADES.find(t=>t.date===RP.date);
  if(rt&&RP.judge&&rt.dir===RP.judge.dir)RP.tally.same++;
  render();
}

    h+='</div>'+(J&&J.note?'<div class="tr-note" style="padding-left:0;margin-top:6px">「'+esc(J.note)+'」</div>':'')+'</div>';

    h+='<div class="sec-head" style="margin-top:14px"><h2>你已經進場了</h2>'+

       '<span class="v up">'+J.tp+'</span></div>'+
       '<div class="dt-row"><span class="k">停損</span><span class="v down">'+J.sl+'</span></div>'+
       (J.note?'<div class="noteline" style="margin-top:10px">「'+esc(J.note)+'」</div>':'')+
       '<div class="btns" style="margin-top:12px">'+
       '<button class="btn ghost" data-act="rpreveal">直接看結果</button></div></div>';
  } else {
    const F=featAt(RP.date,RP.rev);
    h+='<div class="sec-head" style="margin-top:14px"><h2>你的判斷</h2>'+
       '<span class="count">現在 '+F.t+'　'+F.price+'</span></div><div class="card">'+
       '<div class="btns"><button class="btn long" data-act="jlong">&#9650; 做多</button>'+
       '<button class="btn short" data-act="jshort">&#9660; 做空</button></div>'+
       '<input class="jinput" id="jnote" placeholder="為什麼進？（可不寫，回顧時會顯示）" value="'+
       esc(RP.note)+'">'+
       '<div class="btns" style="margin-top:10px">'+
       '<button class="btn ghost" data-act="rpreveal">今天不做，直接揭曉</button></div>'+
       '<div class="note" style="margin-top:10px;text-align:center;border:0;padding:0">'+
       '<span class="kbd">空白鍵</span> 播放／暫停　<span class="kbd">→</span> 下一根　'+
       '<span class="kbd">↑</span> 做多　<span class="kbd">↓</span> 做空</div></div>';
  }
  return h;
}

/* 重播控制列（放在圖的正下方，眼睛不用離開圖） */
function ctrlHTML(){
  if(MODE!=='replay'){
    return '<div class="chint"><span id="cinfo">'+
      (selTrade()?'進出場之間已著色：紅＝這一筆賺、綠＝賠':'選一筆紀錄看細節')+
      '</span>　滾輪縮放・拖曳平移・雙擊回到這一筆</div>';
  }
  const B=DATA[RP.date].b1;
  const playing=RP.state==='running';
  return '<div class="rpbar">'+
    '<button class="rpbtn" data-act="rphome" title="回到 08:45">⏮</button>'+
    '<button class="rpbtn" data-act="rpback" title="退一根">◀</button>'+
    '<button class="rpbtn play" data-act="'+(playing?'rppause':'rpplay')+'">'+
      (playing?'❚❚ 暫停':'▶ 播放')+'</button>'+
    '<button class="rpbtn" data-act="rpstep" title="下一根">▶▶</button>'+
    '<div class="rpsp">'+SPEEDS.map(s=>'<button data-speed="'+s[0]+'" class="'+
      (RP.speed===s[0]?'on':'')+'">×'+s[0]+'</button>').join('')+'</div>'+
    '<div class="rppos"><b>'+B[RP.rev].t+'</b>　'+(RP.rev+1)+' / '+B.length+' 根'+
      (RP.state==='revealed'?'　已揭曉':'')+'</div></div>';
}

/* ============================================================================
   8. 繪製與事件
   ============================================================================ */
var lastPane='';
function render(){
  if(TAB!=='review')return;
  drawChart();
  document.getElementById('cctrl').innerHTML=ctrlHTML();
  const p=document.getElementById('pane');
  // 重播每走一根就重繪右欄 —— 先把使用者正在打的理由收起來，重繪後再放回去，
  // 否則他打到一半的字會被下一根 K 棒洗掉。
  const jn=document.getElementById('jnote');
  if(jn) RP.note=jn.value;
  const focus=document.activeElement&&document.activeElement.id==='jnote';
  const html=MODE==='review'?paneReview():paneReplay();
  if(lastPane!==html){ lastPane=html; p.innerHTML=html;
    if(focus&&document.getElementById('jnote')){ const el=document.getElementById('jnote');
      el.focus(); el.setSelectionRange(el.value.length,el.value.length); } }
  fstrip();
  const sel=document.querySelector('.trade.sel');
  if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:'nearest'});
}
function setTab(t){
  TAB=t; rpStop(); if(MODE==='replay'&&RP.state==='running')RP.state='paused';
  document.getElementById('tab-live').classList.toggle('hide',t!=='live');
  document.getElementById('tab-review').classList.toggle('hide',t!=='review');
  document.querySelectorAll('.tabs button').forEach(b=>
    b.classList.toggle('on',b.getAttribute('data-tab')===t));
  if(t==='review')render();
}
function setMode(m){
  if(m===MODE)return;
  MODE=m; rpStop(); HOVER.i=null;
  document.querySelectorAll('.seg button').forEach(b=>
    b.classList.toggle('on',b.getAttribute('data-mode')===m));
  if(m==='review')focusTrade();
  render();
}
function pick(i){ SEL=i; focusTrade(); render(); }
function moveSel(step){
  const L=filtered(); if(!L.length)return;
  let k=L.findIndex(x=>x.i===SEL); if(k<0)k=0;
  k=Math.max(0,Math.min(L.length-1,k+step));
  pick(L[k].i);
}

document.addEventListener('click',function(e){
  const tb=e.target.closest('[data-tab]'); if(tb){ setTab(tb.getAttribute('data-tab')); return; }
  const md=e.target.closest('[data-mode]'); if(md){ setMode(md.getAttribute('data-mode')); return; }
  const tf=e.target.closest('[data-tf]'); if(tf){ TF=parseInt(tf.getAttribute('data-tf')); focusTrade(); render(); return; }
  const fl=e.target.closest('[data-filter]'); if(fl){ FILTER=fl.getAttribute('data-filter');
    const L=filtered(); if(L.length&&!L.find(x=>x.i===SEL))SEL=L[0].i; focusTrade(); render(); return; }
  const pk=e.target.closest('[data-pick]'); if(pk){ pick(parseInt(pk.getAttribute('data-pick'))); return; }
  const dy=e.target.closest('[data-day]'); if(dy){ rpReset(dy.getAttribute('data-day')); render(); return; }
  const sp=e.target.closest('[data-speed]'); if(sp){ RP.speed=parseFloat(sp.getAttribute('data-speed'));
    if(RP.state==='running')rpPlay(); else render(); return; }
  const a=e.target.closest('[data-act]'); if(!a)return;
  const act=a.getAttribute('data-act');
  if(act==='replayday'){ const s=selTrade(); if(s){ rpReset(s.t.date); setMode('replay'); } return; }
  if(act==='rpplay'){ if(RP.state==='idle')RP.state='paused'; rpPlay(); return; }
  if(act==='rppause'){ rpPause(); return; }
  if(act==='rpstep'){ rpStop(); if(RP.state==='idle')RP.state='paused'; rpStep(); return; }
  if(act==='rpback'){ rpStop(); rpStep(true); return; }
  if(act==='rphome'){ rpReset(); RP.state='paused'; render(); return; }
  if(act==='jlong'){ RP.note=(document.getElementById('jnote')||{}).value||''; rpJudge('long'); return; }
  if(act==='jshort'){ RP.note=(document.getElementById('jnote')||{}).value||''; rpJudge('short'); return; }
  if(act==='rpreveal'){ rpReveal(); return; }
  if(act==='rpagain'){ rpReset(); render(); return; }
  if(act==='rpnext'){ const i=DAYS.indexOf(RP.date); rpReset(DAYS[(i+DAYS.length-1)%DAYS.length]); render(); return; }
});
document.addEventListener('keydown',function(e){
  if(TAB!=='review')return;
  if(e.target.tagName==='INPUT'){ if(e.key==='Escape')e.target.blur(); return; }
  if(MODE==='review'){
    if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); moveSel(-1); }
    else if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); moveSel(1); }
    else if(e.key==='r'||e.key==='R'){ const s=selTrade(); if(s){ rpReset(s.t.date); setMode('replay'); } }
    return;
  }
  if(e.key===' '){ e.preventDefault(); RP.state==='running'?rpPause():rpPlay(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); rpStop(); if(RP.state==='idle')RP.state='paused'; rpStep(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); rpStop(); rpStep(true); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(!RP.judge)rpJudge('long'); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); if(!RP.judge)rpJudge('short'); }
  else if(e.key==='Enter'){ e.preventDefault(); rpReveal(); }
});
