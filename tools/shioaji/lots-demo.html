<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>口數 demo（假資料）— 早盤儀表板</title>
<!-- lab-ux 2026-10-14：口數（加碼／減碼）介面 demo。
     ⛔ 全部假資料、不連任何東西（沒有 fetch、沒有 POST）。價格一律 12000 附近（團隊治具慣例）。
     色票／元件逐字取自 live_panel.py 的 PAGE（:root、.ac、.gl-*、.al-*、.trade）與 css/monitor.css（手機淺色）。
     規格：LOTS-UI-SPEC.md（同資料夾）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══ 面板 :root（逐字照 live_panel.py）══ */
:root{
  --bg:#0E1116; --surface:#151A22; --surface-2:#1C222C; --raise:#1A212B;
  --line:#242C38; --line-soft:#1E2530;
  --text:#E9ECF1; --dim:#8D95A3; --faint:#5C6472; --ghost:#39414F;
  --gold:#E3A951; --gold-soft:rgba(227,169,81,.14); --gold-line:rgba(227,169,81,.42);
  --up:#EE5A54; --up-soft:rgba(238,90,84,.15); --up-line:rgba(238,90,84,.38);
  --down:#34B37E; --down-soft:rgba(52,179,126,.15); --down-line:rgba(52,179,126,.38);
  --r-lg:16px; --r-md:12px; --r-sm:9px; --r-xs:6px;
  --ease:cubic-bezier(.22,.68,.36,1);
  --font-sans:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei","Segoe UI",sans-serif;
  --font-mono:"Inter","Noto Sans TC",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
body{background:var(--bg); color:var(--text); font-family:var(--font-sans); line-height:1.5;
  background-image:radial-gradient(1100px 460px at 50% -10%, rgba(227,169,81,.055), transparent 72%);
  background-repeat:no-repeat; min-height:100vh; -webkit-font-smoothing:antialiased;
  letter-spacing:.01em; font-feature-settings:'tnum' 1; font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}

/* ══ demo 控制列（⛔ 不是產品的一部分：虛線框＋「DEMO」字樣，一眼分得出來）══ */
.demo{position:sticky; top:0; z-index:50; background:#0A0C10; border-bottom:1px dashed #3a4250; padding:10px 16px}
.demo .in{max-width:1500px; margin:0 auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.demo .tag{font:700 10px var(--font-mono); letter-spacing:1.5px; color:#0A0C10; background:#8D95A3; border-radius:4px; padding:2px 6px; flex:none}
.demo .lb{font-size:12px; color:var(--faint); flex:none}
.demo button{border:1px dashed #3a4250; background:transparent; color:var(--dim); font:600 12.5px var(--font-sans);
  border-radius:999px; padding:7px 13px; cursor:pointer; min-height:36px}
.demo button.on{border-style:solid; border-color:var(--text); color:var(--text); background:#1C222C}
.demo button:active{transform:scale(.97)}
.demo .sep{width:1px; height:22px; background:#2a313c; flex:none}
.demo .say{flex:1 1 100%; font-size:12px; color:var(--faint); line-height:1.6}
.demo .say b{color:var(--dim)}

/* ══ 面板殼 ══ */
.app{max-width:1500px; margin:0 auto; padding:0 24px 40px}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 2px 16px; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:11px}
.brand .mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(150deg,rgba(227,169,81,.22),rgba(227,169,81,.06)); color:var(--gold); font-size:15px;
  box-shadow:inset 0 0 0 1px rgba(227,169,81,.2)}
.brand .nm{font-size:15px; font-weight:680; letter-spacing:.3px}
.brand .sub{font-size:11px; color:var(--faint); margin-top:1px}
.clock{text-align:right; font-family:var(--font-mono)}
.clock .d{font-size:14px; font-weight:600; letter-spacing:.4px}
.clock .w{font-size:11px; color:var(--faint)}
.tabs{display:flex; gap:3px; background:var(--surface-2); border-radius:12px; padding:3px; border:1px solid var(--line-soft); margin-bottom:16px; overflow-x:auto}
.tabs button{border:0; background:transparent; color:var(--dim); cursor:pointer; min-width:92px; position:relative;
  font-family:var(--font-sans); font-size:13.5px; font-weight:650; padding:8px 18px; border-radius:9px; white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--gold-soft); color:var(--gold)}
.tabs button.na{color:var(--ghost); cursor:default}
/* ⭐ 新：分頁上的小金點（有事要他按的時候才有；跟右上角信件的未讀同一個語彙） */
.tabs .dot{position:absolute; top:6px; right:9px; width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 3px var(--gold-soft)}

/* ── 共用：按鈕、卡 ── */
.btn{padding:11px 18px; border-radius:var(--r-md); cursor:pointer; border:1px solid transparent;
  font-family:var(--font-sans); font-size:14px; font-weight:700; letter-spacing:1px; min-height:44px;
  transition:transform .1s var(--ease), background .15s var(--ease), border-color .15s var(--ease)}
.btn:active:not(:disabled){transform:scale(.985)}
.btn:disabled{opacity:.3; cursor:not-allowed}
.card{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r-lg); padding:16px 18px}

/* ══ 【帳戶】（逐字照 .ac／.gl-*）══ */
#tab-acct{max-width:560px}
@media(min-width:1100px){ #tab-acct:not([hidden]){display:grid; grid-template-columns:minmax(0,560px) minmax(0,1fr); gap:16px; align-items:start; max-width:1400px} }
@media(max-width:1099px){ #tab-acct .ac+.ac{margin-top:12px} }
.ac{border:1px solid var(--line); border-radius:var(--r-md); background:var(--surface); padding:13px 14px 12px}
.ac .hd{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.ac .hd .t{font-size:13px; font-weight:700}
.ac .hd .at{font-size:10.5px; color:var(--faint); font-family:var(--font-mono)}
.ac .big{font-size:23px; font-weight:700; line-height:1.25; margin-top:6px; font-family:var(--font-mono)}
.ac .sub{font-size:11.5px; color:var(--dim); line-height:1.65; margin-top:3px; font-family:var(--font-mono)}
.ac .line{margin-top:8px; padding-top:8px; border-top:1px solid var(--line-soft); font-size:11.5px; color:var(--dim); line-height:1.6}
.gl-pos{font-size:14px; font-weight:650; line-height:1.6; margin-top:7px}
.gl-bar{height:8px; border-radius:4px; background:var(--line-soft); margin-top:9px; overflow:hidden}
.gl-bar i{display:block; height:100%; background:var(--gold); border-radius:4px}
.gl-scale{display:flex; justify-content:space-between; font-size:10.5px; color:var(--faint); margin-top:3px; font-family:var(--font-mono)}
.gl-h{font-size:12px; font-weight:650; margin-top:14px}
.gl-tw{overflow-x:auto; margin-top:6px}
.gl-t{width:100%; border-collapse:collapse; font-size:11.5px; font-family:var(--font-mono); white-space:nowrap}
.gl-t th{font-weight:600; color:var(--faint); text-align:right; padding:4px 8px; border-bottom:1px solid var(--line-soft)}
.gl-t td{color:var(--dim); text-align:right; padding:4px 8px; border-bottom:1px solid var(--line-soft)}
.gl-t th:first-child,.gl-t td:first-child{text-align:left}
.gl-t tr.done td{color:var(--faint)}
.gl-t tr.now td{color:var(--text); font-weight:650}
.gl-notes{font-size:10.5px; color:var(--faint); line-height:1.7; margin-top:10px}
.demo-omit{font-size:10.5px; color:var(--ghost); margin-top:6px; border:1px dashed var(--line); border-radius:6px; padding:6px 8px}
/* ⭐ 新：目標卡裡的「口數」一行（唯讀；只有導覽連結，⛔ 沒有會動到錢的按鈕） */
.gl-lots{margin-top:10px; padding:9px 12px; border-radius:var(--r-sm); background:var(--surface-2); border:1px solid var(--line-soft);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12.5px; color:var(--dim); line-height:1.55}
.gl-lots b{color:var(--text); font-weight:700; font-family:var(--font-mono)}
.gl-lots.att{border-color:var(--gold-line); background:var(--gold-soft); color:var(--gold)}
.gl-lots.att b{color:var(--gold)}
.gl-lots .go{margin-left:auto; flex:none; border:1px solid var(--line); background:transparent; color:var(--dim);
  font:600 12px var(--font-sans); border-radius:999px; padding:6px 12px; cursor:pointer; min-height:32px}
.gl-lots.att .go{border-color:var(--gold-line); color:var(--gold)}
.gl-t .mk{font-family:var(--font-sans); font-size:10.5px; font-weight:700; border-radius:5px; padding:0 6px; white-space:nowrap}
.gl-t .mk.run{color:var(--text); background:var(--surface-2); border:1px solid var(--line)}
.gl-t .mk.wait{color:var(--gold); background:var(--gold-soft); border:1px solid var(--gold-line)}

/* ══ 【自動下單】（逐字照 .al-*）══ */
.al-bar{display:flex; gap:9px; flex-wrap:wrap; align-items:stretch; margin-bottom:13px}
.al-pill{display:flex; align-items:center; gap:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px;
  padding:7px 9px 7px 14px; flex:1 1 260px; min-width:0}
.al-pill .lb{font-size:10px; letter-spacing:1px; flex:none}
.al-pill .lb.d{color:#7CC4F2} .al-pill .lb.n{color:#B39DF0}
.al-pill .nm{font-size:13.5px; font-weight:700; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.al-pill .q{font-size:12px; font-weight:700; color:var(--text); font-family:var(--font-mono); white-space:nowrap; flex:none}
.al-pill .st{font-size:11px; font-weight:700; border-radius:999px; padding:3px 10px 4px; background:var(--surface); color:var(--faint); margin-left:auto; white-space:nowrap}
.al-pill.on{border-color:var(--gold-line); background:var(--gold-soft)}
.al-pill.on .nm{color:var(--gold)}
.al-pill.on .st{background:rgba(227,169,81,.22); color:var(--gold)}
.al-pill .off{border:1px solid var(--line); background:transparent; color:var(--faint); font-size:11.5px; border-radius:999px; padding:5px 12px; flex:none; font-family:var(--font-sans); cursor:pointer}
.al-alarm{margin:0 0 13px; padding:9px 12px 10px; border-radius:var(--r-md); background:var(--gold-soft); border:1px solid var(--gold-line);
  color:var(--gold); font-size:12.5px; line-height:1.7; font-weight:600; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.al-alarm .g{flex:1 1 300px}
.al-alarm .go{flex:none; border:1px solid var(--gold-line); background:transparent; color:var(--gold); font:600 12px var(--font-sans);
  border-radius:999px; padding:6px 12px; cursor:pointer; min-height:32px}
.ses{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:500; letter-spacing:.08em; border-radius:6px; padding:1px 7px; vertical-align:2px; white-space:nowrap; flex:none}
.ses.d{color:#7CC4F2; background:rgba(124,196,242,.12); border:1px solid rgba(124,196,242,.35)}
.ses.n{color:#B39DF0; background:rgba(179,157,240,.12); border:1px solid rgba(179,157,240,.38)}
.al-today2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; margin-bottom:14px}
.al-tc{padding:16px 18px; min-width:0}
.al-tch{display:flex; align-items:baseline; gap:9px; margin-bottom:10px}
.al-tch .nm{font-size:15px; font-weight:600}
.al-tch .when{margin-left:auto; font-size:12px; color:var(--faint)}
.al-today .t{font-size:19px; font-weight:600; line-height:1.35}
.al-today .t.off{font-size:17px; color:var(--dim)}
.al-today .d{font-size:12.5px; color:var(--faint); line-height:1.7; margin-top:5px}
.al-today .d b{color:var(--dim); font-weight:650; font-family:var(--font-mono)}
.al-today .lq{margin-top:8px; font-size:12px; color:var(--dim); line-height:1.6; padding-top:8px; border-top:1px solid var(--line-soft)}
.al-today .lq b{color:var(--text); font-family:var(--font-mono)}
.al-row2{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:14px; margin-bottom:14px; align-items:stretch}
@media(max-width:1000px){ .al-today2,.al-row2{grid-template-columns:minmax(0,1fr)} }
.al-pos{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px 18px; height:100%}
.al-pos.live{border-color:var(--gold-line)}
.al-pos .hd{font-size:12px; color:var(--faint); letter-spacing:.12em; display:flex; justify-content:space-between; gap:8px}
.al-pos .hd b{color:var(--dim)}
.al-pos .who{font-size:14.5px; font-weight:500; margin-top:8px}
.al-pos .big{font-size:40px; font-weight:600; letter-spacing:-.025em; margin:4px 0 6px; font-family:var(--font-mono); line-height:1.1}
.al-pos .big u{text-decoration:none; font-size:15px; font-weight:400; color:var(--dim); margin-left:6px; letter-spacing:0}
.al-pos .kv{display:flex; gap:24px; flex-wrap:wrap; font-size:13px; color:var(--dim)}
.al-pos .kv b{color:var(--text); font-weight:600}
.al-pos .none{font-size:15px; color:var(--faint); padding:14px 0 4px}
.al-pos .r2{font-size:12.5px; color:var(--dim); margin-top:6px; line-height:1.7}
.al-pos .r2 b{color:var(--text); font-weight:600}
.al-mon{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px 18px; height:100%}
.al-mon .h{font-size:12px; color:var(--faint); letter-spacing:.12em}
.al-mon .tot{font-size:36px; font-weight:600; letter-spacing:-.025em; line-height:1.2; margin-top:4px; font-family:var(--font-mono)}
.al-mon .tot u{text-decoration:none; font-size:15px; font-weight:400; color:var(--dim); margin-left:6px; letter-spacing:0}
.al-mon table{width:100%; border-collapse:collapse; margin:10px 0 6px; font-size:13.5px}
.al-mon td{padding:6px 0; border-top:1px solid var(--line-soft)}
.al-mon td.p{text-align:right} .al-mon td.n{text-align:right; color:var(--faint); width:64px}
.al-mon .k{font-size:10.5px; color:var(--faint); letter-spacing:.4px}
.al-mon .v{font-size:13.5px; font-weight:650; font-family:var(--font-mono)}
.al-mon .hd2{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.al-mon .bar{height:8px; border-radius:4px; background:var(--surface-2); margin:8px 0 6px; overflow:hidden}
.al-mon .bar i{display:block; height:100%; border-radius:4px; background:var(--dim)}
.al-mon .n{font-size:11px; color:var(--faint); line-height:1.7}
.al-mon .n b{color:var(--dim)}
.al-fold{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:10px}
.al-fold>summary{cursor:pointer; list-style:none; padding:14px 18px; font-size:14px; font-weight:500; display:flex; align-items:center; gap:10px; color:var(--dim)}
.al-fold>summary::-webkit-details-marker{display:none}
.al-fold>summary::before{content:"▸"; color:var(--faint); transition:transform .15s}
.al-fold[open]>summary::before{transform:rotate(90deg)}
.al-fold>summary .r{margin-left:auto; font-weight:400; font-size:12.5px; color:var(--faint)}
.al-fold>summary .w{color:var(--gold)}
.al-fbody{padding:0 18px 16px}
.al-risk{padding:10px 14px 11px 13px; border-radius:var(--r-md); background:var(--surface-2); border:1px solid var(--line-soft); border-left:3px solid var(--gold)}
.al-risk p{display:flex; gap:9px; font-size:12px; line-height:1.65; color:var(--dim)}
.al-risk p+p{margin-top:4px}
.al-risk i{font-style:normal; color:var(--gold); flex:none}
.al-risk b{color:var(--text)}
/* 紀錄卡（逐字照 .trade） */
.al-list{max-width:640px; display:flex; flex-direction:column; gap:7px}
.al-list>*{flex:none}
.trade{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:var(--r-md); padding:10px 12px 10px 13px; position:relative; overflow:hidden}
.trade::before{content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--ghost)}
.trade.win::before{background:var(--up)} .trade.loss::before{background:var(--down)}
.tr-top{display:flex; align-items:center; gap:9px}
.tr-date{font-family:var(--font-mono); font-size:12px; color:var(--faint); width:42px; flex:none}
.dir{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:var(--r-xs); flex:none; letter-spacing:.3px}
.dir.l{background:var(--up-soft); color:var(--up)} .dir.s{background:var(--down-soft); color:var(--down)}
/* ⭐ 新：口數小標（只有 >1 口才出現；中性灰，⛔ 不用紅綠金） */
.qty{font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:var(--r-xs); flex:none; color:var(--text);
  border:1px solid var(--line); background:var(--surface); font-family:var(--font-mono)}
.tr-px{flex:1; min-width:0; font-family:var(--font-mono); font-size:12.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tr-px .arrow{color:var(--ghost); margin:0 3px}
.tr-res{font-family:var(--font-mono); font-size:15px; font-weight:700; text-align:right; min-width:52px; flex:none}
.r-win{color:var(--up)} .r-loss{color:var(--down)}
.tag{font-size:10px; color:var(--faint); border:1px solid var(--line); border-radius:5px; padding:1px 5px}
.trade .al-meta{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:5px; font-size:11.5px; color:var(--faint); line-height:1.5; font-family:var(--font-mono)}
.trade .al-meta b{color:var(--dim); font-weight:600}

/* ══ ⭐⭐ 新卡：口數（#allots，class 一律 lt- 前綴）══
   版型＝本月那張卡（#tab-fire .al-cap .cap）的同一套：surface、line 邊、r-lg、16/18 內距、.h 標題。
   ⛔ 通過＝中性灰、卡住＝金色；⛔ 不准用紅綠（紅綠只給損益）。 */
.lt{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px 18px; margin-bottom:14px}
.lt.att{border-color:var(--gold-line)}
.lt-hd{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.lt-hd .h{font-size:12px; color:var(--faint); letter-spacing:.12em}
.lt-hd .r{font-size:12px; color:var(--faint)}
.lt-hd .r b{color:var(--dim); font-weight:600}
.lt-top{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:18px; align-items:end; margin-top:4px}
@media(max-width:820px){ .lt-top{grid-template-columns:minmax(0,1fr); gap:10px} }
.lt-now .tot{font-size:36px; font-weight:600; letter-spacing:-.01em; line-height:1.2; font-family:var(--font-mono)}
.lt-now .tot u{text-decoration:none; font-size:13px; font-weight:600; color:var(--dim); margin-left:8px; letter-spacing:.02em; font-family:var(--font-sans);
  border:1px solid var(--line); border-radius:999px; padding:1px 9px; vertical-align:8px}
.lt-now .sub{font-size:12.5px; color:var(--dim); margin-top:2px; line-height:1.6}
.lt-now .sub b{color:var(--text); font-family:var(--font-mono)}
.lt-next .k{display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--dim)}
.lt-next .k b{color:var(--text); font-weight:650}
.lt-next .bar{height:8px; border-radius:4px; background:var(--surface-2); margin:7px 0 4px; overflow:hidden; position:relative}
.lt-next .bar i{display:block; height:100%; border-radius:4px; background:var(--dim)}
.lt.att .lt-next .bar i{background:var(--gold)}
.lt-next .sc{display:flex; justify-content:space-between; font-size:10.5px; color:var(--faint); font-family:var(--font-mono)}
.lt-say{margin-top:12px; font-size:14px; font-weight:650; line-height:1.6}
.lt-say.g{color:var(--gold)}
.lt-say small{display:block; font-size:12px; font-weight:500; color:var(--dim); margin-top:1px}
.lt-conds{margin-top:10px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; background:var(--line-soft);

   else if(reached&&lv>S.runLv) mk='<span class="mk wait">'+(S.offer&&!done&&lv===S.offer.toLv?'權益到了・等你確認':(done&&lv===S.offer.toLv?'已確認・11/3 起':'權益到了・條件沒過'))+'</span>';
   return '<tr class="'+(reached&&!running&&lv<S.runLv?'done':'')+(running?' now':'')+'"><td>'+(lv<=S.runLv&&!running?'✓ ':'')+wan(L[0])+'</td><td>'+lbl(L[1],L[2])+'</td><td>'+L[3]+'%</td><td>−'+money(23883*L[1])+'</td><td>'+mk+'</td></tr>';
 }).join('');
 return '<div class="ac"><div class="hd"><span class="t">帳戶總覽</span><span class="at">'+S.date.slice(5).replace('-','/')+' '+S.time+'　券商端</span></div>'+
   '<div class="big">'+money(S.eq)+'</div><div class="sub">今日 '+pm(S.dayPl)+'（demo 省略細項）</div>'+
   '<div class="line">錢夠下一筆：現在 '+lbl(a,b)+' 最多同時壓 '+Math.max(a,b)+' 口保證金（約 '+money(MARGIN*Math.max(a,b))+'）。</div></div>'+
  '<div class="ac gl"><div class="hd"><span class="t">目標：滾到 50 萬（10＋4 口）</span><span class="at">從 09/30 起算</span></div>'+
   /* ⚠️ 權益夠了 ≠ 已經升級：這句一定要分開講（goal.py 現在那句只看權益，會寫出「還差 0 元」或把沒升的級數當成現在） */
   '<div class="gl-pos">現在 '+money(S.eq)+' 元，'+(S.runLv===0?'在跑起始級 1＋1':'在跑第 '+S.runLv+' 級（'+lbl(a,b)+' 口）')+'。'+
     (S.eq>=S.next[0]
       ?('權益已經夠「'+wan(S.next[0])+'・'+lbl(S.next[1],S.next[2])+'」，'+(S.offer?(done?'你已確認，11/3 起升級。':'等你到【自動下單】確認。'):('但這個月卡在'+S.conds.filter(c=>!c.ok).map(c=>'「'+c.k+'」').join('、')+'，'+esc(S.check)+'再檢查。')))
       :('離下一級「'+wan(S.next[0])+'・'+lbl(S.next[1],S.next[2])+'」還差 '+money(S.next[0]-S.eq)+' 元。'))+'</div>'+
   '<div class="gl-bar"><i style="width:'+pr.toFixed(1)+'%"></i></div>'+
   '<div class="gl-scale"><span>'+(S.prevThr?wan(S.prevThr):'0')+'</span><span>下一級 '+wan(S.next[0])+'</span></div>'+
   line+
   '<div class="demo-omit">demo 省略：計畫線圖、「保守線到／目標線到」兩欄、每月實際（照現在，不動）。</div>'+
   '<div class="gl-h">每一級：要多少錢、做幾口</div>'+
   '<div class="gl-tw"><table class="gl-t"><thead><tr><th>權益</th><th>聯軍＋跟勢</th><th>一年內要補錢</th><th>停損失靈最壞一次</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '<div class="gl-notes"><div>・「現在在跑」＝程式真的在送的口數；權益到了不等於已經升（要條件都過、你按確認）。還沒到 7 萬時也是 1＋1，標在 7 萬那一列。</div>'+
   '<div>・升級：每月第一個交易日檢查、一次一級、升完 3 個月不再升；權益掉到這一級門檻的 85% 以下，隔天自動退一級。</div>'+
   '<div>・要補錢機率、最壞一次是回測推估、不是保證。</div></div></div>';
}

/* ══════════ 手機監控（淺色；⛔ 零按鈕）══════════ */
function phoneHTML(S){
 const [a,b]=S.run, P=S.pos, done=UP.step==='done'&&S.offer;
 const warn=(done?[]:S.phone.warn);
 const row=(k,v)=>'<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';
 let pos;
 if(P){ const per=(P.px-P.en), tot=per*P.q;
   pos='<div class="big win">'+pm(per)+' <small class="dim" style="font-size:14px">點／口</small></div>'+row('方向','<b>做多 '+P.q+' 口</b>')+row(P.q+' 口合計','<span class="num win">'+pm(tot)+' 點</span>')+row('進場','<span class="num">'+money(P.en)+'</span>');
 } else pos='<div class="big dim" style="font-size:20px">沒有部位</div>';
 const cap=400*(a+b);
 return '<div class="ph-wrap"><div class="ph">'+
  '<div class="top"><h1>儀表板監控</h1><span class="upd">更新 1 分鐘前</span></div>'+
  '<section class="card"><div class="alive"><span class="dot"></span><div><div class="t">面板正常運作中</div><div class="s">最後回報 1 分鐘前（'+S.time+'）</div></div></div></section>'+
  '<section class="card"><h2>現在的部位</h2>'+pos+'</section>'+
  '<section class="card"><h2>本月風控（日盤＋夜盤共用）</h2>'+row('本月自動單','<span class="num '+(S.mon.pnl>0?'win':(S.mon.pnl<0?'loss':''))+'">'+pm(S.mon.pnl)+' 點</span>')+row('上限','<span class="num">−'+money(cap)+' 點</span>')+'</section>'+
  '<section class="card"><h2>日盤自動下單</h2>'+row('做法','多方聯軍・<b>'+a+' 口</b>')+'</section>'+
  '<section class="card"><h2>夜盤自動下單</h2>'+row('做法','夜盤跟勢・今晚 <b>'+(S.tonightB>=2?b:Math.max(1,b-1))+' 口</b>')+'</section>'+
  '<section class="card new"><h2>帳戶（券商端）<span class="newtag">新：一行</span></h2>'+row('權益總值','<span class="num">'+money(S.eq)+' 元</span>')+
    row('口數','<b>'+esc(done?'1＋1（11/3 起 2＋1）':S.phone.acct)+'</b>')+'<div class="msg'+(warn.length?' gold':'')+'">'+esc(done?'已在電腦上確認升級，11/3 日盤起 2＋1。':S.phone.acctMsg)+'</div></section>'+
  (warn.length?'<section class="card warn new"><h2>要注意的事<span class="newtag">新：口數事件</span></h2>'+warn.map(x=>'<div class="item">⚠️ '+esc(x)+'</div>').join('')+'</section>':'')+
  '</div><div class="ph-note"><b>手機只加兩件事，⛔ 一顆按鈕都沒有</b>（手機頁結構上不能操作任何東西）：<br>'+
  '① 帳戶卡多一行「口數」＋一句說明（藍色虛線框）。<br>'+
  '② 有事才進「要注意的事」：<b>可以升級</b>（提醒要回電腦按）、<b>剛被減級</b>（哪天、為什麼，顯示 3 天）。卡在條件不算事，只寫在帳戶卡那句。<br><br>'+
  '日盤／夜盤卡的「做法」後面帶口數；部位卡多口時寫「點／口」＋合計。<br><br>'+
  '<span style="color:var(--faint)">手機實際是跟著系統深淺色；這裡用淺色那組示意。</span></div></div>';
}

/* ══════════ 繪製 ══════════ */
const TABS=[['live','即時',1],['acct','帳戶'],['sim','模擬',1],['hc','健檢',1],['fire','自動下單']];
function paint(){
 const S=SC[CUR];
 document.getElementById('scn').innerHTML=ORDER.map(k=>'<button class="'+(k===CUR?'on':'')+'" data-scn="'+k+'">'+SC[k].btn+'</button>').join(' ');
 document.getElementById('vw').innerHTML=[['fire','電腦：自動下單'],['acct','電腦：帳戶'],['phone','手機監控']].map(x=>'<button class="'+(TAB===x[0]?'on':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>').join(' ');
 document.getElementById('say').innerHTML=S.say;
 document.getElementById('ck').textContent=S.date.replace(/-/g,'/')+'（'+S.wd+'）';
 document.getElementById('ckw').textContent=S.time+'　demo 的日期';
 const dotFire=!!((S.offer&&UP.step!=='done')||S.notice);
 document.getElementById('tabs').innerHTML=TABS.map(t=>'<button class="'+(TAB===t[0]?'on':'')+(t[2]?' na':'')+'"'+(t[2]?' title="demo 沒做這一頁"':' data-tab="'+t[0]+'"')+'>'+t[1]+(t[0]==='fire'&&dotFire?'<i class="dot"></i>':'')+'</button>').join('');
 const A=document.getElementById('tab-acct'), F=document.getElementById('tab-fire'), Ph=document.getElementById('tab-phone');
 A.hidden=TAB!=='acct'; F.hidden=TAB!=='fire'; Ph.hidden=TAB!=='phone';
 if(TAB==='acct') A.innerHTML=acctHTML(S);
 if(TAB==='fire') F.innerHTML=fireHTML(S);
 if(TAB==='phone') Ph.innerHTML=phoneHTML(S);
}
document.addEventListener('click',e=>{
 const t=e.target;
 const sc=t.closest('[data-scn]'); if(sc){ CUR=sc.dataset.scn; UP={step:'idle'}; paint(); return; }
 const tb=t.closest('[data-tab]'); if(tb){ TAB=tb.dataset.tab; paint(); return; }
 if(t.closest('[data-jump]')){ const el=document.getElementById('allots'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return; }
 if(t.closest('[data-upon]')){ UP.step='confirm'; paint();                       // 第一段：只換畫面（正式版：零請求）
   const c=document.querySelector('.lt-act .al-conf'); if(c) c.scrollIntoView({behavior:'smooth',block:'nearest'}); return; }
 if(t.closest('[data-upno]')){ UP.step='idle'; paint(); return; }
 if(t.closest('[data-upyes]')){ UP.step='busy'; paint();                          // 第二段：正式版這裡才 POST
   setTimeout(()=>{ UP.step='done'; paint(); },700); return; }
 if(t.closest('[data-undo]')){ UP.step='idle'; paint(); return; }                 // 撤回＝安全方向，一鍵、不確認
});

/* ══════════ ?measure：實際量版面（getBoundingClientRect，⛔ 不用字級推算）══════════ */
function measure(){
 const out=[], vw=innerWidth;
 const q=(sel)=>{ const el=document.querySelector(sel); if(!el||el.offsetParent===null&&getComputedStyle(el).position!=='fixed') return null; const r=el.getBoundingClientRect(); return Math.round(r.width*10)/10+'×'+Math.round(r.height*10)/10; };
 ORDER.forEach(k=>{
  CUR=k; UP={step:'idle'};
  TAB='fire'; paint();
  out.push(k+' 自動下單 #allots='+q('#allots')+'  .al-alarm='+q('.al-alarm')+'  .al-row2='+q('.al-row2')+'  .trade(首列)='+q('.al-list .trade')+'  .al-pill='+q('.al-pill'));
  if(SC[k].offer){ UP.step='confirm'; paint(); out.push(k+' 確認條 .lt-act='+q('.lt-act')+'  .lt-cmp='+q('.lt-cmp')+'  #allots='+q('#allots'));
                   UP.step='done'; paint(); out.push(k+' 已確認 .lt-done='+q('.lt-done')+'  #allots='+q('#allots')); UP.step='idle'; }
  TAB='acct'; paint();
  out.push(k+' 帳戶 #lotsline='+q('#lotsline')+'  .ac.gl='+q('.ac.gl'));
  TAB='phone'; paint();
  out.push(k+' 手機 .ph='+q('.ph')+'  帳戶卡='+q('.ph .card.new')+'  要注意='+q('.ph .card.warn'));
  ['fire','acct','phone'].forEach(tb=>{ TAB=tb; UP.step=SC[k].offer?'confirm':'idle'; paint();
    const sw=document.documentElement.scrollWidth, cw=document.documentElement.clientWidth;
    if(sw>cw) out.push('  ⚠ 橫向溢出 '+k+'/'+tb+' scrollWidth '+sw+' > '+cw); });
  UP.step='idle';
 });
 const o=document.getElementById('mout'); o.hidden=false; o.textContent='viewport '+vw+'×'+innerHeight+'\n'+out.join('\n');
 CUR='now'; TAB='fire'; UP={step:'idle'};
}
/* 網址參數（方便直接分享某一幕）：?s=offer&t=fire&step=confirm */
(function(){ const p=new URLSearchParams(location.search);
 if(SC[p.get('s')]) CUR=p.get('s');
 if(['fire','acct','phone'].indexOf(p.get('t'))>=0) TAB=p.get('t');
 if(['confirm','done'].indexOf(p.get('step'))>=0&&SC[CUR].offer) UP.step=p.get('step'); })();
paint();
if(/[?&]measure/.test(location.search)){ (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(measure); }
</script>
