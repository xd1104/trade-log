<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>早盤儀表板・視覺升級 demo</title>
<!--
  ═══════════════════════════════════════════════════════════════════
  lab-ux 的「設計 demo」，不是產品。
  ・零外部依賴（沒有 CDN、沒有連外、沒有 import）
  ・K 棒是本機真實歷史資料（2026-08-21 / 08-25），練習紀錄是假的
  ・按鈕不會送任何請求、不會寫任何檔案
  規格文件：UI-REDESIGN-SPEC.md
  ═══════════════════════════════════════════════════════════════════
-->
<style>
/* ══════ 1. 設計代幣 ══════
   ⚠ 台股慣例不可反：紅=漲/賺、綠=跌/賠。
   金色只有一個意思：「即時／現在／目前選取」。 */
:root{
  --bg:#0E1116;
  --surface:#151A22;        /* L2 一般卡 */
  --surface-2:#1C222C;      /* 卡內凹槽（輸入框、分段控制、列表項）*/
  --raise:#1A212B;          /* L1 主卡（K 線圖）*/
  --line:#242C38;
  --line-soft:#1E2530;
  --text:#E9ECF1; --dim:#8D95A3; --faint:#5C6472; --ghost:#39414F;
  --gold:#E3A951; --gold-soft:rgba(227,169,81,.14); --gold-line:rgba(227,169,81,.42);
  --up:#EE5A54;   --up-soft:rgba(238,90,84,.15);    --up-line:rgba(238,90,84,.38);
  --down:#34B37E; --down-soft:rgba(52,179,126,.15); --down-line:rgba(52,179,126,.38);
  --r-lg:16px; --r-md:12px; --r-sm:9px; --r-xs:6px;
  --shadow-1:0 18px 40px -22px rgba(0,0,0,.85);
  --shadow-2:0 24px 60px -20px rgba(0,0,0,.7);
  --ease:cubic-bezier(.22,.68,.36,1);
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC","Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg); color:var(--text); font-family:var(--font-sans); line-height:1.5;
  background-image:radial-gradient(1100px 460px at 50% -10%, rgba(227,169,81,.055), transparent 72%);
  background-repeat:no-repeat; min-height:100vh; -webkit-font-smoothing:antialiased}
.app{max-width:1500px; margin:0 auto; padding:0 24px 28px}
.cols{display:grid; grid-template-columns:minmax(0,1fr) 388px; gap:18px; align-items:start}
@media(max-width:1160px){ .cols{grid-template-columns:minmax(0,1fr)} }
.right{display:flex; flex-direction:column; gap:14px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--text)}
[hidden]{display:none !important}

/* ══════ 2. 卡片層級 ══════
   舊版：每張卡同一個底色＋同一條邊框＝沒有主次。
   新版三層：L1 主卡（K 線圖，全頁唯一有陰影的東西）／L2 一般卡／L3 靜卡（純容器）。 */
.card{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r-lg);
  padding:16px 18px}
.card.l1{background:linear-gradient(180deg,var(--raise),#161C24); border-color:var(--line);
  box-shadow:var(--shadow-1); padding:16px 18px 13px; position:relative}
.card.l1::before{content:""; position:absolute; left:16px; right:16px; top:0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}
.card.l3{background:transparent; border-color:transparent; padding:0}
.sec-head{display:flex; align-items:center; justify-content:space-between; margin:0 2px 8px; gap:10px}
.sec-head h2{font-size:11.5px; margin:0; color:var(--dim); letter-spacing:1.6px; font-weight:650}
.sec-head .count{font-size:11px; color:var(--faint); font-family:var(--font-mono);
  font-variant-numeric:tabular-nums}
.sec-head .warn{font-size:10.5px; color:var(--gold); background:var(--gold-soft);
  border-radius:20px; padding:2px 9px; font-weight:600}

/* ══════ 3. 頂列 ══════ */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 2px 16px; gap:16px}
.brand{display:flex; align-items:center; gap:11px}
.brand .mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(150deg,rgba(227,169,81,.22),rgba(227,169,81,.06));
  color:var(--gold); font-size:15px; box-shadow:inset 0 0 0 1px rgba(227,169,81,.2)}
.brand .nm{font-size:15px; font-weight:680; letter-spacing:.3px}
.brand .sub{font-size:11px; color:var(--faint); margin-top:1px; display:flex; align-items:center; gap:6px}
.tabs{display:flex; gap:3px; background:var(--surface-2); border-radius:12px; padding:3px;
  border:1px solid var(--line-soft)}
.tabs button{border:0; background:transparent; color:var(--dim); cursor:pointer; min-width:100px;
  font-family:var(--font-sans); font-size:13.5px; font-weight:650; padding:8px 18px; border-radius:9px;
  transition:color .15s var(--ease), background .15s var(--ease)}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--gold-soft); color:var(--gold)}
.clock{text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums}
.clock .d{font-size:14px; font-weight:600; letter-spacing:.4px}
.clock .w{font-size:11px; color:var(--faint)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--down)}
.dot.off{background:var(--faint)}

/* ══════ 4. 報價區 ══════
   舊版：一個大數字＋一排同級距的小字，很平。
   新版三層：價格 52px 主角／漲跌做成有底色的膠囊／第三行灰字放昨收・合約・更新時間。 */
.chead{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
  margin-bottom:10px}
.qblock{display:flex; flex-direction:column; gap:6px; min-width:0}
.qmain{display:flex; align-items:baseline; gap:11px; flex-wrap:wrap}
.cpx{font-size:52px; font-weight:700; font-family:var(--font-mono); font-variant-numeric:tabular-nums;
  line-height:.94; letter-spacing:-1.6px}
.cchg{display:inline-flex; align-items:baseline; gap:7px; font-family:var(--font-mono);
  font-variant-numeric:tabular-nums; font-size:15px; font-weight:700; padding:4px 10px 5px;
  border-radius:9px; line-height:1}
.cchg.up{background:var(--up-soft); color:var(--up)}
.cchg.down{background:var(--down-soft); color:var(--down)}
.cchg.flat{background:var(--surface-2); color:var(--dim)}
.cchg .pct{font-size:12.5px; font-weight:600; opacity:.85}
.qsub{display:flex; align-items:center; gap:9px; font-size:11.5px; color:var(--faint);
  font-family:var(--font-mono); flex-wrap:wrap}
.qsub .sep{color:var(--ghost)}
.qsub .live{color:var(--gold); display:inline-flex; align-items:center; gap:5px}
.qsub .live i{width:6px;height:6px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 0 3px var(--gold-soft)}

/* ══════ 5. 翻頁列（⚠ 結構與尺寸沿用現行 live_panel.py，只換色票）══════ */
.pager{display:flex; flex-direction:column; align-items:flex-end; gap:2px; position:relative}
.pager .r1{display:flex; align-items:center; gap:3px}
.pager .r2{display:flex; align-items:center; gap:7px; font-size:11px; color:var(--faint);
  line-height:1.25; padding-right:5px; flex-wrap:wrap; justify-content:flex-end}
.pager .r2 .sep{color:var(--ghost)}
.pager .r2 b{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:11.5px;
  font-weight:650}
.pager .r2 kbd{font-family:var(--font-mono); font-size:10.5px; background:var(--surface-2);
  border:1px solid var(--line-soft); border-radius:5px; padding:0 4px; color:var(--dim); line-height:1.35}
.pager .nav-icon{width:24px; height:24px; border-radius:8px; border:0; background:transparent;
  color:var(--faint); font-size:11px; line-height:1; display:grid; place-items:center; cursor:pointer;
  font-family:var(--font-sans); padding:0; transition:background .12s var(--ease), color .12s var(--ease)}
.pager .nav-icon:hover:not(:disabled){background:var(--surface-2); color:var(--text)}
.pager .nav-icon:disabled{color:var(--ghost); cursor:default}
.pager .dstamp{display:inline-flex; align-items:center; gap:7px; border:0; background:transparent;
  cursor:pointer; padding:3px 7px; border-radius:9px; color:var(--text); line-height:1;
  font-family:var(--font-mono); font-variant-numeric:tabular-nums; white-space:nowrap;
  transition:background .12s var(--ease)}
.pager .dstamp .num{font-size:15px; font-weight:650; letter-spacing:.3px; line-height:1}
.pager .dstamp .wd{font-family:var(--font-sans); font-size:12px; color:var(--dim); font-weight:500;
  line-height:1; min-width:1em; text-align:center}
.pager .dstamp .cal-i{color:var(--faint); transition:color .12s var(--ease)}
.pager .dstamp .caret{font-size:8px; color:var(--faint);
  transition:transform .15s var(--ease), color .12s var(--ease)}
.pager .dstamp:hover{background:var(--surface-2)}
.pager .dstamp:hover .cal-i,.pager .dstamp:hover .caret{color:var(--gold)}
.pager .dstamp.open{background:var(--surface-2)}
.pager .dstamp.open .cal-i,.pager .dstamp.open .caret{color:var(--gold)}
.pager .dstamp.open .caret{transform:rotate(180deg)}
.pager .jump2{font-family:var(--font-sans); font-size:12px; font-weight:600; cursor:pointer; border:0;
  border-radius:8px; padding:4px 10px; line-height:1.15; background:var(--gold-soft); color:var(--gold);
  white-space:nowrap; transition:background .12s var(--ease)}
.pager .jump2:hover{background:rgba(227,169,81,.24)}
.pager .livelamp{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--dim);
  padding:4px 6px 4px 4px; line-height:1.15; white-space:nowrap}
.pager .livelamp i{width:6px; height:6px; border-radius:50%; background:var(--gold);
  box-shadow:0 0 0 3px var(--gold-soft)}
.cheadwrap{position:relative}
.calpop{position:absolute; top:calc(100% + 8px); right:0; z-index:30}
.calbox{border:1px solid var(--line); border-radius:14px; padding:12px 14px 13px;
  background:var(--surface-2); width:max-content; box-shadow:var(--shadow-2)}
.calhead{display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:10px}
.calhead .mo{font-family:var(--font-mono); font-size:12.5px; font-weight:700}
.calhead .cnav{display:flex; gap:5px}
.calhead .cnav button{width:24px; height:24px; border-radius:7px; font-size:12px; display:grid;
  place-items:center; padding:0; cursor:pointer; background:var(--surface); color:var(--dim);
  border:1px solid var(--line-soft)}
.calhead .cnav button:hover{border-color:var(--gold-line); color:var(--gold)}
.cal{display:grid; grid-template-columns:repeat(5,48px); gap:5px}
.cal .wd{font-size:10px; color:var(--faint); text-align:center; letter-spacing:1px}
.cal .cell{position:relative; height:44px; border-radius:10px; border:1px solid transparent;
  background:var(--bg); cursor:pointer; padding:5px 0 0; display:flex; flex-direction:column;
  align-items:center; gap:2px; font-family:var(--font-mono)}
.cal .cell .dd{font-size:13.5px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums}
.cal .cell .pc{font-size:9px; line-height:1; opacity:.85}
.cal .cell .rngbar{position:absolute; left:7px; right:7px; bottom:5px; height:2px; border-radius:1px;
  opacity:.5}
.cal .cell:hover{border-color:var(--line)}
.cal .cell.up .dd,.cal .cell.up .pc{color:var(--up)} .cal .cell.up .rngbar{background:var(--up)}
.cal .cell.dn .dd,.cal .cell.dn .pc{color:var(--down)} .cal .cell.dn .rngbar{background:var(--down)}
.cal .cell.off{background:transparent; cursor:default}
.cal .cell.off .dd{color:var(--ghost); font-weight:400}
.cal .cell.prac{border-color:var(--gold-line)}
.cal .cell.on{background:var(--gold-soft); border-color:var(--gold)}
.callegend{display:flex; gap:14px; flex-wrap:wrap; margin-top:11px; font-size:10.5px; color:var(--faint)}
.callegend i{display:inline-block; width:8px; height:8px; border-radius:3px; vertical-align:-1px;
  margin-right:4px}

/* ══════ 6. 圖表 ══════ */
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--dim);
  font-family:var(--font-mono); font-variant-numeric:tabular-nums; margin:2px 0 8px}
.legend b{color:var(--text); font-weight:600}
.legend .lt{color:var(--faint)}
.cwrap{overflow:hidden; border-radius:10px; position:relative}
.cwrap svg{display:block; width:100%; height:auto; cursor:crosshair; touch-action:none; user-select:none}
.chint{font-size:11px; color:var(--faint); text-align:right; margin-top:5px}
.chint b{color:var(--dim); font-weight:500}

/* ══════ 7. 資料軌（取代舊的 mini 列 / fstrip）══════
   舊版：5分 15分 跳空 震幅 位階 量能 買賣 加權 基差 全部同一個字級、同一個顏色、
   只用空白隔開 ⇒ 讀起來是一串連續的字。
   新版：①標籤在上、數值在下 ②分組（動能／今天／盤口／現貨）中間有分隔線
        ③位階與量能各給一條 3px 的微型量尺 —— 只呈現已發生的事實，不做任何預測。 */
.rail{display:flex; align-items:stretch; gap:0; flex-wrap:wrap; margin-top:12px; padding-top:11px;
  border-top:1px solid var(--line-soft)}
.rail .grp{display:flex; gap:18px; padding:0 18px; border-right:1px solid var(--line-soft)}
.rail .grp:first-child{padding-left:0}
.rail .grp:last-child{border-right:0; padding-right:0}
.rail .it{min-width:44px}
.rail .k{font-size:10.5px; color:var(--faint); letter-spacing:.4px; white-space:nowrap; line-height:1.3}
.rail .v{font-size:15px; font-weight:650; font-family:var(--font-mono);
  font-variant-numeric:tabular-nums; line-height:1.25; margin-top:2px; white-space:nowrap}
.rail .v small{font-size:10.5px; font-weight:500; color:var(--faint); margin-left:2px}
.rail .track{height:3px; border-radius:2px; background:var(--surface-2); margin-top:5px;
  overflow:hidden; position:relative}
.rail .track i{position:absolute; top:0; bottom:0; left:0; border-radius:2px; background:var(--dim)}
.rail .track i.hot{background:var(--gold)}
.rail .muted .v{color:var(--dim)}

/* ══════ 8. 右欄：練習下單 ══════ */
.btns{display:flex; gap:10px}
.btn{flex:1; padding:14px; border-radius:var(--r-md); cursor:pointer; font-family:var(--font-sans);
  font-size:15.5px; font-weight:700; letter-spacing:1px; border:1px solid transparent;
  transition:transform .1s var(--ease), background .15s var(--ease), border-color .15s var(--ease)}
.btn.long{background:var(--up-soft); color:var(--up); border-color:var(--up-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.btn.short{background:var(--down-soft); color:var(--down); border-color:var(--down-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.btn.long:hover:not(:disabled){background:rgba(238,90,84,.22)}
.btn.short:hover:not(:disabled){background:rgba(52,179,126,.22)}
.btn.flat2{background:var(--surface-2); color:var(--text); border-color:var(--line)}
.btn.gold{background:var(--gold-soft); color:var(--gold)}
.btn.gold:hover{background:rgba(227,169,81,.24)}
.btn.ghost{flex:0 0 auto; background:transparent; color:var(--faint); font-size:13px; font-weight:500;
  border-color:var(--line)}
.btn.ghost:hover{color:var(--text); border-color:var(--faint)}
.btn.gw{flex:1}
.btn:active:not(:disabled){transform:scale(.985)}
.btn:disabled{opacity:.3; cursor:not-allowed}
.whyoff{margin-top:10px; font-size:11.5px; color:var(--faint); line-height:1.6}
.pnl{text-align:center; padding:4px 0 8px}
.pnl .v{font-size:44px; font-weight:700; font-family:var(--font-mono); font-variant-numeric:tabular-nums;
  line-height:1; letter-spacing:-1px}
.pnl .l{font-size:12px; color:var(--dim); margin-top:7px}
.plimit{display:flex; justify-content:center; gap:14px; font-size:11.5px; color:var(--faint);
  font-family:var(--font-mono); margin-bottom:12px}

/* ══════ 9. 右欄：練習成績 ══════
   舊版：43% 用金色 46px ⇒ 全頁最亮的數字是「勝率」，而金色在別的地方是「即時」。
   新版：勝率改中性色、並排一條紅綠勝敗條（一眼看得出比例）；
        真正的結果「合計點數」才吃紅綠。 */
.seg{display:flex; gap:4px; background:var(--surface-2); border-radius:10px; padding:3px;
  border:1px solid var(--line-soft); margin-bottom:14px}
.seg button{flex:1; border:0; background:transparent; color:var(--dim); cursor:pointer;
  font-family:var(--font-sans); font-size:12.5px; font-weight:600; padding:7px 4px; border-radius:8px;
  transition:color .15s var(--ease), background .15s var(--ease)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--gold-soft); color:var(--gold)}
.score{display:flex; align-items:flex-start; justify-content:space-between; gap:14px}
.score .rate{line-height:1}
.score .rate .n{font-family:var(--font-mono); font-size:40px; font-weight:680; letter-spacing:-1.2px;
  font-variant-numeric:tabular-nums; color:var(--text)}
.score .rate .p{font-size:19px; color:var(--dim); font-family:var(--font-mono); margin-left:1px}
.score .rate .lab{font-size:11px; color:var(--faint); letter-spacing:2px; margin-top:7px}
.score .sum{text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums}
.score .sum .n{font-size:26px; font-weight:700; letter-spacing:-.5px; line-height:1.1}
.score .sum .u{font-size:11px; color:var(--dim); margin-left:3px; font-weight:500}
.score .sum .cash{font-size:11.5px; color:var(--faint); margin-top:5px}
.wlbar{display:flex; height:6px; border-radius:3px; overflow:hidden; margin-top:13px; gap:2px}
.wlbar i{display:block; height:100%; border-radius:3px}
.wlbar i.w{background:var(--up)} .wlbar i.l{background:var(--down)}
.wlfoot{display:flex; justify-content:space-between; font-size:11.5px; color:var(--faint);
  font-family:var(--font-mono); margin-top:6px}
.wlfoot b{font-weight:650}
.wlfoot .w b{color:var(--up)} .wlfoot .l b{color:var(--down)}

/* ══════ 10. 練習紀錄列 ══════
   左緣 2px 結果色 rail：一眼掃得出賺賠，不必讀數字。 */
.list{display:flex; flex-direction:column; gap:7px; margin-top:14px; max-height:290px;
  overflow-y:auto; padding-right:4px}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
.trade{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:var(--r-md);
  padding:10px 12px 10px 13px; position:relative; overflow:hidden;
  transition:border-color .15s var(--ease), background .15s var(--ease)}
.trade::before{content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--ghost)}
.trade.win::before{background:var(--up)} .trade.loss::before{background:var(--down)}
.tr-top{display:flex; align-items:center; gap:9px}
.tr-date{font-family:var(--font-mono); font-size:12px; color:var(--faint); width:42px; flex:none}
.dir{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:var(--r-xs); flex:none;
  letter-spacing:.3px}
.dir.l{background:var(--up-soft); color:var(--up)}
.dir.s{background:var(--down-soft); color:var(--down)}
.tr-px{flex:1; font-family:var(--font-mono); font-size:12.5px; font-variant-numeric:tabular-nums;
  color:var(--dim)}
.tr-px .arrow{color:var(--ghost); margin:0 3px}
.tr-res{font-family:var(--font-mono); font-size:15px; font-weight:700; text-align:right; min-width:52px;
  flex:none; font-variant-numeric:tabular-nums}
.r-win{color:var(--up)} .r-loss{color:var(--down)}
.tag{font-size:10px; color:var(--faint); border:1px solid var(--line); border-radius:5px; padding:1px 5px}
.tr-note{font-size:11.5px; color:var(--faint); margin-top:6px; padding-left:51px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}

.rpbar{margin-top:10px; padding:10px 12px 9px; background:var(--surface-2);

/* ══════ 13. 載入：骨架 ＋ 進場 ＋ 換日 ══════
   ⚠ 每 0.5 秒重繪的東西不准掛動畫（報價標頭每次價格變動就整個重建）。
     動畫只掛在「建一次就不動」的容器上，或用「加 class → 計時器移除」。 */
@keyframes kk-rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes kk-fade{from{opacity:0}to{opacity:1}}
@keyframes kk-wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes kk-sheen{from{transform:translateX(-60%)}to{transform:translateX(260%)}}
@keyframes kk-bar{from{left:-38%}to{left:100%}}
@keyframes kk-breathe{0%,100%{opacity:.30}50%{opacity:.62}}
body.boot .topbar{animation:kk-rise .40s var(--ease) both}
body.boot #mkt>*{animation:kk-rise .46s var(--ease) both .04s}
body.boot .right>*{animation:kk-rise .46s var(--ease) both}
body.boot .right>*:nth-child(1){animation-delay:.10s}
body.boot .right>*:nth-child(2){animation-delay:.16s}
.card.chart.kk-in{animation:kk-fade .34s ease both}
.cwrap.kk-draw svg{animation:kk-wipe .52s var(--ease) both}
.skel .sk{position:relative; overflow:hidden; border-radius:5px; background:var(--surface-2);
  animation:kk-breathe 1.7s ease-in-out infinite}
.skel .sk::after{content:""; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.045),transparent);
  animation:kk-sheen 1.6s ease-in-out infinite}
.skel .chead{align-items:center; min-height:74px}
.skel .legend{min-height:18.8px; align-items:center}
.skel .rail{min-height:42px; align-items:center}
.skel .sk-px{width:196px; height:44px}
.skel .sk-day{width:118px; height:20px}
.skel .legend .sk{height:11px}
.skel .chint .sk{width:150px; height:10px; display:inline-block}
.skel .rail .sk{width:60px; height:26px}
.skel .cwrap{aspect-ratio:1040/470; position:relative}
.skel .cwrap::before{content:""; position:absolute; left:0; right:0; top:12px; bottom:26px;
  background:repeating-linear-gradient(to bottom,var(--line-soft) 0 1px,transparent 1px 20%)}
.skel .bars{position:absolute; left:0; right:0; top:12px; bottom:26px; display:flex;
  align-items:flex-end; gap:2px}
.skel .bars i{flex:1; background:var(--surface-2); border-radius:2px;
  animation:kk-breathe 1.7s ease-in-out infinite}
.chart{position:relative}
.chart .kk-prog{position:absolute; left:0; right:0; top:0; height:2px; overflow:hidden; opacity:0;
  transition:opacity .2s; pointer-events:none; border-radius:var(--r-lg) var(--r-lg) 0 0}
.chart.kk-load .kk-prog{opacity:1}
.chart .kk-prog i{position:absolute; top:0; height:2px; width:38%;
  background:linear-gradient(90deg,transparent,var(--gold),transparent); animation:kk-bar 1.05s linear infinite}
.chart.kk-load .cwrap,.chart.kk-load .legend,.chart.kk-load .rail{opacity:.4}
.chart .cwrap,.chart .legend,.chart .rail{transition:opacity .22s ease}

/* 減少動態：系統設定或 demo 面板的開關，兩者都要吃 */
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
body.rm *{animation:none !important; transition:none !important}

    s+='<line x1="0" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+
       '" stroke="#232A35" stroke-width="1"/>'+
       '<text x="'+(W-R+8)+'" y="'+(yy+4).toFixed(1)+'" fill="#5C6472" font-size="12" '+
       'font-family="ui-monospace,monospace">'+v.toFixed(0)+'</text>';
  }
  /* 日盤開盤／跨午夜的分段線 */
  B.forEach(function(b,i){
    if(!i) return;
    const p=B[i-1], dayOpen=isNight(p)&&!isNight(b), midnight=isNight(b)&&isNight(p)&&b.d!==p.d;
    if(!dayOpen&&!midnight) return;
    const X=i*cw;
    s+='<line x1="'+X.toFixed(1)+'" y1="'+TOP+'" x2="'+X.toFixed(1)+'" y2="'+(H-BOT)+
       '" stroke="#49536A" stroke-width="1" stroke-dasharray="2 4"/>'+
       '<text x="'+(X+5).toFixed(1)+'" y="'+(TOP+12)+'" fill="#6B7385" font-size="10.5" '+
       'font-family="ui-monospace,monospace">'+(dayOpen?'日盤':(b.d||'').slice(5))+'</text>';
  });
  /* K 棒 */
  B.forEach(function(b,i){
    const up=b.c>=b.o, col=up?UP:DN, X=x(i);
    s+='<line x1="'+X.toFixed(1)+'" y1="'+y(b.h).toFixed(1)+'" x2="'+X.toFixed(1)+'" y2="'+
       y(b.l).toFixed(1)+'" stroke="'+col+'" stroke-width="1"/>';
    const yo=y(b.o), yc=y(b.c), top=Math.min(yo,yc), hh=Math.max(1.2,Math.abs(yc-yo));
    s+='<rect x="'+(X-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+
       '" height="'+hh.toFixed(1)+'" fill="'+col+'"/>';
  });
  /* 量 */
  s+='<line x1="0" y1="'+(H-BOT-VOLH-GAP/2).toFixed(1)+'" x2="'+(W-R)+'" y2="'+
     (H-BOT-VOLH-GAP/2).toFixed(1)+'" stroke="#232A35" stroke-width="1"/>';
  B.forEach(function(b,i){
    const col=b.c>=b.o?UP:DN, X=x(i), yy=vy(b.v);
    s+='<rect x="'+(X-bw/2).toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw.toFixed(1)+
       '" height="'+Math.max(0.8,H-BOT-yy).toFixed(1)+'" fill="'+col+'" opacity=".5"/>';
  });
  s+='<text x="'+(W-R+8)+'" y="'+(H-BOT-VOLH+10)+'" fill="#5C6472" font-size="11" '+
     'font-family="ui-monospace,monospace">'+(vmax>=10000?(vmax/1000).toFixed(0)+'k':vmax.toFixed(0))+'</text>'+
     '<text x="'+(W-R+8)+'" y="'+(H-BOT-2)+'" fill="#5C6472" font-size="11">量</text>';

  /* 持倉的停利／停損線 */
  if(pos){
    [[pos.tp,UP,'停利'],[pos.sl,DN,'停損']].forEach(function(z){
      const yy=y(z[0]); if(yy<TOP||yy>PB) return;
      s+='<line x1="0" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+
         '" stroke="'+z[1]+'" stroke-width="1.2" stroke-dasharray="5 4" opacity=".75"/>'+
         '<text x="6" y="'+(yy-5).toFixed(1)+'" fill="'+z[1]+'" font-size="11.5">'+z[2]+' '+
         z[0].toFixed(0)+'</text>';
    });
  }

  /* ══ 進出場標記 ══ */
  const AXB=[];
  const axisChip=function(aY,txt,col){
    const h=17; let py=aY-h/2;
    for(let k=0;k<6;k++){
      py=Math.max(TOP,Math.min(PB-h,aY-h/2+(k%2?1:-1)*Math.ceil(k/2)*(h+2)));
      if(!AXB.some(b=>py<b+h&&b<py+h)) break;
    }
    AXB.push(py);
    return '<rect x="'+(W-R+1)+'" y="'+py.toFixed(1)+'" width="'+(R-2)+'" height="'+h+
      '" rx="4" fill="'+col+'"/><text x="'+(W-R+7)+'" y="'+(py+h-5).toFixed(1)+'" fill="'+INK+
      '" font-size="11.5" font-weight="700" font-family="ui-monospace,monospace">'+txt+'</text>';
  };
  const CAPB=[];
  const caption=function(X,baseY,sign,txt,col){          /* 現行版的作法（對照用）*/
    const fs=11, w=tw(txt,fs), h=fs+3; let by=baseY;
    for(let k=0;k<5;k++){
      by=Math.max(TOP+fs,Math.min(H-BOT-2,baseY+sign*k*(h+3)));
      const bx=X-w/2;
      if(!CAPB.some(b=>bx<b.x+b.w&&b.x<bx+w&&by-fs<b.y+b.h&&b.y<by-fs+h)) break;
    }
    CAPB.push({x:X-w/2,y:by-fs,w:w,h:h});
    return '<text x="'+X.toFixed(1)+'" y="'+by.toFixed(1)+'" text-anchor="middle" fill="'+col+
      '" font-size="'+fs+'" font-weight="700" font-family="ui-monospace,monospace"'+
      ' stroke="'+INK+'" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">'+txt+'</text>';
  };
  /* 新版：所有文字都放進「本來就空著」的時間軸帶與價格軸，圖區只留形狀 */
  const LANE=[];
  const lanePill=function(X,txt,col){
    const fs=10.5, w=tw(txt,fs)+13, h=17;
    let px=X-w/2;
    px=Math.max(1,Math.min(W-R-w-1,px));
    let hit=true, tries=0;
    while(hit&&tries<8){
      hit=LANE.some(b=>px<b.x+b.w+3&&b.x<px+w+3);
      if(hit){ px=Math.min(W-R-w-1,px+w+5); tries++; } else break;
    }
    LANE.push({x:px,w:w});
    return '<rect x="'+px.toFixed(1)+'" y="'+(H-BOT+3)+'" width="'+w.toFixed(1)+'" height="'+h+
      '" rx="5" fill="'+INK+'" fill-opacity=".92" stroke="'+col+'" stroke-opacity=".55"/>'+
      '<text x="'+(px+w/2).toFixed(1)+'" y="'+(H-BOT+15)+'" text-anchor="middle" fill="'+col+
      '" font-size="'+fs+'" font-weight="700" font-family="ui-monospace,monospace">'+txt+'</text>';
  };
  const laneX=[];
  T.forEach(function(t){
    const ia=t._i; if(ia<from||ia>=end) return;
    const i=ia-from, X=x(i), Y=y(t.entry), long=t.dir==='long', col=long?UP:DN;
    const je=(t._j==null?-1:t._j);
    const hasExit=je>=from&&je<end;
    const XE=hasExit?x(je-from):null, YE=hasExit?y(t.exit):null;
    const ec=t._net>0?UP:DN;
    if(MARK==='old'){
      s+='<line x1="0" y1="'+Y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y.toFixed(1)+
         '" stroke="'+col+'" stroke-width="1" stroke-dasharray="5 4" opacity=".45"/>';
      const tipY=long?Y+7:Y-7, endY=long?Y+25:Y-25;
      s+='<path d="M'+(X-9)+' '+endY+' L'+X+' '+tipY+' L'+(X+9)+' '+endY+' Z" fill="'+col+
         '" stroke="'+INK+'" stroke-width="1.6" stroke-linejoin="round"/>';
      s+=caption(X,long?endY+13:endY-5,long?1:-1,'進 '+t.time,col);
      s+=axisChip(Y,String(Math.round(t.entry)),col);
      if(hasExit){
        s+='<line x1="0" y1="'+YE.toFixed(1)+'" x2="'+(W-R)+'" y2="'+YE.toFixed(1)+
           '" stroke="'+ec+'" stroke-width="1" stroke-dasharray="5 4" opacity=".45"/>'+
           '<circle cx="'+XE.toFixed(1)+'" cy="'+YE.toFixed(1)+'" r="8.5" fill="'+ec+
           '" stroke="'+INK+'" stroke-width="1.6"/>'+
           '<path d="M'+(XE-3.6)+' '+(YE-3.6)+' L'+(XE+3.6)+' '+(YE+3.6)+' M'+(XE-3.6)+' '+
           (YE+3.6)+' L'+(XE+3.6)+' '+(YE-3.6)+'" stroke="'+INK+
           '" stroke-width="2.2" stroke-linecap="round"/>';
        const down=YE<PB-40;
        s+=caption(XE,down?YE+22:YE-14,down?1:-1,'出 '+t._exit_time.slice(0,5)+
           (t._net==null?'':'  '+pm(t._net)),ec);
        s+=axisChip(YE,String(Math.round(t.exit)),ec);
      }
      return;
    }
    /* ── 新版 ── */
    if(hasExit){
      const yTop=Math.min(Y,YE), yBot=Math.max(Y,YE);
      s+='<rect x="'+(X-cw/2).toFixed(1)+'" y="'+yTop.toFixed(1)+'" width="'+
         Math.max(cw,(XE-X)+cw).toFixed(1)+'" height="'+Math.max(2,yBot-yTop).toFixed(1)+
         '" fill="'+ec+'" opacity=".10"/>';
      s+='<line x1="'+(X-cw/2).toFixed(1)+'" y1="'+Y.toFixed(1)+'" x2="'+(XE+cw/2).toFixed(1)+
         '" y2="'+Y.toFixed(1)+'" stroke="'+col+'" stroke-width="1.1" stroke-dasharray="4 3" opacity=".7"/>';
      s+='<line x1="'+(X-cw/2).toFixed(1)+'" y1="'+YE.toFixed(1)+'" x2="'+(XE+cw/2).toFixed(1)+
         '" y2="'+YE.toFixed(1)+'" stroke="'+ec+'" stroke-width="1.1" stroke-dasharray="4 3" opacity=".7"/>';
      s+='<line x1="'+X.toFixed(1)+'" y1="'+Y.toFixed(1)+'" x2="'+XE.toFixed(1)+'" y2="'+
         YE.toFixed(1)+'" stroke="'+ec+'" stroke-width="1.8" opacity=".9" stroke-linecap="round"/>';
    }
    /* 引導線：從標記垂直落到時間軸帶（不壓 K 棒，眼睛接得起來）*/
    s+='<line x1="'+X.toFixed(1)+'" y1="'+Y.toFixed(1)+'" x2="'+X.toFixed(1)+'" y2="'+(H-BOT)+
       '" stroke="'+col+'" stroke-width="1" stroke-dasharray="2 4" opacity=".32"/>';
    const tri=long?('M'+(X-7.5)+' '+(Y+16)+' L'+X+' '+(Y+3.5)+' L'+(X+7.5)+' '+(Y+16)+' Z')
                  :('M'+(X-7.5)+' '+(Y-16)+' L'+X+' '+(Y-3.5)+' L'+(X+7.5)+' '+(Y-16)+' Z');
    s+='<path d="'+tri+'" fill="'+col+'" stroke="'+INK+'" stroke-width="1.8" stroke-linejoin="round"/>';
    s+='<circle cx="'+X.toFixed(1)+'" cy="'+Y.toFixed(1)+'" r="2.6" fill="'+col+'" stroke="'+INK+
       '" stroke-width="1.2"/>';
    s+=axisChip(Y,String(Math.round(t.entry)),col);
    /* 標籤：進出場很近（他的單多半 5~15 分鐘就結束）時合併成一枚，
       不要兩枚膠囊互相推擠 */
    const near=hasExit&&(XE-X)<110;
    if(!near) laneX.push([X,(long?'▲ 進 ':'▼ 進 ')+t.time,col]);
    else laneX.push([(X+XE)/2,(long?'▲ ':'▼ ')+t.time+'→'+t._exit_time.slice(0,5)+
      '　'+pm(t._net),t._net>0?UP:DN]);
    if(hasExit){
      s+='<line x1="'+XE.toFixed(1)+'" y1="'+YE.toFixed(1)+'" x2="'+XE.toFixed(1)+'" y2="'+(H-BOT)+
         '" stroke="'+ec+'" stroke-width="1" stroke-dasharray="2 4" opacity=".32"/>';
      s+='<rect x="'+(XE-5.6).toFixed(1)+'" y="'+(YE-5.6).toFixed(1)+'" width="11.2" height="11.2"'+
         ' rx="2.4" transform="rotate(45 '+XE.toFixed(1)+' '+YE.toFixed(1)+')" fill="'+ec+
         '" stroke="'+INK+'" stroke-width="1.8"/>';
      s+=axisChip(YE,String(Math.round(t.exit)),ec);
      if(!near) laneX.push([XE,'出 '+t._exit_time.slice(0,5)+'　'+pm(t._net),ec]);
    }
  });

  /* 游標參考線 */
  let legendBar=B[B.length-1], hovering=false;
  if(g.hover&&g.hover.i!=null&&g.hover.i>=from&&g.hover.i<end){
    legendBar=bars[g.hover.i]; hovering=true;
    const X=x(g.hover.i-from);
    s+='<line x1="'+X.toFixed(1)+'" y1="'+TOP+'" x2="'+X.toFixed(1)+'" y2="'+(H-BOT)+
       '" stroke="#8D95A3" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>';
  }
  /* 時間刻度（會被標記膠囊擋到的就跳過）*/
  const step=Math.max(1,Math.ceil(B.length/8));
  B.forEach(function(b,i){
    if(i%step) return;
    const X=x(i);
    if(laneX.some(p=>Math.abs(p[0]-X)<58)) return;
    s+='<text x="'+X.toFixed(1)+'" y="'+(H-9)+'" fill="#5C6472" font-size="11.5" text-anchor="middle" '+
       'font-family="ui-monospace,monospace">'+b.t+'</text>';
  });
  laneX.forEach(function(p){ s+=lanePill(p[0],p[1],p[2]); });

  const b=legendBar, upC=b.c>=b.o?UP:DN;
  const vol=b.v>=10000?(b.v/1000).toFixed(1)+'k':b.v.toFixed(0);
  const legend='<span class="lt">'+(b.d?b.d.slice(5)+' ':'')+b.t+'</span>'+
    '<span>開 <b>'+b.o.toFixed(0)+'</b></span><span>高 <b>'+b.h.toFixed(0)+'</b></span>'+
    '<span>低 <b>'+b.l.toFixed(0)+'</b></span>'+
    '<span>收 <b style="color:'+upC+'">'+b.c.toFixed(0)+'</b></span>'+
    '<span>量 <b>'+vol+'</b></span>'+(hovering?'':'<span class="lt">（最新）</span>');
  return {svg:s, legend:legend, from:from, to:end, n:n, span:span,
          info:B.length+' / '+total+' 根'+(Math.abs(V.vz-1)>0.02?'　直向 '+V.vz.toFixed(1)+'x':'')};
}

/* 滑鼠互動（縮放／平移／hover／雙擊還原）——綁一次，之後只換 svg 內容 */
function bindChart(svg,getState){
  const AXIS=64/1040;
  const onAxis=e=>{ const r=svg.getBoundingClientRect();
    return (e.clientX-r.left)/r.width>1-AXIS; };
  svg.addEventListener('wheel',function(e){
    e.preventDefault();
    const S=getState(); if(!S) return;
    const V=S.view, total=S.bars.length;
    if(e.shiftKey||onAxis(e)){
      V.vz=Math.min(12,Math.max(0.25,V.vz*(e.deltaY>0?0.88:1.14))); S.paint(); return;
    }
    const r=svg.getBoundingClientRect();
    const frac=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    const n0=Math.max(6,Math.min(V.n,total));
    const end0=V.end==null?total:V.end;
    const anchor=(end0-n0)+frac*n0;
    const n=Math.round(Math.min(total,Math.max(8,n0*(e.deltaY>0?1.18:0.85))));
    let end=Math.round(anchor+(1-frac)*n);
    end=Math.max(n,Math.min(total,end));
    V.n=n; V.end=(end>=total)?null:end;
    S.paint();
  },{passive:false});
  svg.addEventListener('mousedown',function(e){
    const S=getState(); if(!S) return;
    const r=svg.getBoundingClientRect(), V=S.view, total=S.bars.length;
    const n0=Math.max(6,Math.min(V.n,total));
    DRAG={x:e.clientX,y:e.clientY,end:(V.end==null?total:V.end),n:n0,w:r.width,h:r.height,
          vz:V.vz,voff:V.voff,span:S.span||100,axis:onAxis(e),S:S};
    svg.style.cursor=DRAG.axis?'ns-resize':'grabbing';
    e.preventDefault();
  });
  window.addEventListener('mousemove',function(e){
    if(!DRAG||DRAG.S.svg!==svg) return;
    const S=DRAG.S, V=S.view, total=S.bars.length;
    if(DRAG.axis){
      V.vz=Math.min(12,Math.max(0.25,DRAG.vz*Math.exp(-(e.clientY-DRAG.y)/220)));
      S.paint(); return;
    }
    const perBar=DRAG.w/DRAG.n, moved=Math.round((e.clientX-DRAG.x)/perBar);
    let end=DRAG.end-moved;
    end=Math.max(DRAG.n,Math.min(total,end));
    V.end=(end>=total)?null:end;
    if(DRAG.span>0) V.voff=DRAG.voff+(e.clientY-DRAG.y)/DRAG.h*DRAG.span;
    S.paint();
  });
  window.addEventListener('mouseup',function(){ if(DRAG){ DRAG=null; svg.style.cursor=''; } });
  svg.addEventListener('mousemove',function(e){
    if(DRAG) return;
    const S=getState(); if(!S) return;
    const V=S.view, total=S.bars.length;
    const n=Math.max(6,Math.min(V.n,total)), end=V.end==null?total:V.end, from=end-n;
    const r=svg.getBoundingClientRect(), frac=(e.clientX-r.left)/r.width;
    if(frac<0||frac>1-64/1040){ if(S.hover.i!=null){ S.hover.i=null; S.paint(); } return; }
    const i=Math.max(from,Math.min(end-1,from+Math.floor(frac/(1-64/1040)*n)));
    if(i!==S.hover.i){ S.hover.i=i; S.paint(); }
  });
  svg.addEventListener('mouseleave',function(){
    const S=getState(); if(S&&S.hover.i!=null){ S.hover.i=null; S.paint(); }
  });
  svg.addEventListener('dblclick',function(e){
    const S=getState(); if(!S) return;
    if(onAxis(e)){ S.view.vz=1; S.view.voff=0; }
    else { S.view.n=S.defN||76; S.view.end=null; S.view.vz=1; S.view.voff=0; }
    S.paint();
  });
}

function railHTML(groups){
  return groups.map(function(g){
    return '<div class="grp">'+g.map(function(it){
      let h='<div class="it'+(it.muted?' muted':'')+'"><div class="k">'+it.k+'</div>'+
        '<div class="v '+(it.cls||'')+'">'+it.v+(it.u?'<small>'+it.u+'</small>':'')+'</div>';
      if(it.track!=null) h+='<div class="track"><i class="'+(it.hot?'hot':'')+'" style="width:'+
        Math.max(3,Math.min(100,it.track))+'%"></i></div>';
      return h+'</div>';
    }).join('')+'</div>';
  }).join('');
}
function liveRail(){
  const c=CHIPS;
  return railHTML([
    [{k:'5 分',v:pm(c.mom5),cls:sgn(c.mom5)},{k:'15 分',v:pm(c.mom15),cls:sgn(c.mom15)}],
    [{k:'跳空',v:pm(c.gap)},{k:'今日震幅',v:f(c.rng)},
     {k:'位階',v:f(c.pos*100)+'%',track:c.pos*100,hot:c.pos>0.8||c.pos<0.2},
     {k:'量能',v:f(c.vol_ratio,2),u:'倍',track:c.vol_ratio/3*100,hot:c.vol_ratio>1.5}],
    [{k:'買 / 賣',v:f(c.bid)+' / '+f(c.ask)}],
    [{k:'加權',v:f(c.idx)},{k:'基差',v:pm(c.basis,1),cls:sgn(c.basis)}]
  ]);
}
function dayRail(bars,date,ref){
  const D=bars.filter(b=>b.d===date&&b.t>='08:45');
  if(!D.length) return '';
  const o=D[0].o, hi=Math.max.apply(null,D.map(b=>b.h)), lo=Math.min.apply(null,D.map(b=>b.l));
  const c=D[D.length-1].c, vol=D.reduce((a,b)=>a+b.v,0);
  const pos=(c-lo)/Math.max(1,hi-lo);
  return railHTML([
    [{k:'開',v:f(o)},{k:'高',v:f(hi),cls:'up'},{k:'低',v:f(lo),cls:'down'},{k:'收',v:f(c)}],
    [{k:'震幅',v:f(hi-lo)},{k:'收在區間',v:f(pos*100)+'%',track:pos*100},
     {k:'跳空',v:ref==null?'—':pm(o-ref)}],
    [{k:'總量',v:(vol/1000).toFixed(1)+'k'},{k:'報價',v:'非即時',muted:true}]
  ]);
}

/* 只有「上次自己設進去的字串」變了才動 DOM（不可讀回 innerHTML 比對）*/
function setH(id,html){
  const e=$(id); if(!e) return;
  if(e.__html===html) return;
  e.__html=html; e.innerHTML=html;
}
function calHTML(){
  const months=['2026-07','2026-08'];
  if(months.indexOf(calMonth)<0) calMonth='2026-08';
  const mi=months.indexOf(calMonth);
  const y=+calMonth.slice(0,4), m=+calMonth.slice(5);
  const maxRng=Math.max.apply(null,[1].concat(DAYS.map(x=>x.rng||0)));
  const cd=viewDate||LIVE_DATE;
  const first=new Date(y,m-1,1), start=new Date(first);
  start.setDate(1-((first.getDay()+6)%7));
  let cells='';
  for(let k=0;k<42;k++){
    const dt=new Date(start); dt.setDate(start.getDate()+k);
    if(dt.getDay()===0||dt.getDay()===6) continue;
    const num=dt.getDate();
    if(dt.getMonth()!==m-1){ cells+='<span class="cell off"></span>'; continue; }
    const iso=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(num).padStart(2,'0');
    const x=dayRow(iso);

/* ════════════════════════════════════════════════════════════
   回顧分頁（翻紀錄 ／ Bar Replay）
   【紅線】只顯示已經發生的客觀數字：不預測、不算期望值、不給買賣建議。
   ════════════════════════════════════════════════════════════ */
var MODE='review', FILTER='all', SEL=0, TF=5;
var RVIEW={n:60,end:null,vz:1,voff:0}, RHOVER={i:null};
var RP={state:'idle',rev:4,speed:1,timer:null,judge:null,result:null,note:'',day:RV_DATE};
var TALLY={n:0,tp:0,sl:0,same:0};
const SPEEDS=[[0.5,1200],[1,600],[2,300],[4,150]];
const REASON={tp:'停利',sl:'停損',manual:'手動',close:'收盤'};
const RS={svg:null,bars:RV5,view:RVIEW,hover:RHOVER,span:0,defN:60,
          paint:function(){ paintReview(true); }};   /* hover／縮放只動圖 */

function rvList(){
  return HIST_DESC.map(function(t,i){ return {t:t,i:i}; }).filter(function(x){
    const t=x.t;
    if(FILTER==='win') return t._net>0;
    if(FILTER==='loss') return t._net<0;
    if(FILTER==='long') return t.dir==='long';
    if(FILTER==='short') return t.dir==='short';
    return true;
  });
}
function selTrade(){
  const L=rvList(); if(!L.length) return null;
  let s=L.filter(x=>x.i===SEL)[0];
  if(!s){ s=L[0]; SEL=s.i; }
  return s;
}
function rvBarsNow(){ return MODE==='replay'?RV1:(TF===5?RV5:RV1); }
/* demo：所有日期都用 08-21 這天的 K 棒示意，方向與時間照選到的那一筆 */
function markTrade(rec){
  const t=simTrade(TF===5?RV5:RV1,RV_DATE,rec.time,rec.dir);
  if(!t) return null;
  t.note=rec.note; return t;
}
function featAt(bars,i){
  const D=[], idx=[];
  for(let k=0;k<bars.length;k++){ if(bars[k].d===RV_DATE&&bars[k].t>='08:45'){ D.push(bars[k]); idx.push(k); } }
  const j=Math.max(0,Math.min(D.length-1,idx.indexOf(i)<0?D.length-1:idx.indexOf(i)));
  const c=D[j].c, seen=D.slice(0,j+1);
  const hi=Math.max.apply(null,seen.map(b=>b.h)), lo=Math.min.apply(null,seen.map(b=>b.l));
  const back=n=>D[Math.max(0,j-n)].c;
  const per=TF===5&&bars===RV5?5:1;
  const avgv=seen.reduce((a,b)=>a+b.v,0)/seen.length;
  return {t:D[j].t, price:c, mom5:c-back(Math.round(5/per)), mom15:c-back(Math.round(15/per)),
          ret_open:c-D[0].o, gap:D[0].o-(prevClose(RV_DATE)||D[0].o), rng:hi-lo,
          pos:(c-lo)/Math.max(1,hi-lo), vol_ratio:D[j].v/Math.max(1,avgv)};
}
function paintFStrip(F,title){
  $('rftitle').textContent=title;
  if(!F){ $('rfrail').innerHTML='<div class="grp"><div class="it"><div class="k">　</div>'+
    '<div class="v" style="color:var(--faint);font-size:12.5px">這一刻沒有本機 K 棒可以重建盤面</div>'+
    '</div></div>'; return; }
  $('rfrail').innerHTML=railHTML([
    [{k:'最近 5 分',v:pm(F.mom5),cls:sgn(F.mom5)},{k:'最近 15 分',v:pm(F.mom15),cls:sgn(F.mom15)}],
    [{k:'對開盤',v:pm(F.ret_open),cls:sgn(F.ret_open)},{k:'跳空',v:pm(F.gap)}],
    [{k:'今日震幅',v:f(F.rng)},{k:'位階',v:f(F.pos*100)+'%',track:F.pos*100,
      hot:F.pos>0.8||F.pos<0.2},{k:'量能',v:f(F.vol_ratio,2),u:'倍',
      track:F.vol_ratio/3*100,hot:F.vol_ratio>1.5}]
  ]);
}
function paintReview(light){
  if(TAB!=='review') return;
  const replay=MODE==='replay';
  let bars, trades=[], pos=null, pad=0;
  if(replay){
    const full=RV1;
    bars=full.slice(0,Math.max(2,RP.rev+1)); pad=10;
    if(RP.judge){
      const J=RP.judge;
      const jt={date:RV_DATE,time:J.time,dir:J.dir,entry:J.entry,exit:J.entry,
                _reason:'',_net:0,_exit_time:null};
      jt._i=idxOf(bars,RV_DATE,J.time); jt._j=-1;
      if(RP.result){
        jt.exit=RP.result.exit; jt._net=RP.result.net; jt._reason=RP.result.reason;
        jt._exit_time=RP.result.time+':00';
        jt._j=idxOf(bars,RV_DATE,RP.result.time);
      } else { pos={dir:J.dir,entry:J.entry,tp:J.tp,sl:J.sl}; }
      trades.push(jt);
    }
    if(RP.state==='revealed'&&T_RV){
      const a=Object.assign({},T_RV);
      a._i=idxOf(bars,RV_DATE,a.time); a._j=idxOf(bars,RV_DATE,a._exit_time.slice(0,5));
      if(!RP.judge||a.time!==RP.judge.time) trades.push(a);
    }
  } else {
    bars=rvBarsNow();
    const s=selTrade();
    const mt=s?markTrade(s.t):null;
    if(mt){ mt._i=idxOf(bars,RV_DATE,mt.time);
            mt._j=idxOf(bars,RV_DATE,mt._exit_time.slice(0,5)); trades.push(mt); }
  }
  RS.bars=bars;
  const r=renderChart({bars:bars,view:RVIEW,hover:RHOVER,H:430,VOLH:64,GAP:12,
                       trades:trades,pos:pos,pad:pad});
  if(r){ RS.span=r.span; $('rsvg').innerHTML=r.svg; setH('rlegend',r.legend); }
  if(light) return;                 /* hover／縮放：右欄與控制列都不動 */
  /* 標頭 */
  const D=bars.filter(b=>b.d===RV_DATE&&b.t>='08:45');
  const lastC=D.length?D[D.length-1].c:0, o=D.length?D[0].o:0;
  const ref=prevClose(RV_DATE)||o, chg=lastC-ref;
  setH('rhead',
    '<div class="qblock"><div class="qmain"><span class="cpx '+sgn(chg)+'">'+f(lastC)+'</span>'+
    '<span class="cchg '+sgn(chg)+'">'+pm(chg)+'<span class="pct">'+pm(chg/ref*100,2)+'%</span></span>'+
    '</div><div class="qsub"><span>'+RV_DATE+' 週五</span><span class="sep">·</span>'+
    '<span>日盤 08:45–13:45</span><span class="sep">·</span>'+
    '<span>'+(replay?'重播中（1 分 K）':'翻紀錄')+'</span></div></div>'+
    (replay?'':'<div class="tfsw"><button data-tf="1" class="'+(TF===1?'on':'')+'">1 分</button>'+
      '<button data-tf="5" class="'+(TF===5?'on':'')+'">5 分</button></div>'));
  setH('rctrl',ctrlHTML(bars));
  /* 客觀盤面 */
  if(replay){
    const i=RP.judge?idxOf(RV1,RV_DATE,RP.judge.time):Math.min(RP.rev,RV1.length-1);
    const F=featAt(RV1,i);
    paintFStrip(F,RP.judge?('進場當下的客觀盤面（'+RP.judge.time+'）')
                          :('目前這一刻的客觀盤面（'+F.t+'）'));
  } else {
    const s=selTrade();
    if(s){ const F=featAt(TF===5?RV5:RV1,idxOf(TF===5?RV5:RV1,RV_DATE,s.t.time));
      paintFStrip(F,'進場當下的客觀盤面（'+s.t.date.slice(5)+' '+s.t.time+'）'); }
    else paintFStrip(null,'進場當下的客觀盤面');
  }
  const html=replay?paneReplay():paneReviewPane();
  if(!nEditingReview()||NOTE.key==null) $('rpane').innerHTML=html;
  const sel=document.querySelector('#rpane .trade.sel');
  if(sel&&sel.scrollIntoView) sel.scrollIntoView({block:'nearest'});
}
function nEditingReview(){ return NOTE.key!=null&&String(NOTE.key).charAt(0)==='r'; }

/* ---------- 控制列 ---------- */
function ctrlHTML(bars){
  if(MODE!=='replay'){
    return '<div class="chint"><b>'+(selTrade()?'進出場之間已著色：紅＝這一筆賺、綠＝賠':'選一筆紀錄看細節')+
      '</b>　滾輪縮放・拖曳平移・雙擊還原　<b>demo：所有日期都用 08-21 的 K 棒示意</b></div>';

  const fill=RP.rev/(total-1)*100;
  const wa=pctOf('08:45'), wb=pctOf('09:30');

    ticks+='<span class="tk" style="left:'+pctOf(t).toFixed(2)+'%">'+t+'</span>';

  return '<div class="rpbar"><div class="rprow">'+
    '<button class="rpbtn" data-ract="rphome" title="回到 08:45">&#9198;</button>'+

/* ---------- 右欄：Bar Replay ---------- */
function rpStop(){ if(RP.timer){ clearInterval(RP.timer); RP.timer=null; } }
function rpReset(){ rpStop(); RP.state='idle'; RP.rev=4; RP.judge=null; RP.result=null; RP.note=''; }
function rpPlay(){
  if(RP.state==='revealed') return;
  rpStop();
  const ms=(SPEEDS.filter(s=>s[0]===RP.speed)[0]||[1,600])[1];
  RP.timer=setInterval(function(){ rpStep(); },ms);
  paintReview();
}
function rpPause(){ rpStop(); paintReview(); }
function rpStep(back){
  if(back){ RP.rev=Math.max(1,RP.rev-1); paintReview(); return; }
  if(RP.rev>=RV1.length-1){ rpReveal(); return; }
  RP.rev++;
  if(RP.judge&&!RP.result){
    const J=RP.judge, b=RV1[RP.rev], long=J.dir==='long';
    const hitTp=long?b.h>=J.tp:b.l<=J.tp, hitSl=long?b.l<=J.sl:b.h>=J.sl;
    if(hitTp||hitSl){
      const ex=hitTp?J.tp:J.sl;
      RP.result={exit:ex,time:b.t,reason:hitTp?'tp':'sl',
                 net:(long?ex-J.entry:J.entry-ex)-5};
      rpReveal(); return;
    }
  }
  paintReview();
}
function rpReveal(){
  rpStop();
  if(RP.judge&&!RP.result){
    const b=RV1[RV1.length-1], long=RP.judge.dir==='long';
    RP.result={exit:b.c,time:b.t,reason:'close',
               net:(long?b.c-RP.judge.entry:RP.judge.entry-b.c)-5};
  }
  if(RP.state!=='revealed'){
    TALLY.n++;
    if(RP.result) TALLY[RP.result.reason==='tp'?'tp':'sl']++;
    if(RP.judge&&T_RV&&RP.judge.dir===T_RV.dir) TALLY.same++;
  }
  RP.state='revealed'; RP.rev=RV1.length-1;
  paintReview();
}
function rpJudge(dir){
  if(RP.judge||RP.state==='revealed') return;
  const b=RV1[Math.min(RP.rev,RV1.length-1)], e=Math.round(b.c);
  const el=$('jnote');
  RP.judge={dir:dir,time:b.t,entry:e,tp:dir==='long'?e+100:e-100,
            sl:dir==='long'?e-100:e+100,note:el?el.value:RP.note};
  RP.state='holding';
  rpPlay();
}

function setTab(t){
  if(t===TAB) return;
  TAB=t;
  if(t!=='review') rpStop();
  $('tab-live').hidden=(t!=='live');
  $('tab-review').hidden=(t!=='review');
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-tab')===t);
  });
  if(t==='review'){ paintReview(); kkDraw(document.querySelector('#tab-review .cwrap')); }
  else { paintLive(); kkDraw($('cwrap')); }
}
document.addEventListener('click',function(e){
  const el=e.target;
  /* ---- demo 控制台 ---- */
  const tb=el.closest('[data-tab]'); if(tb){ setTab(tb.getAttribute('data-tab')); return; }
  const dv=el.closest('[data-v]');
  if(dv){ const v=dv.getAttribute('data-v');
    document.body.classList.remove('v-a','v-b','v-c'); document.body.classList.add('v-'+v);
    document.querySelectorAll('#dv button').forEach(b=>b.classList.toggle('on',b===dv));
    return; }
  const dm=el.closest('[data-m]');
  if(dm){ MARK=dm.getAttribute('data-m');
    document.querySelectorAll('#dm button').forEach(b=>b.classList.toggle('on',b===dm));
    paintLive(); paintReview(); return; }
  const dq=el.closest('[data-q]');
  if(dq){ QST=dq.getAttribute('data-q'); if(QST!=='live') POS=null;
    document.querySelectorAll('#dq button').forEach(b=>b.classList.toggle('on',b===dq));
    paintLive(); return; }
  const dr=el.closest('[data-r]');
  if(dr){ document.body.classList.toggle('rm',dr.getAttribute('data-r')==='1');
    document.querySelectorAll('#dr button').forEach(b=>b.classList.toggle('on',b===dr));
    return; }
  if(el.closest('#dreload')){ setTab('live'); boot(); return; }
  if(el.closest('#fold')){ document.body.classList.toggle('dock-min'); return; }

  /* ---- 心得 ---- */
  const ed=el.closest('[data-nedit]');
  if(ed){ const k=ed.getAttribute('data-nedit');
    NOTE={key:k,text:NOTEMAP[k]||''}; repaintAll(true);
    const ta=$('tnote'); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); }
    return; }
  if(el.closest('[data-nsave]')){
    const ta=$('tnote'), txt=ta?ta.value:NOTE.text, k=NOTE.key||'';
    const p=k.split('|');
    if(p.length===3) HIST.forEach(function(t){ if(t.date===p[1]&&t.time===p[2]) t.note=txt; });
    NOTE={key:null,text:''}; repaintAll(true); return;
  }
  if(el.closest('[data-ncancel]')){ NOTE={key:null,text:''}; repaintAll(true); return; }

  /* ---- 即時分頁 ---- */
  const ac=el.closest('[data-act]');
  if(ac){
    const a=ac.getAttribute('data-act');
    if(a==='long'||a==='short'){
      const e0=CHIPS.price;
      POS={dir:a,entry:e0,time:'11:29',tp:a==='long'?e0+100:e0-100,sl:a==='long'?e0-100:e0+100};
    } else if(a==='close'||a==='undo'){ POS=null; }
    else if(a==='noop'){ e.preventDefault(); return; }
    paintLive(); return;
  }
  const win=el.closest('[data-win]');
  if(win){ WIN=parseInt(win.getAttribute('data-win'),10); paintRight(); return; }
  if(el.closest('[data-pick]')){ pickOpen=!pickOpen; paintLive(); return; }
  const nv=el.closest('[data-nav]');
  if(nv){ goDay(nv.getAttribute('data-nav')==='-1'?RV_DATE:LIVE_DATE); return; }
  const dd=el.closest('[data-day]');
  if(dd){ const v=dd.getAttribute('data-day'); goDay(v||LIVE_DATE); return; }
  if(pickOpen&&!el.closest('.calbox')){ pickOpen=false; paintLive(); }

  /* ---- 回顧分頁 ---- */
  const md=el.closest('[data-mode]');
  if(md){ MODE=md.getAttribute('data-mode');
    document.querySelectorAll('#rmode button').forEach(b=>b.classList.toggle('on',b===md));
    RVIEW={n:MODE==='replay'?48:60,end:null,vz:1,voff:0}; RHOVER.i=null;
    if(MODE==='replay') rpReset();
    paintReview(); return; }
  const tf=el.closest('[data-tf]');
  if(tf){ TF=parseInt(tf.getAttribute('data-tf'),10); RVIEW.end=null; paintReview(); return; }
  const fl=el.closest('[data-rfilter]');
  if(fl){ FILTER=fl.getAttribute('data-rfilter'); paintReview(); return; }
  const pk=el.closest('[data-rpick]');
  if(pk){ SEL=parseInt(pk.getAttribute('data-rpick'),10); RVIEW.end=null; paintReview(); return; }
  const rd=el.closest('[data-rday]');
  if(rd){ RP.day=rd.getAttribute('data-rday'); rpReset(); paintReview(); return; }
  const sp=el.closest('[data-rspeed]');
  if(sp){ RP.speed=parseFloat(sp.getAttribute('data-rspeed'));
    if(RP.timer) rpPlay(); else paintReview(); return; }
  const sk=el.closest('[data-rseek]');
  if(sk&&RP.state!=='revealed'){
    const r=sk.getBoundingClientRect();
    const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    rpStop(); RP.rev=Math.max(1,Math.round(p*(RV1.length-1))); paintReview(); return;
  }
  const ra=el.closest('[data-ract]');
  if(ra){
    const a=ra.getAttribute('data-ract');
    if(a==='replayday'){ MODE='replay'; rpReset();
      document.querySelectorAll('#rmode button').forEach(b=>
        b.classList.toggle('on',b.getAttribute('data-mode')==='replay'));
      RVIEW={n:48,end:null,vz:1,voff:0}; paintReview(); return; }
    if(a==='rpplay'){ if(RP.state==='idle') RP.state='running'; rpPlay(); return; }
    if(a==='rppause'){ rpPause(); return; }
    if(a==='rpstep'){ rpStop(); rpStep(); return; }
    if(a==='rpback'){ rpStop(); rpStep(true); return; }
    if(a==='rphome'){ rpStop(); RP.rev=4; paintReview(); return; }
    if(a==='rpreveal'){ rpReveal(); return; }
    if(a==='rpagain'||a==='rpnext'){ rpReset(); paintReview(); return; }
    if(a==='jlong'){ rpJudge('long'); return; }
    if(a==='jshort'){ rpJudge('short'); return; }
  }
});

document.addEventListener('keydown',function(e){
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if(TAB==='live'){
    if(e.key==='ArrowLeft'){ goDay(RV_DATE); e.preventDefault(); }
    if(e.key==='ArrowRight'||e.key==='Home'){ goDay(LIVE_DATE); e.preventDefault(); }
    if(e.key==='Escape'&&pickOpen){ pickOpen=false; paintLive(); }
    return;
  }
  if(MODE==='replay'){
    if(e.key===' '){ e.preventDefault(); RP.timer?rpPause():rpPlay(); }
    if(e.key==='ArrowRight'){ e.preventDefault(); rpStop(); rpStep(); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); rpStop(); rpStep(true); }
    if(e.key==='ArrowUp'){ e.preventDefault(); rpJudge('long'); }
    if(e.key==='ArrowDown'){ e.preventDefault(); rpJudge('short'); }
    return;
  }
  const L=rvList(); if(!L.length) return;
  const at=L.map(x=>x.i).indexOf(SEL);
  if(e.key==='ArrowRight'){ SEL=L[Math.min(L.length-1,at+1)].i; paintReview(); e.preventDefault(); }
  if(e.key==='ArrowLeft'){ SEL=L[Math.max(0,at-1)].i; paintReview(); e.preventDefault(); }
  if(e.key==='r'||e.key==='R'){ MODE='replay'; rpReset();
    document.querySelectorAll('#rmode button').forEach(b=>
      b.classList.toggle('on',b.getAttribute('data-mode')==='replay'));
    paintReview(); }
});
function repaintAll(force){
  if(TAB==='live'){ paintRight(); }
  else { $('rpane').innerHTML=MODE==='replay'?paneReplay():paneReviewPane(); }
}
