  if(dy){
    dy.addEventListener('click',ev=>{
      const nv=ev.target.closest('[data-nav]');
      if(nv){ const v=+nv.getAttribute('data-nav'); return v===0?smDayClose():smDayStep(v); }
      if(ev.target===dy) smDayClose();          // 點到灰色背景 ⇒ 關掉
    });
    dy.addEventListener('keydown',ev=>{ if(ev.key!=='Enter'&&ev.key!==' ') return;
      const nv=ev.target.closest('[data-nav]'); if(!nv) return;
      ev.preventDefault(); const v=+nv.getAttribute('data-nav'); v===0?smDayClose():smDayStep(v); });
  }
  // ⭐ Esc 一次只退一層：先關「那天的圖」，再關「那一條的內頁」
  document.addEventListener('keydown',ev=>{
    const open=dy&&!dy.hidden;
    if(ev.key==='Escape'){ if(open) return smDayClose(); if(SM.det) smDetClose(); return; }
    if(open&&ev.key==='ArrowLeft'){ ev.preventDefault(); smDayStep(-1); }
    else if(open&&ev.key==='ArrowRight'){ ev.preventDefault(); smDayStep(1); }
  });
}
function smPaint(x){
  if(!x||!x.lanes){ smSet('smlanes',''); SM.keys=''; smSet('smfoot','<span>'+esc(SM.err||'讀取中…')+'</span>'); return; }
  SM.x=x;
  smSessInit(); smSegPaint();
  smSet('smnote',esc(x.note||''));
  // 條數／順序由後端決定。⚠️ 骨架只在「有哪幾條」變動時重建，平常每條各自比自己的字串
  //    —— 每分鐘把整塊 innerHTML 換掉會把捲動位置與剛畫好的內容一起丟掉。
  // ⭐ 只畫選到的那一盤（後端的 sess）；後端沒給 sess 的條 ⇒ 兩頁都畫（⛔ 不能因為少一個欄位就讓它消失）
  const keys=Object.keys(x.lanes).filter(k=>/^[a-z0-9_]+$/.test(k))
    .filter(k=>!x.lanes[k].sess||x.lanes[k].sess===SM.sess);
  if(SM.keys!==SM.sess+':'+keys.join('|')){
    SM.keys=SM.sess+':'+keys.join('|');
    const el=document.getElementById('smlanes');
    // role/tabindex：整張卡是一個可以點、也可以用鍵盤打開的東西（⛔ 不用 <button>：
    //    這一頁刻意一顆按鈕都沒有，而這只是導覽、不會動到任何資料）
    if(el){ el.innerHTML=keys.length?keys.map(k=>'<div class="sm-lane" id="sm-'+k+'" role="button" tabindex="0"></div>').join('')
      :'<div class="sm-empty">這一盤目前沒有模擬的策略</div>'; el._smh=null; }
  }
  keys.forEach(k=>smSet('sm-'+k,smLane(x.lanes[k])));
  const f=x.file||{};
  smSet('smcount',esc('算到 '+(x.last_step_at||'—')));
  const bad=(x.errors>0)||(f.bad>0)||(f.dup>0)||(f.eq_ok===false)||(x.hist_bad>0)||!x.wired;
  const foot='紀錄 '+(f.ok||0)+' 列'+(f.bad?'、壞列 '+f.bad:'')+(f.dup?'、重複 '+f.dup:'')
    +(f.eq_ok===false?'、⚠️ 列數對不上':'')+(x.hist_bad?'、fast_hist 壞列 '+x.hist_bad:'')
    +(x.wired?'':'、⚠️ 規則函式沒有接上')
    +(x.errors?'、背景錯誤 '+x.errors+' 次（最近：'+(x.last_err||'')+'）':'');
  const e=document.getElementById('smfoot'); if(e) e.classList.toggle('bad',!!bad);
  smSet('smfoot',esc(foot));
}
function smLoad(){
  const my=++SM.seq;
  fetch('/api/sim/state',{cache:'no-store'}).then(r=>r.json().catch(()=>({})).then(b=>({s:r.status,b}))).then(({s,b})=>{
    if(my!==SM.seq) return;
    if(s!==200){ SM.err=(b&&b.msg)||('模擬讀取失敗（'+s+'）'); smPaint(null); return; }
    // ⛔ 200 但看不懂 ⇒ 也要**說出來**：停在「讀取中…」等於安靜地壞掉（這個專案明令禁止）
    if(!b||!b.lanes){ SM.err='模擬讀取失敗（回應看不懂）'; smPaint(null); return; }
    SM.err=''; smPaint(b);
  }).catch(()=>{ if(my!==SM.seq) return; SM.err='模擬讀取失敗（連不到面板）'; smPaint(null); });
}
function smEnter(){
  smBind();
  smSessInit(); smSegPaint();
  smLoad();
  if(SM.timer) clearTimeout(SM.timer);
  const again=()=>{ SM.timer=null; if(TAB!=='sim') return; smLoad(); SM.timer=setTimeout(again,60000); };
  SM.timer=setTimeout(again,60000);
}

/* ══════════════ 迷你圖（【健檢】與【自動下單】共用）══════════════
   ⛔ 一份就好（兩頁各寫一份 ＝ 兩把尺）。紅上綠下、左舊右新（跟全站的紅漲綠跌一致）。 */
function sparkBars(vals,h){
  h=h||54;
  const n=(vals||[]).length; if(!n) return '';
  const W=600, bw=W/n; let mx=0;
  vals.forEach(v=>{ mx=Math.max(mx,Math.abs(Number(v)||0)); }); mx=mx||1;
  const mid=h/2;
  let s='<svg viewBox="0 0 '+W+' '+h+'" preserveAspectRatio="none" style="height:'+h+'px">'+
    '<line x1="0" y1="'+mid+'" x2="'+W+'" y2="'+mid+'" stroke="#242C38" stroke-width="1"/>';
  vals.forEach((v0,i)=>{
    const v=Number(v0)||0, hh=Math.abs(v)/mx*(mid-4), col=v>=0?'#EE5A54':'#34B37E';
    s+='<rect x="'+(i*bw+bw*0.18).toFixed(2)+'" y="'+(v>=0?mid-hh:mid).toFixed(2)+
       '" width="'+(bw*0.64).toFixed(2)+'" height="'+Math.max(1,hh).toFixed(2)+'" fill="'+col+'" rx="1"/>';
  });
  return s+'</svg>';
}
function sparkLine(vals,h,col){
  h=h||46; col=col||'#8D95A3';
  const n=(vals||[]).length; if(n<2) return '';
  const W=600, mx=Math.max.apply(null,vals), mn=Math.min.apply(null,vals), rg=(mx-mn)||1;
  const d=vals.map((v,i)=>(i?'L':'M')+(i/(n-1)*W).toFixed(1)+' '+(h-4-(v-mn)/rg*(h-8)).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 '+W+' '+h+'" preserveAspectRatio="none" style="height:'+h+'px">'+
    '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>';
}

/* ══════════════ 【健檢】分頁（2026-09-23 加）══════════════

   ⛔⛔ **這一頁不准出現預測、勝率、期望值、訊號強度、買賣建議**（CLAUDE.md 開頭那條鐵律）。
   ⛔⛔ **只打一次** GET /api/health/state（唯讀）——⛔ 不掛在 500ms 的 tick、
      ⛔ 也不掛在【自動下單】那條 5 秒輪詢上。後端整天快取（來源檔 mtime 當快取鍵）。
      唯一的例外：市場狀態那一區第一次要讀兩個大檔（後端背景執行緒在算）⇒
      `market_ready=false` 時隔 HC_RETRY 再問一次，⛔ 算完就停、⛔ 離開這一頁也停。
   ⛔ 一顆會動到錢的鈕都沒有：沒有表單、沒有送出鈕、沒有武裝那幾顆的觸發屬性、不打任何 POST。
   ⛔ 燈號、門檻、百分位**全部由後端決定**（health.py）——前端算一份就是第二把尺。 */
var HC={data:null, err:'', seq:0, timer:null, tries:0};
const HC_RETRY=3000, HC_TRIES=20;      /* 最多等 60 秒（⛔ 不無限重試） */
function hcPts(v){ return v==null?'—':((v>0?'+':v<0?'−':'')+Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:1})); }
function hcCls(v){ return v>0?'up':v<0?'down':'flat'; }
function hcNum(v,dp){ return v==null?'—':Number(v).toFixed(dp==null?2:dp); }

/* 一張策略卡。⛔ 筆數不足 ⇒ **留白**，⛔ 不准用比較少的筆數硬算一個數字。 */

    ((S.lamp_why||[]).length?'<div class="hc-why">'+(S.lamp_why||[]).map(esc).join('<br>')+'</div>':'');
  /* 真單那一半：⛔ 跟模擬**分開寫**，⛔ 不准混成一個數字。 */
  const R=S.real||null;

    return '<div class="hc-card">'+head+

  const half=(S.avg_all==null)?null:S.avg_all/2;
  return '<div class="hc-card'+((S.lamp==='y'||S.lamp==='r'||S.lamp==='rr')?' warn':'')+'">'+head+
    '<div class="hc-nums">'+
      '<div class="c"><div class="hc-k">全部平均</div>'+

        '<div class="hc-v '+hcCls(S.avg15)+'">'+hcPts(S.avg15)+'<small>點</small></div>'+
        '<div class="hc-d">'+(half==null?'每筆平均':('全部平均的一半＝'+hcPts(half)))+'</div></div>'+

      '<span>'+esc(S.src||'模擬')+'</span><span class="sep">・</span>'+
      '<span>'+esc(String(S.d0||'—'))+' ~ '+esc(String(S.d1||'—'))+'</span></div>'+
    real+'</div>';
}

/* 一張市場狀態小卡。⛔ 只放數字與位置；白話那一句（M.now）整句後端給，⛔ 前端不自己寫評語。 */
function hcMktCard(M){

    '<div class="v">'+hcNum(M.value,dp)+(M.unit?'<small>'+esc(M.unit)+'</small>':'')+'</div>'+
    /* ⭐ 2026-09-30 一眼看懂的那一句（Benson：「敘述再白話一點」） */
    (M.now?'<div class="hc-now">'+esc(M.now)+'</div>':'')+

    (M.why?'<div class="hc-lines" style="opacity:.85">'+esc(M.why)+'</div>':'')+

}

function hcFetch(){
  const my=++HC.seq;
  fetch('/api/health/state',{cache:'no-store'}).then(r=>r.json()).then(x=>{
    if(my!==HC.seq) return;
    if(!x||!x.ok){ HC.data=null; HC.err=(x&&x.msg)||'讀不到健檢'; hcPaint(); return; }
    HC.data=x; HC.err=''; hcPaint();
    /* ⛔ 只有「市場狀態還在背景算」才再問一次，⛔ 而且有次數上限（不無限重試）。 */
    if(!x.market_ready && x.market_busy && HC.tries<HC_TRIES){
      HC.tries++;
      if(HC.timer) clearTimeout(HC.timer);
      HC.timer=setTimeout(()=>{ HC.timer=null; if(TAB==='hc') hcFetch(); }, HC_RETRY);
    }
  }).catch(()=>{ if(my!==HC.seq) return; HC.data=null; HC.err='連不上面板'; hcPaint(); });
}
function hcEnter(){
  HC.tries=0;
  if(HC.timer){ clearTimeout(HC.timer); HC.timer=null; }
  hcFetch();
}

/* ══════════════ 【自動下單】分頁：會真的送出委託單的那一頁 ══════════════

   版面沿用【自動下單（模擬）】那一套（同樣的 .card / .sec-head / .at-title / .at-tbl），
   ⛔ 差別只有三件事，而且每一件都要**一眼看得到**：
     ① 現在是開還是關　② 選了哪個做法　③ 今天送了沒／為什麼沒送

   ⛔⛔ 這一段**一顆按鈕都沒有**（沒有 button／form／input／[data-act]／[data-rdir]），
        也**不打任何 POST**。開關只有一條路：他自己在硬碟上建 AUTO_ORDERS_ON。
        畫面上按得到的開關 ＝「會不會亂送單」從「讀一個檔」變成「讀整個前端」。
   ⛔ 顏色沿用這個面板的規矩：**紅綠只給損益**；開／關用金色與中性灰
      （關著是正常狀態，⛔ 不是紅色 —— 跟休市的連線燈同一個道理）。
   ⛔ 名字只寫「開盤快才做」（2026-09-15 起只剩這一個；以前是「5 分 K」「開盤起」），⛔ 畫面上不准出現 A／B 這種代號
      （【模擬】那一頁為這件事被退件過一次：「我要從哪裡知道現在我看的是哪個做法？」）。
   ⚠️ 這一頁不掛在 500ms 的 tick 上，只在切進來時抓 ＋ 停在這一頁時每 5 秒更新一次。
*/
var AL={data:null,err:'',pending:false,seq:0,timer:null};
/* ⭐ 「打開自動下單」的兩段式狀態（⛔ 只活在記憶體裡，⛔ 不寫 localStorage）：
     step='idle'    兩顆做法鈕
     step='confirm' 確認條（已經選了 mode，但**還沒**送出任何請求）
   ⛔ 切走分頁再回來一定要回到 'idle'（見 alEnter）——「我剛剛按到哪裡了」
      不可以跨分頁殘留，不然他回來時看到一條已經展開的確認條，
      很容易當成「我剛剛好像已經開了」而直接按下去。
   ⛔ 而且**不做逾時自動收回**：他可能中途去看別的分頁再回來（那條路由 alEnter 重設），
      在同一頁上等多久都不該讓畫面自己跳掉。 */
var ALON={step:'idle',mode:null,busy:false,err:''};
/* ⭐ 2026-09-24 風控規則 B 的「手動解除」—— 跟打開開關同一套兩段式規矩：
   第一段只換畫面（⛔ 零請求），第二段按「確定解除」才 POST /api/risk/override。 */
var RCAP={step:'idle',busy:false,err:'',ok:''};
/* 本月風控那張卡（#alcap）。⛔ 數字與那句話全部從後端 D.risk 來，前端不自己算。
   ⛔ 用金色／中性灰，⛔ 不准用紅綠（紅綠只給損益）。 */
function alCapHTML(R,L){
 if(!R||typeof R!=='object') return '';
 if(R.err) return '<div class="cap hit"><div class="hd"><span class="k">本月風控</span></div>'+
   '<div class="t">⚠️ '+esc(R.err)+' —— 算不出來的時候<b>不送單</b>（不猜）。</div></div>';
 const cap=Number(R.cap||0), pnl=Number(R.pnl||0), used=Number(R.used_pct||0);
 const fmt=v=>(v>0?'+':(v<0?'−':''))+Math.abs(Math.round(v)).toLocaleString();
 /* ⭐⭐ 2026-10-01 改版：這張卡變成「本月」—— 最上面是本月合計＋日盤／夜盤各多少。
    ⛔ 數字一律是後端 R.trades 每一口的點數（risk_cap.state，跟風控**同一份**），前端只照 sess 分組加總、⛔ 不另算。
    ⭐ 2026-10-21 Benson：上面「本月」大數字與日盤／夜盤兩行改看**每口**（lot_pts）；底下「本月風控」照舊看**合計**（pnl，上限也是合計）。
       舊後端沒有 lot_pts ⇒ 退回 pts（1 口時兩者相同）。 */
 const TR=Array.isArray(R.trades)?R.trades:[];
 const lp=t=>isFinite(Number(t.lot_pts))?Number(t.lot_pts):Number(t.pts);
 const grp=k=>{ const a=TR.filter(t=>t&&t.sess===k&&isFinite(lp(t))); return [a.reduce((x,t)=>x+lp(t),0),a.length]; };
 const gd=grp('day'), gn=grp('night'), nx=NF.data, lotTot=gd[0]+gn[0];

/* ⭐ ② 「現在的部位」（⛔ 唯讀、⛔ 一顆鈕都沒有）。

 /* ⭐ 2026-10-14 多口（LOTS-UI-SPEC §2.4）：qty>1 時大字單位「點／口」、kv 第一格「N 口合計」、底下一句「N 口一起」。

     ('<span>停損 / 停利 <b>'+(R.sl==null?'—':f(R.sl))+' / '+(P.no_tp?'不設停利':(R.tp==null?'—':f(R.tp)))+'</b></span>')))+'</div>'+

/* ⭐ ④ 「最近做得如何」。
   ⛔⛔ **不放勝率、不放期望值、不放勝敗場數**（CLAUDE.md 那條鐵律）。
   ⛔ 資料就是這一頁現有的那一份（帳本列 ＋ D.real 的出場價），⛔ 不新開端點、⛔ 不另寫一套算法。
   ⛔ 對不到出場的那幾天**不算一筆**（留白跟 0 點是兩回事）。 */
function alPts(D,days){
 const R=D.real||{}, out=[];
 /* days 是新到舊 ⇒ 反過來走，讓迷你柱狀圖左舊右新。 */
 for(let i=days.length-1;i>=0;i--){
   const r=days[i]; if(!r||r.rec!=='result'||!r.ok) continue;
   const X=R[r.date]; if(!X||X.state!=='ok'||!alN(X.points)) continue;
   out.push({date:r.date, k:r.date+' 09', mo:r.date, pts:X.points, q:(alN(X.qty)||alN(r.qty)||1)});
 }
 /* ⭐ 2026-10-14：夜盤那幾口也算進來（Benson：資料對不起來）——【本月風控】一直是日盤＋夜盤一起算，
    這裡只算日盤的話「本月合計」永遠跟它對不上。排序鍵用那一晚 E 的 21 點；
    ⚠️ 「本月」照**開盤那晚 E** 歸月（跟 risk_cap 規則③同一把尺：9/30 晚那口算 9 月）。 */
 const x=NF.data, NR=(x&&x.real)||{};
 ((x&&x.results)||[]).forEach(o=>{
   const E=String(o.E||''), X=NR[E]; if(!X||X.state!=='ok'||!alN(X.points)) return;
   out.push({date:E, k:E+' 21', mo:E, pts:X.points, q:(alN(X.qty)||alN(o.qty)||1), night:true});
 });
 out.sort((a,b)=>(a.k<b.k?-1:(a.k>b.k?1:0)));
 return out;
}
function alPerfPaint(D,days){

 const moRows=P.filter(x=>String(x.mo).slice(0,7)===mo);
 /* ⭐ 2026-10-21 Benson：本月合計也改**每口**（跟本月卡一致；錢看帳戶頁的金流明細）。 */
 const moSum=moRows.length?moRows.reduce((x,y)=>x+y.pts,0):null;
 setEl('alperfn', P.length?(P.length+' 筆算得出點數'):'還沒有算得出點數的紀錄');

}

/* ⭐ ⑤ 紀錄：日盤與夜盤**合併在同一份清單**（2026-09-23 v3）。
   ⚠️⚠️ 合併只發生在**畫面**上 —— 兩邊是**不同的帳本**（autofire/ vs nightfire/）、
      不同的端點、不同的 rule 命名空間，⛔ 不准合併檔案、⛔ 不准共用 rule。
   ⚠️ 夜盤帳本**沒有出場價**（出場在券商端成交，night_fire 那一側看不到）⇒
      夜盤那幾列的點數與出場價**留白**，⛔ 不猜、⛔ 不拿現價頂。
   每一列的 `.al-meta` 第一個詞就是規則名，一眼分得出是哪一套。 */
var ALF='all';
function nfCard(o){
 const dir=o.dir==='long'?'▲ 多':(o.dir==='short'?'▼ 空':'');
 const sent=(o.rec==='result');
 const E=String(o.E||''), closed=!sent&&nfClosed(NF.data,E);
 /* ⭐ 2026-10-14：送出了的那一晚，出場價與點數從後端比對 real_trades/ 的結果拿（⛔ 對不到照舊留白） */
 const R=(sent&&o.ok)?nfReal(NF.data,E):null, pts=R?alN(R.points):null;
 const tag=sent?(o.ok?(R?rwhy({reason:R.why}):'送出了'):'沒送成'):(o.rec==='eod'?'收盤':(closed?'休市':'沒送'));
 const px=sent&&o.entry!=null
   ? f(o.entry)+'<span class="arrow">&rarr;</span>'+(R&&alN(R.exit)!=null?f(R.exit):'—')+' <span class="tag">'+esc(tag)+'</span>'
   : '— <span class="tag">'+esc(tag)+'</span>';
 const why=closed?'國定假日沒有夜盤':String(o.msg||o.why||o.err||'');
 /* ⚠️ 收盤那一列沒有 `method` ⇒ 舊版一律掛成預設的「台積電快攻」（實測 10-13 晚寫錯）——改拿同一晚送出那一列的 */
 const sib=(o.rec==='eod')?(((NF.data&&NF.data.recent)||[]).filter(z=>z.rec==='result'&&String(z.E||'')===E)[0]||null):null;
 const meth=o.method||(sib&&sib.method)||null;
 const cls=(pts==null)?'':(pts>0?' win':' loss');
 /* ⭐ 2026-10-14 多口：同日盤那一套（×N 小標、右邊合計、meta 前面「N 口・每口」）；⛔ 1 口時一個字都不變 */
 const nq=(R&&alN(R.qty))||alN(o.qty)||1, multi=sent&&o.ok&&nq>1;
 /* ⚠️ 日期欄寫「那一晚」（E）＋「晚」：出場在隔天清晨，券商成績單記在隔天 —— 寫明是哪一晚才不會跟日盤錯開一天 */
 return '<div class="trade'+cls+'"><div class="tr-top">'+
   '<span class="tr-date">'+esc(E.slice(5))+' 晚</span>'+
   (dir?'<span class="dir '+(o.dir==='long'?'l':'s')+'">'+dir+'</span>':'')+
   (multi?'<span class="qty">×'+esc(String(nq))+'</span>':'')+
   '<span class="tr-px">'+px+'</span>'+
   '<span class="tr-res '+(pts==null?'na':(pts>0?'r-win':'r-loss'))+'">'+(pts==null?'—':pm(multi?pts*nq:pts))+'</span></div>'+
   '<div class="al-meta">'+(multi&&pts!=null?'<b>'+esc(String(nq))+' 口・每口 '+pm(pts)+'</b> · ':'')+esc(nfName(NF.data,meth))+
     (R?('・'+esc(String(o.entry_time||'').slice(0,5))+' → '+esc(String(R.exit_date||'').slice(5))+' '+esc(String(R.exit_time||'').slice(0,5)))
       :((sent&&o.ok)?'・04:58 平倉':''))+
     (why&&!R?' · '+esc(why):'')+'</div></div>';
}
function alRows(D,days,todayMerged){
 const out=[];
 /* ⛔ 照舊只印前 FIRE_REAL_DAYS（60）天 —— 跟後端 fire_real_pairs() 的天數是同一個數。 */
 days.slice(0,60).forEach(r=>out.push({kind:'day', date:String(r.date||''),
   html:alCard(D,r,!!(todayMerged&&r&&r.date===todayMerged))}));
 const x=NF.data;
 /* ⭐ 2026-10-14：那一晚已經對到出場（賺賠那一列寫得出點數）⇒ 「04:58 平倉完成」那一列不再重複列。 */
 if(x&&x.recent) x.recent.forEach(o=>{ if(o.rec==='eod'&&nfReal(x,String(o.E||''))) return;
   out.push({kind:'night', date:String(o.E||''), html:nfCard(o)}); });
 /* 兩份帳本合在一起要重新排序（新到舊）。⛔ 同一天時日盤排前面（它先發生）。 */
 out.sort((a,b)=>(a.date<b.date?1:(a.date>b.date?-1:(a.kind==='day'?-1:1))));
 return out;
}

/* 組標頭：左邊「日盤／夜盤 ＋ 做法名」、右邊狀態藥丸與「關閉」。 */

/* ⭐⭐ 關掉之前就要知道的事（規格 §2.7）：**已經開出去那一口不會跟著收回來**。

}
/* ── 日盤那一組：⛔ 沒有做法可以選 ───────────────────────────── */

   h+='<div class="al-conf'+(C.live?' real':'')+'">'+

     '<div class="btns2">'+

 else

/* 現在開著的那一條夜盤做法有沒有特別的出場安排要講（⛔ 句子由後端給，⛔ 前端不准照代號猜）。

/* ── 夜盤那一組：做法**單選** ＋ 開關 ───────────────────────── */

 });
 h+='</div><div class="al-selfoot">';
 /* ⭐ 2026-09-23：確認句**每條做法各一份**（x.arm_confirm[代號]）⇒ 拿「他正要打開的那一條」。
    ⛔ 拿不到那一條的 ⇒ 不畫確認鈕（跟日盤 alConf() 同一個規矩）。
    沒有在選的時候（只是要判斷「後端有沒有回報真錢／演練」）看清單第一條的那一份。 */
 const CS=(x.arm_confirm&&typeof x.arm_confirm==='object')?x.arm_confirm:{};
 const C=pend?(CS[pend]||null):(CS[(MS[0]||{}).k]||null);
 if(pend&&C&&typeof C.text==='string'){
   const R=MS.filter(m=>m.k===pend)[0]||{}, CU=MS.filter(m=>m.k===cur)[0]||{};
   const swap=(on&&pend!==cur);
   let q;
   if(swap)
     /* ⚠️⚠️ 換做法一定是「**先關再開**」，⛔ 不是覆蓋（後端已經開著再 on 會回 409）。 */
     q='要把夜盤的做法從<b>'+esc(CU.name||cur)+'</b>換成<b>'+esc(R.name||pend)+'</b>。'+
       '程式會<b>先關閉、再用新的做法重新開啟</b>（開關檔不覆蓋，只能先關再開）。'+
       '<span class="w2">已經進場的那一晚<b>不受影響</b> —— 照原本的做法（'+esc(CU.name||cur)+
       '）抱到 04:58。換的是<b>之後的晚上</b>。</span>'+
       /* 換過去之後是真錢還是演練，一樣要講（後端那一句，⛔ 前端不自己拼）。 */
       '<span class="w2">'+(C.live?'⚠️ ':'')+emb(C.text)+'</span>';
   else
     q=(C.live?'⚠️ ':'')+emb(C.text)+
       '<span class="w2">要用「<b>'+esc(R.name||pend)+'</b>」開始嗎？</span>';
   q+='<span class="w2">'+esc(R.rule||x.rule||'')+'</span>';
   if(R.beta&&R.note) q+='<span class="w2">&#9888; '+esc(R.name||pend)+' <b>'+esc(R.beta)+
     '</b>：'+esc(R.note)+'</span>';
   if(typeof R.risk==='string'&&R.risk) q+='<span class="w2">&#9888; '+emb(R.risk)+'</span>';
   h+='<div class="al-conf'+(C.live?' real':'')+'"><div class="q">'+q+'</div>'+
     '<div class="btns2">'+
       '<button class="btn go" data-nfyes="1"'+(NFON.busy?' disabled':'')+'>'+
         (NFON.busy?'處理中…':(swap?('確定，換成'+esc(R.name||pend)):'確定，打開'))+'</button>'+
       '<button class="btn no" data-nfno="1"'+(NFON.busy?' disabled':'')+'>取消</button>'+
     '</div></div>';
 } else if(on){
   h+=alOffNote('night')+
     (MS.length>1?'<div class="n" style="margin-top:7px">要換做法就點上面另一條 —— '+
       '<b>換做法也要按兩段</b>（會先關閉再重新開啟）。⛔ 兩條不能同時開。</div>':'');
 } else if(!C||typeof C.text!=='string'){
   h+='<div class="err">夜盤還不能從畫面上打開（後端沒有回報現在是真實下單還是演練）。'+
     esc(x.how_on||'')+'</div>';
 } else {
   h+='<div class="n">點一條做法就會跳出確認。這個開關<b>沒有有效期</b> —— '+
     '打開之後每個晚上都會看一次，直到你自己關掉。</div>';
 }
 if(NFON.err) h+='<div class="err">'+esc(NFON.err)+'</div>';
 if(x.errors) h+='<div class="err">夜盤背景出錯 '+esc(String(x.errors))+' 次：'+
   esc(x.last_err||'')+'</div>';
 if(NF.err) h+='<div class="err">'+esc(NF.err)+'</div>';
 return h+'</div></div>';
}
/* 夜盤第二段真的送出去。⛔ 跟日盤走**同一個出口** pfetch()（自訂標頭＋token 一份就好）。 */
function nfArm(){
 if(NFON.busy) return;
 const m=NFON.mode;
 if(!m){ NFON.step='idle'; NFON.err='沒有選到做法，請再按一次'; alPaint(); return; }
 NFON.busy=true; NFON.err=''; alPaint();
 /* ⚠️⚠️ **換做法一定是「先關再開」，⛔ 不是覆蓋**：後端在開關檔已經存在時
    `POST /api/nightfire/on` 會回 **409**（`O_CREAT|O_EXCL`，⛔ 結構上不覆蓋）。
    ⛔ 所以畫面不可以做成「一鍵切換」——那是後端做不到的事。
    ⚠️ 中間那一瞬間是**真的關著**。`off` 成功但 `on` 失敗 ⇒ 結果是「關著」，
       ⛔ 不是「維持舊的」⇒ 訊息一定要明講（⛔ 不准只寫「切換失敗」）。
    ⛔ 而且**不做自動回復**（失敗就把舊做法重新開回去）：自動幫他重新武裝真錢
       比停在關著更危險（PM Q5 裁示）。 */
 const x=NF.data, wasOn=!!(x&&x.on), curName=x?nfName(x,x.method):'';
 const newName=x?nfName(x,m):m;
 const send=()=>pfetch('/api/nightfire/on',JSON.stringify({mode:m}))
  .then(r=>r.json()
    .catch(()=>({ok:false,msg:'面板回了看不懂的東西（HTTP '+r.status+'）'}))
    .then(j=>Object.assign({},j,{_code:r.status})));
 const first=wasOn
   ? pfetch('/api/nightfire/off').then(r=>r.json().catch(()=>({ok:false,msg:'關不掉'})))
   : Promise.resolve({ok:true});
 first.then(r0=>{
   if(!(r0&&r0.ok)){
     NFON.busy=false; NFON.step='idle'; NFON.mode=null;
     NFON.err='沒有換成「'+newName+'」：舊的那一條關不掉（'+((r0&&r0.msg)||'')+
       '），現在還是「'+curName+'」。';
     return null;
   }
   return send();
 }).then(r=>{
   if(r===null) return;
   NFON.busy=false; NFON.step='idle'; NFON.mode=null;
   if(r&&r.ok){ NFON.err=r.warn||''; return; }
   NFON.err=wasOn
     /* ⛔ 這句話是 `esc()` 之後印出去的 ⇒ ⛔ 不准放 HTML／Markdown 星號（會原樣印在他臉上）。 */
     ? ('⚠️ 已經關閉，但沒有換成「'+newName+'」（'+((r&&r.msg)||'打不開')+
        '）—— 夜盤現在是關著的。')
     : ((r&&r.msg)||'打不開');
 }).catch(()=>{ NFON.busy=false; NFON.step='idle'; NFON.mode=null;
   NFON.err=wasOn?('⚠️ 連不上面板 —— 夜盤可能已經關閉而且沒有換成「'+newName+
                   '」，請看上面的狀態。'):'打不開：連不上面板'; })
  .then(()=>nfFetch(true));
}

/* ⭐⭐ 「打開自動下單」——**這是這個面板上唯一一顆會武裝真錢的鈕**。
   ⛔ 兩段式：第一段（選做法）**一個請求都不送**，只把畫面換成確認條；
      第二段按「確定，打開」才會真的打 POST /api/fire/on。
   ⛔ 確認條那句話（真錢／演練）**只從後端拿**（D.arm_confirm.text），
      ⛔ 前端不准自己判斷 —— 這一頁另外有 D.live，但那句話的措辭是後端的正本，
      兩邊各寫一份就一定有一份是舊的。
   ⛔ 後端沒回 arm_confirm ⇒ **不畫開啟鈕**（我們連現在是不是真錢都不知道，
      這種時候給他一顆按鈕比不給更糟）。 */
/* 拿「他正要打開的那個做法」的確認條正本。⛔ 沒有就回 null（呼叫端不准畫按鈕）。 */
function alConf(D,m){
  const C=(D&&D.arm_confirm)||null;
  if(!C||typeof C!=='object') return null;
  const one=C[m];
  return (one&&typeof one.text==='string')?one:null;
}
/* 這個做法的完整規則那句話（⛔ 正本在後端 fire_rule_line()，前端只負責顯示）。 */
function alRuleFull(D,m){ const c=alConf(D,m); return c?String(c.rule_line||''):''; }

/* ⭐ 第二段真的送出去。⛔ 六道防護裡有兩道是請求要帶的（自訂標頭 ＋ token）——
   ⛔ 少帶一個後端就會擋（403），那是刻意的：**別的網頁帶不出這兩樣**。
   ⚠️ 2026-09-09：改走跟其他每一顆鈕**同一個** `pfetch()` 出口 ——
      這一頁自己寫一份標頭 ＝ 兩把尺，總有一天有一邊沒跟上。 */
function alArm(){
 if(ALON.busy) return;
 const m=ALON.mode;
 /* ⛔ 只准送**後端自己列出來的**那幾個做法（⛔ 不准在前端寫死 'A'）——
    2026-09-17 起有兩個（A 快攻回馬槍／U 多方聯軍），寫死就等於新做法按不動。
    ⚠️ 後端 `fire_arm_on()` 還會再驗一次（那才是最後一道），這裡只是不送明顯錯的。 */
 const MS=((AL.data||{}).methods)||[];
 if(!m||!MS.some(x=>x.k===m)){ ALON.step='idle'; ALON.mode=null;
   ALON.err='沒有選到做法，請再按一次'; alPaint(); return; }
 ALON.busy=true; ALON.err=''; alPaint();
 pfetch('/api/fire/on',JSON.stringify({mode:m}))
  .then(r=>r.json()
    .catch(()=>({ok:false,msg:'面板回了看不懂的東西（HTTP '+r.status+'）'}))
    .then(j=>Object.assign({},j,{_code:r.status})))
  .then(r=>{ ALON.busy=false; ALON.step='idle'; ALON.mode=null;
    /* ⛔ 成功也可能有話要說（例如那一列紀錄沒寫進去）——不可以安靜地吞掉。 */
    /* ⚠️ token 是每次啟動換一次的：面板剛被看門狗重開過的話，畫面上這一份是舊的
       ⇒ 後端會擋（403）。⛔ 後端刻意不講「你是哪一道沒過」（那顆鈕沒有讓外面除錯的
       需求）。⚠️ 2026-09-09：那句人話**搬進 `pfetch()`**（`P403`）——
       十條路由都可能 403，一頁補一句就是十把尺，總有一頁沒補到。
       所以這裡直接用 `r.msg` 就好，⛔ 不要再自己接一句（會變成兩句疊在一起）。 */
    ALON.err=(r&&r.ok)?(r.warn||''):((r&&r.msg)||'打不開'); })
  .catch(()=>{ ALON.busy=false; ALON.step='idle'; ALON.mode=null;
    ALON.err='打不開：連不上面板'; })
  /* 按完立刻重抓狀態 —— 他要看得到「真的開起來了」，不是相信一句話。 */
  .then(()=>alFetch());
}

/* ⭐ 【自動下單】會改變狀態的動作只有兩個：打開（兩段式）與關閉（一鍵）。
   ・關掉**不跳確認**：那是安全方向（沿用真實下單那邊「平倉不跳確認」同一個道理）。
   ・打開**一定跳確認**：⛔ 這個不對稱是刻意的，不要「順手統一」。
   ・按完立刻重抓狀態 —— 他要看得到結果，不是相信一句 alert。 */
document.addEventListener('click', function(e){
 if(TAB!=='fire') return;
 /* 紀錄的日盤／夜盤篩選（⛔ 純畫面，⛔ 一個請求都不送）。 */
 const ch=e.target.closest('[data-alf]');
 if(ch){ ALF=ch.getAttribute('data-alf'); alPaint(); return; }
 /* ⭐ 風控「手動解除」：第一段 ⛔ 零請求；第二段才 POST。 */
 const rc=e.target.closest('[data-rcon]');
 if(rc){ RCAP.step='confirm'; RCAP.err=''; RCAP.ok=''; alPaint(); return; }
 /* ⭐ 2026-10-14 口數：升級第一段 ⛔ 零請求（只換畫面＋把確認條捲到眼前）；第二段才 POST；撤回一鍵。 */
 const uo=e.target.closest('[data-upon]');
 if(uo){ if(uo.disabled) return; LTUP.step='confirm'; LTUP.err=''; LTUP.ok=''; alPaint();
   const cf=document.querySelector('#allots .lt-act .al-conf'); if(cf) cf.scrollIntoView({behavior:'smooth',block:'nearest'});
   return; }
 const un=e.target.closest('[data-upno]');
 if(un){ if(un.disabled) return; LTUP.step='idle'; LTUP.err=''; alPaint(); return; }
 const uy=e.target.closest('[data-upyes]');
 if(uy){ if(uy.disabled) return; ltArm(); return; }
 const ur=e.target.closest('[data-ltrev]');
 if(ur){ if(ur.disabled) return; ltRevoke(); return; }
 const uj=e.target.closest('[data-ltjump]');
 if(uj){ const c=document.getElementById('allots'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'}); return; }
 const us=e.target.closest('[data-ltseen]');
 if(us){ ltHide(+us.getAttribute('data-ltseen')); alPaint();
   if(LTALARM && ltVisible(LTALARM).length===0){ const fb=document.querySelector('.tabs button[data-tab="fire"]'); if(fb) fb.classList.remove('ltdot'); }
   return; }
 const rn=e.target.closest('[data-rcno]');
 if(rn){ if(rn.disabled) return; RCAP.step='idle'; RCAP.err=''; alPaint(); return; }
 const ry=e.target.closest('[data-rcyes]');
 if(ry){ if(ry.disabled) return; rcArm(); return; }
 /* 第一段：⛔ 只換畫面，**一個請求都不送**（fire-tab.mjs ⑪ 在守）。 */
 const on=e.target.closest('[data-alon]');
 if(on){ if(on.disabled) return;
   ALON.step='confirm'; ALON.mode=on.getAttribute('data-alon'); ALON.err='';
   alPaint(); return; }
 /* 取消：⛔ 要真的回到兩顆鈕的狀態（不是只把條子藏起來）。 */
 const no=e.target.closest('[data-alno]');
 if(no){ if(no.disabled) return;
   ALON.step='idle'; ALON.mode=null; ALON.err=''; alPaint(); return; }
 const yes=e.target.closest('[data-alyes]');
 if(yes){ if(yes.disabled) return; alArm(); return; }
 /* 「到開關」＝**純導覽**：⛔ 一個請求都不送，只把最底下那張卡捲到眼前。 */
 const jp=e.target.closest('[data-aljump]');
 if(jp){ const c=document.getElementById('alswitchcard');
   if(c){ c.open=true; c.scrollIntoView({behavior:'smooth',block:'start'}); } return; }
 /* ⭐ 夜盤那幾顆：⛔ 跟日盤同一套規矩（第一段零請求、第二段才 POST、關不跳確認）。
    ⛔⛔ 開著時點**目前那一條** ⇒ 什麼都不做（⛔ 不跳確認、⛔ 零請求）。 */
 const non=e.target.closest('[data-nfon]');
 if(non){ if(non.disabled) return;
   const k=non.getAttribute('data-nfon'), x=NF.data;
   if(x&&x.on&&x.method===k){ NFON.step='idle'; NFON.mode=null; NFON.err=''; alPaint(); return; }
   NFON.step='confirm'; NFON.mode=k; NFON.err='';
   alPaint(); return; }
 const nno=e.target.closest('[data-nfno]');
 if(nno){ if(nno.disabled) return;
   NFON.step='idle'; NFON.mode=null; NFON.err=''; alPaint(); return; }
 const nyes=e.target.closest('[data-nfyes]');
 if(nyes){ if(nyes.disabled) return; nfArm(); return; }
 const noff=e.target.closest('[data-nfoff]');
 if(noff){ if(noff.disabled) return;
   noff.disabled=true;
   pfetch('/api/nightfire/off')
    .then(r=>r.json())
    .then(r=>{ if(!r.ok&&r.msg) alert(r.msg); })
    .catch(()=>{ alert('關不掉：連不上面板'); })
    .then(()=>{ noff.disabled=false; nfFetch(true); });
   return; }
 const b=e.target.closest('[data-aloff]');
 if(!b||b.disabled) return;
 b.disabled=true;
 pfetch('/api/fire/off')
  .then(r=>r.json())
  .then(r=>{ if(!r.ok&&r.msg) alert(r.msg); })
  .catch(()=>{ alert('關不掉：連不上面板'); })
  .then(()=>{ b.disabled=false; alFetch(); });
});

function alTodayHTML(D,r){

         '開關是關著的，'+esc(D.signal_at||'')+' 一到會在紀錄裡留一列「沒送」。')+'</div>';

 }
 if(r.rec==='result'&&r.ok){

   return '<div class="t">'+head+'：'+esc(alRecName(D,r)||'')+(leg?'・'+esc(leg):'')+' → '+esc(dir)+

     (done?('　出場 <b>'+esc(alF(R.exit))+'</b>'+

          :(/* ⭐ 「開箱」那一口**沒有停利**（r.no_tp）⇒ ⛔ 不可以印一個空的停利格 */
            (r.no_tp?'　停利 <b>不設</b>':'　停利 <b>'+esc(alF(r.tp))+'</b>')+

     /* 回馬槍那一口的參考價是 09:15 的價（帳本 p15），⛔ 不可以標成 09:03:30 的價 */

 const nq=(R&&alN(R.qty))||alN(r.qty)||1, multi=sent&&nq>1;

/* ⚠️ 2026-09-23 v3：舊的 alTblHTML() 併進 alRows()（日盤與夜盤合併成同一份清單）。
   ⛔ `days.slice(0,60)` 那個 60 跟後端 `FIRE_REAL_DAYS` 是**同一個數**：後端只對那幾天
      比對出場，多印一天就會有一張永遠寫「對不起來」的卡（而那是假的）——現在寫在 alRows()。 */

/* ⛔ 常態統計不畫；**異常**才畫（沿用【模擬】那一頁 atNotesHTML 的規矩）。
   ⛔ 但「異常」一項都不准少 —— 安靜地少是這個專案明令禁止的失敗模式。 */
function alNotesHTML(D,days){
 const L=D.ledger||{}, out=[];
 /* ⛔ fire + result + skip + eod + wait + bad ＝ 檔案總列數（收盤平倉那一列、等 09:15 那一列也要有去處）。 */
 const tot=alN(L.total)||0, sum=(alN(L.fire)||0)+(alN(L.result)||0)+(alN(L.skip)||0)+
   (alN(L.eod)||0)+(alN(L.wait)||0);
 if(alN(L.bad)) out.push('讀不出來的紀錄 '+L.bad+' 列');
 if(tot&&sum+(alN(L.bad)||0)!==tot) out.push('⚠️ 帳本對不起來：檔案 '+tot+' 列、認得的只有 '+sum+' 列');
 const stuck=days.filter(r=>r&&r.rec==='fire').length;
 if(stuck) out.push('⚠️ 有 '+stuck+' 天停在「送出去了但不知道結果」，請自己到大戶投確認');
 /* ⛔ 收盤沒平掉／不敢動的日子要**單獨數出來**：那幾天的部位是抱過夜盤的。 */
 const eodBad=days.filter(r=>r&&r.eod&&r.eod.alarm).length;
 /* ⚠️ 這一句⛔ 不要再列舉原因（2026-09-09：`eod_cant_tell` 加進來時這裡差點漏掉——
    列舉式的文案每多一種結局就要記得改一次，而它不會有任何東西提醒你）。
    每一天為什麼沒平，那一列自己那句話（why_msg）寫得清清楚楚。 */
 if(eodBad) out.push('⚠️ 有 '+eodBad+' 天收盤沒有自動平掉（原因看那一天的紀錄）'+
   '，請自己到大戶投確認那幾天的部位');
 /* ⛔⛔ 「對不到出場紀錄」要**示警但不擋**（2026-09-10）：那一天的卡片上是留白的，
    而**留白跟「那口其實沒平掉」長得一模一樣** —— 不講的話他只會覺得畫面壞了，
    講了他才知道要去大戶投看。⛔ 這跟上面那條「收盤沒平掉」是兩件事，不准併成一句
    （一個是程式知道自己沒平，一個是程式對不上帳）。 */
 const R=D.real||{};
 const nomatch=days.filter(r=>r&&R[r.date]&&
   (R[r.date].state==='none'||R[r.date].state==='many')).length;
 if(nomatch) out.push('⚠️ 有 '+nomatch+' 天對不到出場紀錄（那幾天的出場價與點數留白），'+
   '請自己到大戶投確認');
 /* 模擬那邊有記、這邊卻連一列都沒有 ⇒ 兩頁不同步（面板版本不一致或接線掉了） */
 const miss=Object.keys(D.sim||{}).filter(d=>!days.some(r=>r&&r.date===d)).length;
 if(miss) out.push('模擬那一頁有 '+miss+' 天，這裡沒有對應的紀錄');
 if(D.armed&&!D.started) out.push('⚠️ 開關是開的，但送單執行緒沒有起來');
 if(D.armed&&!D.wired) out.push('⚠️ 開關是開的，但面板沒有把自動下單接起來');
 return out.map(t=>'<span>'+esc(t)+'</span>').join('<span class="sep">·</span>');
}

 /* ⭐ 2026-10-22 B 版：本月一個主角大數字＋三個組成；月初 → 月底（或現在）照後端每天的 start_bal／bal */
 const last=DS.length?DS[DS.length-1]:null, first=DS.length?DS[0]:null;

 DS.forEach(d=>{

   h+='<div class="dc"><div class="dh2"><span class="dt">'+esc(d.date.slice(5))+'<small>週'+esc(d.wd||'')+'</small></span>'+

   let fee=0;
   (d.items||[]).forEach((x,j)=>{
     if(x.k==='dep'){
       /* ⭐ 2026-11-12 出金（金額 < 0）標「出金」、圖示「－」；原本一律寫入金 */

     }else if(x.k==='fee'){

       h+='<button class="row2'+(op?' open':'')+'" data-cfo="'+esc(key)+'"><span class="ico '+(nt?'n':'d')+'">'+(nt?'☾':'☀')+'</span>'+
          '<span class="nm"><b>'+esc(x.name||'')+' '+esc(x.dir||'')+'</b><small>'+cfAmt(x.pts)+' 點 × '+esc(x.qty)+' 口'+
          (x.night?'・'+esc(x.night):'')+'</small></span><span class="amt '+cfCls(x.amt)+'">'+cfAmt(x.amt)+'</span><span class="ar">›</span></button>';
       if(op) h+='<div class="det">進場 <b>'+esc(x.entry==null?'—':Math.round(x.entry))+'</b>　'+esc(x.entry_time||'')+'<br>'+
          '出場 <b>'+esc(x.exit==null?'—':Math.round(x.exit))+'</b>　'+esc(x.exit_time||'')+'　'+esc(x.why||'')+'<br>'+
          cfAmt(x.pts)+' 點 × '+esc(x.qty)+' 口 × 10 元 ＝ <b>'+cfAmt(x.amt)+'</b></div>';

   h+='<div class="bal2">結餘 '+Math.round(d.bal).toLocaleString('en-US')+'</div></div>';
 });
 if(!DS.length) h+='<div class="empty">這個月還沒有金流。</div>';

/* ══════════ ⭐ 2026-10-21【系統】分頁（從【帳戶總覽】搬過來：連線／流量／五檔／備份）══════════
   ⛔ 唯讀、零按鈕；句子與燈號全是後端的（s.conn／s.quote／s.equity.usage／depth／backup）。
   異常 ⇒ 分頁亮小金點（sysWarn）。 */
const SYS_USAGE_WARN=80;
function sysWarn(s){
 if(!s) return false;
 const E=s.equity||{}, c=s.conn||{}, u=E.usage||{};
 return c.ok===false || s.quote==='nodata' || (u.pct!=null&&u.pct>=SYS_USAGE_WARN) ||
   !!(E.depth&&E.depth.warn) || !!(E.backup&&E.backup.warn);
}
function sysHTML(s){
 if(!s) return '';
 const E=s.equity||{}, c=s.conn||{}, q=s.quote, age=s.age_sec;
 const qOK=q==='live', bad=c.ok===false||q==='nodata';
 const qWord=c.ok===false?'連不上券商':(q==='live'?'報價正常':(q==='nodata'?'盤中收不到報價':'休市中'));
 const card1='<div class="ac sc"><div class="k">券商連線</div><div class="big'+(bad?' warn':'')+'">'+

   '<div class="row"><span>最後一筆報價</span><b>'+(age==null?'—':(age<5?'剛剛':esc(age)+' 秒前'))+'</b></div>'+
   (c.ok===false?'<div class="row"><span>斷線從</span><b>'+esc(c.since||'—')+'</b></div>'+
     (c.last_error?'<div class="msg">'+esc(c.last_error)+'</div>':''):
     '<div class="row"><span>連線</span><b>正常</b></div>')+'</div>';
 const u=E.usage||{}, uw=(u.pct!=null&&u.pct>=SYS_USAGE_WARN);
 const card2='<div class="ac sc"><div class="k">券商流量</div>'+
   (u.mb!=null?('<div class="big'+(uw?' warn':'')+'">'+esc(Math.round(u.mb))+' MB<small>／上限 '+
     esc((u.limit_mb||0).toLocaleString('en-US'))+' MB</small></div>'+
     '<div class="pbar'+(uw?' warn':'')+'"><i style="width:'+Math.min(100,Number(u.pct)||0).toFixed(1)+'%"></i></div>'+
     '<div class="row"><span>用了</span><b>'+esc(u.pct==null?'—':Number(u.pct).toFixed(1)+'%')+'</b></div>'+
     '<div class="row"><span>更新</span><b>'+esc(u.at||'—')+'</b></div>'):
     '<div class="msg">'+esc(u.msg||'還沒問到')+'</div>')+'</div>';
 const d=E.depth||{};
 const card3='<div class="ac sc"><div class="k">五檔錄製</div><div class="big'+(d.warn?' warn':'')+'">'+
   (d.warn?'⚠ 有狀況':(d.msg?'錄製中':'—'))+'</div><div class="msg">'+esc(d.msg||'還沒有狀態')+'</div></div>';
 const b=E.backup||{};
 const card4='<div class="ac sc"><div class="k">資料備份</div><div class="big'+(b.warn?' warn':'')+'">'+
   (b.warn?'⚠ 要看一下':(b.ok?'✓ 正常':'—'))+'</div><div class="msg">'+esc(b.msg||'還沒有狀態')+'</div></div>';
 return '<div class="sysgrid">'+card1+card2+card3+card4+'</div>';
}

/* ══════════ ⭐ 2026-10-21 右上角鈴鐺「要注意的事」══════════
   Benson：所有需要我注意的提醒都放在裡面。⛔ 內容＝手機「要注意的事」同一份（GET /api/notice，唯讀）。
   頁面上的一般金條（口數那幾則）已經收進來、不再出現在頁面；只有「有部位又出事」的緊急警報（#xal）畫面上照樣跳。
   「有空再看」可以按知道了（記在 lt_seen，跟原本金條的 ✕ 同一把鑰匙）；要馬上處理／要你決定 ⛔ 不給關。 */
const BELL={items:[],err:''};
/* ⭐ 2026-11-09 Benson：「這個提醒看過就可以關掉了」⇒ 每一則都能按「知道了」。
   ・有空再看（hide）：照舊永久記在 lt_seen。
   ・要馬上處理／要你決定：只在**這件事還在的這段時間**收起來（BELLACK）；後端那則消失 ⇒ 鑰匙自動忘掉，
     下次再出事會重新亮。鑰匙把數字拿掉（「報價斷了 37 秒」秒數一直在變，⛔ 不然按了等於沒按）。
   ⛔ 畫面上有部位又出事的緊急警報（#xal）不歸鈴鐺管，照樣跳；手機推播也不受影響。 */
const BELLACK_KEY='bell_ack';
let BELLACK=(()=>{ try{ const v=JSON.parse(localStorage.getItem(BELLACK_KEY)||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } })();
function bellAckKey(x){ return String(x.key||'').replace(/[0-9][0-9,.:]*/g,'#'); }
function bellAckSave(){ try{ localStorage.setItem(BELLACK_KEY,JSON.stringify(BELLACK.slice(-60))); }catch(_){} }
function bellAckPrune(){
 const live=new Set((BELL.items||[]).filter(x=>!x.hide).map(bellAckKey));
 const keep=BELLACK.filter(k=>live.has(k));
 if(keep.length!==BELLACK.length){ BELLACK=keep; bellAckSave(); }
}
const BELL_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
function bellVisible(){ return (BELL.items||[]).filter(x=>x.hide?!LTSEEN.includes(x.key):!BELLACK.includes(bellAckKey(x))); }
function bellPaintBtn(){
 const b=document.getElementById('anbell'); if(!b) return;
 const n=bellVisible().length;
 b.classList.toggle('has', n>0);
 b.innerHTML=BELL_SVG+(n?'<span class="bdg">'+n+'</span>':'');
}
function bellFetch(){
 return fetch('/api/notice',{cache:'no-store'}).then(r=>r.json()).then(x=>{
   if(x&&x.ok){ BELL.items=x.items||[]; BELL.err=''; bellAckPrune(); } else BELL.err=(x&&x.msg)||'讀不到要注意的事';
   bellPaintBtn(); if(!document.getElementById('bellpop').hidden) bellList();
 }).catch(()=>{ BELL.err='連不上面板'; bellPaintBtn(); });
}
function bellList(){
 const p=document.getElementById('bellpop'), b=document.getElementById('anbell');
 const r=b.getBoundingClientRect();
 p.style.top=(r.bottom+10)+'px'; p.style.right=Math.max(12,window.innerWidth-r.right)+'px';
 const V=bellVisible();
 let h='<div class="an-ih"><b>要注意的事</b><span>'+(V.length?V.length+' 件':'沒有')+'</span></div>';
 if(BELL.err) h+='<div class="an-empty">'+esc(BELL.err)+'</div>';
 else if(!V.length) h+='<div class="an-empty">現在沒有要注意的事。</div>';
 else [['now','要馬上處理'],['decide','要你決定'],['later','有空再看']].forEach(g=>{
   const L=V.filter(x=>x.lvl===g[0]); if(!L.length) return;
   h+='<div class="bl-grp">'+g[1]+'</div>'+L.map(x=>'<div class="bl-n '+esc(x.lvl)+'"><i></i><div><div class="t">'+esc(x.text)+'</div>'+
     (x.act?'<div class="a">→ '+esc(x.act)+'</div>':'')+'</div>'+
     '<button data-bellx="'+esc(x.key)+'" title="'+(x.hide?'知道了，不再顯示這則':'知道了，先收起來（這件事解決後又發生會再亮）')+'">知道了 ✕</button></div>').join('');
 });
 h+='<div class="bl-ft">跟手機「要注意的事」是同一份清單。要馬上處理、要你決定的事情按了「知道了」會先收起來，解決後再發生會重新亮。</div>';
 p.innerHTML=h; p.hidden=false;
}
document.addEventListener('click',function(e){
 const bb=e.target.closest('#anbell');
 if(bb){ const p=document.getElementById('bellpop'); if(p.hidden){ bellList(); bellFetch(); } else p.hidden=true; return; }
 const x=e.target.closest('[data-bellx]');
 if(x){ const k=x.getAttribute('data-bellx'); const it=(BELL.items||[]).find(i=>i.key===k);
   if(it&&!it.hide){ const ak=bellAckKey(it); if(!BELLACK.includes(ak)) BELLACK.push(ak); bellAckSave(); }
   else { if(!LTSEEN.includes(k)) LTSEEN.push(k);
   LTSEEN=LTSEEN.slice(-60); try{ localStorage.setItem(LTSEEN_KEY,JSON.stringify(LTSEEN)); }catch(_){} }
   bellPaintBtn(); bellList(); return; }
 const p=document.getElementById('bellpop');
 if(p&&!p.hidden&&!e.target.closest('#bellpop')) p.hidden=true;
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ const p=document.getElementById('bellpop'); if(p) p.hidden=true; } });
bellPaintBtn(); bellFetch(); setInterval(bellFetch,30000);

/* ⭐ 2026-10-20 老闆：「說明性文字太多 ⇒ 收進 i 圖示，滑鼠移過去再顯示」。
   ・畫面上留：數字、現在的狀態、要他處理的事；ⓘ 裡放：名詞解釋、怎麼算的、規則。
   ・⛔ 警示（.warn／al-alarm）一律留在畫面上，⛔ 不准收進 ⓘ。
   ・純 CSS hover／focus 顯示；靠右邊會超出畫面時由下面那個 mouseover 往左翻。 */
function tipI(html){ return html?'<span class="ti" tabindex="0" aria-label="說明"><span class="ic">i</span><span class="tb">'+html+'</span></span>':''; }
function tipSplit(t){ t=String(t||''); const i=t.indexOf(' —— '); return i<0?[t,'']:[t.slice(0,i),t.slice(i+4)]; }
function tipPlace(t){
 /* ⛔ 卡片多半是 overflow:hidden ⇒ 說明框用 position:fixed 浮在最上層，位置照圖示算（左右夾在畫面內、下面放不下就放上面） */
 const b=t.querySelector('.tb'); if(!b) return;
 const r=t.getBoundingClientRect(), w=b.offsetWidth, h=b.offsetHeight, W=window.innerWidth, Hh=window.innerHeight;
 let x=Math.max(8,Math.min(r.left-10,W-w-8)), y=r.bottom+6;
 if(y+h>Hh-8) y=Math.max(8,r.top-h-6);
 b.style.left=x+'px'; b.style.top=y+'px';
}
document.addEventListener('mouseover',function(e){ const t=e.target.closest&&e.target.closest('.ti'); if(t) tipPlace(t); });
document.addEventListener('focusin',function(e){ const t=e.target.closest&&e.target.closest('.ti'); if(t) tipPlace(t); });
document.addEventListener('click',function(e){
 /* ⓘ 放在可以展開的標題（<summary>）裡 ⇒ 點 ⓘ 不要順便把整區展開／收起 */
 if(e.target.closest&&e.target.closest('.ti')&&e.target.closest('summary')) e.preventDefault();
});

/* ⭐ 2026-10-20【帳戶】目標卡那一句口數通知的 ✕（跟【自動下單】金條同一把鑰匙；⛔ 不送請求）。
   ⛔ 不能放進【自動下單】那個監聽（它開頭就 `if(TAB!=='fire') return`）。 */
document.addEventListener('click',function(e){

/* ⭐ 2026-10-20【重啟鈕】效果＝關掉 App 再從桌面捷徑開（面板自己結束、看門狗用最新程式重開）。
   ・第一段：⛔ 只換畫面，一個請求都不送。第二段才 pfetch('/api/app/restart')（後端會再驗一次條件）。
   ・能不能按＝後端 s.restart（有部位／單子在送／關鍵時刻／不是捷徑開的 ⇒ 不能，並說原因），⛔ 前端不自己判斷。
   ・送出後：等面板先斷線、再回來 ⇒ 自己重新整理（⛔ 不自動重送任何東西）。 */
const RST={step:'idle',busy:false,msg:'',down:false,t0:0};
function rstPaint(){
 const b=document.getElementById('anrst'), p=document.getElementById('rstpop'); if(!b||!p) return;
 const R=(LASTS&&LASTS.restart)||null, ok=!!(R&&R.ok);
 b.classList.toggle('off',!ok&&RST.step!=='going');
 b.title=ok?'重啟面板':('現在不能重啟：'+((R&&R.why)||'判斷中'));
 if(RST.step==='idle'){ p.hidden=true; RST.last=''; return; }
 const r=b.getBoundingClientRect();
 p.style.top=(r.bottom+10)+'px'; p.style.right=Math.max(12,window.innerWidth-r.right)+'px';
 let h;
 if(RST.step==='going'){
  h='<div class="t">面板重啟中…</div><div class="b">'+esc(RST.msg||'')+'<br>要重新連永豐，大約 <b>1 分鐘</b>；好了這個畫面會<b>自己重新整理</b>。</div>';
 }else if(RST.step==='err'){
  h='<div class="t">沒有重啟</div><div class="b">'+esc(RST.msg||'')+'</div><div class="row"><button data-rstno="1">知道了</button></div>';
 }else if(!ok){
  h='<div class="t">現在不能重啟</div><div class="b">'+esc((R&&R.why)||'還在判斷，等幾秒再試')+'</div><div class="row"><button data-rstno="1">知道了</button></div>';
 }else{
  h='<div class="t">重啟面板？</div><div class="b">效果跟<b>關掉再從桌面捷徑開</b>一樣：會載入最新的程式。<br>'+
    '重開要 <b>約 1 分鐘</b>（重新連永豐），這段時間畫面不會動；自動下單的開關、口數、紀錄都不受影響。</div>'+
    '<div class="row"><button data-rstno="1"'+(RST.busy?' disabled':'')+'>取消</button>'+
    '<button class="go" data-rstyes="1"'+(RST.busy?' disabled':'')+'>'+(RST.busy?'送出中…':'確定，重啟')+'</button></div>';
 }
 if(RST.last!==h||p.hidden){ p.innerHTML=h; RST.last=h; }   /* ⛔ 每 0.5 秒都會叫：內容一樣就不重畫（不然按到一半按鈕被換掉、點不到） */
 p.hidden=false;
}
function rstWait(){
 /* 先等它斷線（舊面板收工）、再等它回來（新面板起來）⇒ 重新整理。3 分鐘都沒斷 ⇒ 也重新整理，讓畫面講真話。 */
 fetch('/api/state',{cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(s=>{
   if(RST.down&&s&&s.restart){ location.reload(); return; }
   if(Date.now()-RST.t0>180000){ location.reload(); return; }
   setTimeout(rstWait,2000);
 }).catch(()=>{ RST.down=true; setTimeout(rstWait,2000); });
}
document.addEventListener('click',function(e){
 if(e.target.closest('#anrst')){ if(RST.step==='going') return; RST.step=(RST.step==='idle'?'ask':'idle'); RST.msg=''; rstPaint(); return; }
 if(e.target.closest('[data-rstno]')){ RST.step='idle'; rstPaint(); return; }
 const y=e.target.closest('[data-rstyes]');
 if(y){ if(y.disabled||RST.busy) return; RST.busy=true; rstPaint();
  pfetch('/api/app/restart').then(r=>r.json().catch(()=>({ok:false,msg:'面板回了看不懂的東西（HTTP '+r.status+'）'})))
   .then(r=>{ RST.busy=false;
     if(r&&r.ok){ RST.step='going'; RST.msg=r.msg||''; RST.down=false; RST.t0=Date.now(); setTimeout(rstWait,1500); }
     else { RST.step='err'; RST.msg=(r&&r.msg)||'重啟不了'; } rstPaint(); })
   .catch(()=>{ RST.busy=false; RST.step='err'; RST.msg='連不上面板'; rstPaint(); });
  return; }
 const p=document.getElementById('rstpop');
 if(p&&!p.hidden&&RST.step!=='going'&&!e.target.closest('#rstpop')){ RST.step='idle'; rstPaint(); }
});

tick(); setInterval(tick,500);
lpLoop();
