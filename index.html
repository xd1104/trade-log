<!DOCTYPE html>
<!-- data-splash-intro="light" ＝「白起」開場（範本 app-template/motion 的 opt-in 變體）。
     完整理由寫在下面關鍵路徑 CSS 那一塊，以及 movie-library/CLAUDE.md 第 34～37 條。
     ⚠️ 必須靜態寫在這裡：用 JS 加的時候第一幀已經畫過了，而且**不會報錯**。 -->
<html lang="zh-Hant" data-splash-intro="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>微台指交易日誌</title>
  <meta name="description" content="微台指模擬交易的每日進出場、勝率與心得紀錄">

  <link rel="manifest" href="manifest.webmanifest">
  <!-- ⚠️ 深色那一條要排在前面：js/splash-boot.js §7b 的 theme-color 追蹤器抓的是
       document.querySelector('meta[name="theme-color"]')＝**第一個**。
       這支 App 的 manifest.background_color 是 #0F1218（深色），
       開場的落地底色也是它，所以要追蹤的就是這一條。 -->
  <meta name="theme-color" content="#0F1218" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- ⭐⭐ 一定要 black-translucent，不可以改回 black（v21，2026-08-28）。
       症狀（Benson 的螢幕錄影逐格，1180×2556、59.94fps）：開場漸深的時候，
       畫面最上緣有一條 26 CSS px 的**淺色帶**跟不上內容，約 1 秒後才自己跳成深色。
       根因：`black` ⇒ iOS 在頁面**外面**另外畫一條實心的狀態列底，那條底取用
       <meta theme-color> 的頻率遠低於每幀 ⇒ js/splash-boot.js §7b 的每幀追蹤器
       再準也追不上，它就卡在最初那個淺色。
       `black-translucent` ⇒ 狀態列**沒有自己的底**，直接疊在我們畫的畫面上
       ⇒ 跟開場一起變，**結構上不可能不同步**。movie-library 用的就是這一條
       （Benson 評「完美」），§7b 的註解也是照 black-translucent 寫的。
       ⚠️ 代價：WebView 會延伸到狀態列底下 ⇒ 貼頂的東西必須自己讓開
          （.topbar 的 padding-top 已經帶 var(--safe-t)，實測 59px 有吃到）。 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="交易日誌">

  <!-- ⭐⭐ 關鍵路徑 CSS：第一次繪製的那一幀就長這樣。
       這一塊刻意排在所有 <link> 之前，而且**不依賴任何外部檔案**
       （顏色一律走 var(--splash-*, 後備字面值)）。

       為什麼要有它：iPhone 從主畫面開 PWA 的順序是
         系統開場（manifest.background_color ＋ icon）→ 建 WKWebView
         → **這一段是白的** → 我們的頁面第一次繪製。
       三支外部 CSS 只要有一支沒到位（離線、SW 殼快取沒建完、部署漏檔），
       第一次繪製就會是**純白**、沒有任何開場。

       ⭐ 「白起」變體（<html data-splash-intro="light">）：
          movie-library 的螢幕錄影逐格（59.94fps）證明，那個白**不是**「瀏覽器還沒畫」
          的瞬間空白（那會是硬切），而是 iOS 自己在跑的一段**平滑漸變**
          （把系統啟動圖淡出、淡進 WKWebView，中央像素實測 #ebebeb）。
          我們畫得再快也排在它後面 ⇒ 這一版**不跟它搶，改成接住它**：
          第一幀就是 #ebebeb，700ms 內平順沉成 #0F1218，金色「誌」在過程中浮出來。
          白不再是意外，是開場的第一拍；畫面上沒有硬切點可以「閃」。

       ⚠️ 我們**刻意不改 manifest.background_color**（那是另一條路 C1：連 iOS 的系統
          啟動圖一起變白、完全沒有接縫，但**要 Benson 把 App 從主畫面移除重加**，
          而且他的 localStorage 看起來會像被清掉。他上一支選的就是不用重加的這一版）。
       ⚠️ 變數的**落地值不在這裡**，在最下面那一塊 <style>（它必須排在 css/splash.css
          之後才蓋得過範本自己的預設品牌「範／App 範本／#241f1b」）。
          這裡只放「連 splash.css 都沒載到」時要用的後備字面值。
       ⚠️ 符號的字色刻意不在這裡宣告：它是 splash-boot.js 的 onColor() 從 accent
          算出來的（白字／深字取對比高的那個，最差有下界），不是設定項。
       ⚠️ 漸變本體住在 css/splash.css §7（非阻塞），所以三支 CSS 全掛時畫面會**停在白色**
          直到開場被收掉。這是刻意的取捨：這一塊只放「靜止的第一幀」，不放動畫
          —— 放了就是同一條規則活在兩個地方，改 token 時必分岔。 -->
  <style>
    html:not([data-splash="off"]),
    html[data-cssgate]{background:var(--splash-bg,#0F1218);}
    /* 白起：開場播放中（冷啟動、還沒收場）第一幀就是 iOS 淡出後留下的那片白。
       ⚠️ 後備值 #ebebeb 必須逐字等於 css/splash.css 的 --sp-start（tools/check-splash.js 在比對）。 */
    html[data-splash-intro="light"]:not([data-splash="off"]){background:var(--sp-start,#ebebeb);}
    html[data-splash-intro="light"] #splash{background:var(--sp-start,#ebebeb);}
    /* ⭐⭐ 開場播放中，**<body> 自己的底色要讓開**（完整理由在 css/splash.css §7a2）。
       css/style.css 的 `body{background:var(--bg)}` 是畫在 html 畫布**上面**的第二層底色，
       所以只要有一塊畫面沒被 #splash 蓋到，露出來的是那一片**沒有動過的 #0F1218**，
       不是上面那條正在沉的顏色（movie-library 的錄影拍到過：下緣一條 58px 的純深色，
       home 指示條同時翻白，兩格後恢復）。
       ⚠️ 一定要 transparent，不可以讓 body 自己再跑一次同樣的漸變 ——
          那是同一條時間線活在兩個地方，改 token 時必分岔。
       ⚠️ 這一條**必須也寫在關鍵路徑塊**，不能只寫在 css/splash.css：
          三支樣式表是非阻塞的，style.css 有可能先到、splash.css 後到，
          中間那個窗口 body 就是深色的。
       ⚠️ 權重 (0,3,1) 壓得過 style.css 的 `body` (0,0,1)，不必 !important。
       ⚠️ 順帶把 body 的 radial-gradient 一起關掉（background 是簡寫），
          收場之後規則不再匹配，漸層自己回來。 */
    html[data-splash-intro="light"]:not([data-splash="off"]) body{background:transparent;}
    /* 減少動態：白起整個關掉、退回深色第一幀（理由在 css/splash.css §7f ——
       --dur-* 全部塌成 1ms 之後沒有過程可言，白只剩「多跳一次」）。
       這一塊也要有，不然 reduce 使用者會看到「白一下下 → 深」。 */
    @media (prefers-reduced-motion:reduce){
      html[data-splash-intro="light"]:not([data-splash="off"]),
      html[data-splash-intro="light"] #splash{background:var(--splash-bg,#0F1218);}
    }
    /* FOUC 閘門（配合非阻塞 CSS）：全掃描不是白名單，
       以後在 body 底下多加一個浮動元素也不會漏。 */
    html[data-cssgate] body > *:not(#splash){visibility:hidden;}
    /* ⭐⭐ 開場**播放中**，App 內容一律不要畫出來。
       閘門開的那一格（三支樣式表回報完成）App 內容會從 hidden 變可見，
       只要有一塊畫面沒被 #splash 蓋到就會在那一格露出深色的 App。
       這一條把整類問題結構性消掉：開場播放中根本不畫，蓋不蓋得滿就不再是正確性的前提。
       ⚠️ 三個性質缺一不可（少一個就變成「App 永遠看不見」）：
         ① :not([data-splash="off"]) ⇒ 熱啟動不受影響（boot 在 body 解析前就掛 off）；
         ② :not(.out) ⇒ 收場淡出一開始就放行，App 才有得跟它交叉淡入；
         ③ #splash 一從 DOM 移除選擇器就失效 ⇒ boot 的交棒保險絲與 splashFallback() 都救得回來。
       ⚠️ JS 被停用時 <html> 上沒有 data-splash ⇒ 這條會匹配 ⇒ App 被藏死，
          所以下面 <noscript> 那塊**必須**同時解除它。
       ⚠️ 用兄弟選擇器（~）是因為 #splash 是 body 的第一個子元素；
          新增元素請一律加在 #splash **後面**。 */
    html:not([data-splash="off"]) #splash:not(.out) ~ *{visibility:hidden;}
    #splash{
      position:fixed; inset:0; z-index:200; overflow:hidden;
      background:var(--splash-bg,#0F1218); color:var(--splash-ink,#E7E9ED);
      user-select:none; -webkit-user-select:none;
    }
    html[data-splash="off"] #splash{display:none;}
    .sp-core{position:absolute; inset:0;}
    /* 位置與尺寸逐字照 css/splash.css（對得準系統開場的 icon） */
    .sp-glyph{
      position:absolute; left:50%; top:50%;
      width:76px; height:76px; margin:-38px 0 0 -38px;
      border-radius:22px; background:var(--splash-accent,#E3A951);
      /* ⚠️ 字色只「引用」不「宣告」：值是 splash-boot.js 的 onColor(accent) 在 <head>
         就算好寫進 :root 的 inline style 的（跟著鑰匙圈換色，最差對比有下界）。
         這裡寫死一個色碼就變成同一條規則活在兩個地方，換色時一定分岔。 */
      color:var(--splash-on-accent);
      display:flex; align-items:center; justify-content:center;
      font-size:34px; font-weight:800; letter-spacing:.02em;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    }
    .sp-glyph::before{content:var(--splash-glyph,"誌");}
    .sp-below{
      position:absolute; left:0; right:0; top:50%;
      margin-top:58px; padding:0 26px; text-align:center;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    }
    /* ⭐⭐ 這一塊畫的是**動畫的起始狀態**，不是完成態。
       三支樣式表是非阻塞的 ⇒ 時序一定是
         第一次繪製（這一塊畫的）→ 幾十毫秒～數百毫秒 → css/splash.css 套用 → 動畫從頭跑。
       畫完成態的話 splash.css 一到就會跳回起始狀態（符號淡掉再淡回來、名字消失再出現）
       —— movie-library 的錄影逐格拍到過，Benson 說「有點小奇怪」的就是它。
       ⚠️ 代價：三支 CSS 全 404 時符號與名字**不會出現**（只剩底色 ＋ 保險絲把開場收掉）。
          那個取捨是刻意的：CSS 404 是罕見故障，跳動是每一次開 App 都會發生。
       ⚠️ --lift／--scale-in 是 css/motion.css 的 token，刻意**不寫後備字面值**：
          motion.css 也沒到位時 var() 代換失敗 ⇒ transform 退回 none，
          而 opacity 仍然是 0（看不見）⇒ 視覺上沒有差別；
          寫死後備值才會變成「同一個數字活在兩個地方」。 */
    .sp-name{
      font-size:20px; font-weight:700; letter-spacing:-.01em; line-height:1.3;
      /* ＝ css/splash.css @keyframes sp-up 的 from */
      opacity:0; transform:translateY(var(--lift));
    }
    .sp-name::before{content:var(--splash-name,"微台指交易日誌");}
    /* 白起：符號也是浮出來的 ⇒ 第一幀還沒出現（＝ @keyframes sp-emerge 的 from）。
       印記那一版的符號第一幀本來就是實心的，所以這條**不可以**寫成無條件的。 */
    html[data-splash-intro="light"] .sp-glyph{opacity:0; transform:scale(var(--scale-in));}
    .sp-tag{display:none;}
  </style>

  <script>
    /* 必須在 splash-boot 之前 */
    window.SPLASH_CONFIG = {
      appId: "trade-log",       /* ASCII，跟 repo 同名，也跟 keyring.json 的 apps[].id 一樣 */
      version: "1",             /* 改版時 +1，改版後第一次進站會再播一次開場 */
      keyringUrl: "https://xd1104.github.io/keyring/keyring.json",
      bootSelector: ".app, .fab",   /* 要播進場動畫的容器：主欄 ＋ 浮動按鈕 */
      defaults: {               /* 鑰匙圈沒設、或讀不到時用這一組 */
        name: "微台指交易日誌",
        glyph: "誌",
        bg: "#0F1218",
        accent: "#E3A951",
        ink: "#E7E9ED",
        tagline: "一天一筆，記錄與檢討自己"
      }
    };
  </script>
  <!-- ⚠️⚠️ 下面這一整段是 js/splash-boot.js 的**逐字副本**，不要手改。
       改法：改 js/splash-boot.js，然後跑
         node ../app-template/motion/inline-boot.js index.html js/splash-boot.js
       tools/check-splash.js 會用 SHA-256（換行正規化後）逐位元組比對，分岔就紅；
       而 js/splash-boot.js 自己又要跟 app-template/motion/splash-boot.js 一致
       ⇒ 一條兩段的鎖鏈，onColor() 的真相來源全世界只有一個。

       為什麼要 inline 而不是 <script src>：第一次繪製之前必須到齊的**同源請求數**
       從 2 個（index.html ＋ splash-boot.js）降到 **1 個**。桌機量不出差別，
       但 iPhone 從主畫面開 PWA 時每一個經過 SW 的子資源都要付一次 WKWebView 的代價。

       ⚠️ 仍然是**同步**、仍然在 <head>、仍然排在所有樣式表 <link> 之前。
       ⚠️ js/splash-boot.js 這支檔案**要留著**（它是本 repo 的正本來源與比對對象），
          但它已經不再被 <script src> 載入，所以也**不在 sw.js 的殼快取裡**。 -->
  <!-- SPLASH-BOOT-INLINE:BEGIN -->
  <script>
/* ============================================================
   splash-boot.js — 開場的「第一幀」那一小段
   ------------------------------------------------------------
   ⚠️⚠️ 這支必須是 <head> 裡的**同步 script**（不要 defer、不要 async、
      不要搬到 body）。它是整個 app 唯一還站在「第一次繪製」關鍵路徑上的
      JS —— 所以它刻意很小，而且**只做四件事**：

        ① 讀 localStorage 的外觀快取（名字／符號／顏色）
        ② 把外觀寫成 :root 上的 CSS 變數
        ③ 冷／熱啟動判斷；熱啟動立刻掛 html[data-splash="off"]
        ④ 非阻塞 CSS 的閘門（data-cssgate）＋兩條保險絲

   為什麼要拆成兩支（2026-08-27，Benson 螢幕錄影逐格分析之後）：
     iPhone 從主畫面開 PWA 的順序是
       iOS 自己的啟動畫面（純黑）→ 約 0.5s 開始**淡出**、淡進 WKWebView
       → 我們的頁面如果還沒畫出任何東西，這一段就是 WebView 的白底
       → 我們第一次繪製（實測 0.73s）。
     所以那個白**不是「瀏覽器還沒畫」的瞬間空白，是一場賽跑**：
     只要趕在 iOS 開始淡出之前畫出第一幀，白色會整個消失、不是變短。
     舊版的 <head> 裡站著三支 CSS <link> ＋ 一支 17KB 的 splash.js，
     四個檔案全部是「畫出第一幀之前非到齊不可」。現在只剩這一支。

   ⚠️ 為什麼不能 defer／async：
     defer 之後外觀變數會在**第一次繪製之後**才寫進去
     ⇒ 冷啟動會「先畫預設值、再跳成鑰匙圈設定的名字」（中途換字，不可退步的鐵律）；
     ⇒ 熱啟動會先畫一幀開場再抽掉（每次切回來都閃一下）。

   ⚠️ onColor()（符號字色的算法）**只准存在這一份**。
      motion/splash.js 用的是這裡交出去的那一個，不是自己再寫一份。
      同一條規則活在兩個地方，鑰匙圈換色時一定分岔，而分岔的那一份沒有對比度下界。
      `node motion/check-splash.js` 會守這件事（splash.js 裡不可以有第二個 onColor）。

   對內（給 motion/splash.js 用，不是公開 API）：window.SplashBoot
   公開 API 仍然是 window.Splash（由 motion/splash.js 定義）。
   ============================================================ */
(function () {
  "use strict";

  var W = window;
  var D = document;
  var root = D.documentElement;
  var has = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };

  /* iOS Safari 要有 touch 監聽，:active 才會生效
     （沒有這一行，手機上所有按下回饋都是死的）。
     刻意放在 boot 不放 splash.js：splash.js 現在在 body 尾端，
     萬一它沒載到，按下回饋不應該跟著一起死。 */
  try {
    D.addEventListener("touchstart", function () {}, { passive: true });
  } catch (e) {
    D.addEventListener("touchstart", function () {}, false);
  }

  /* ============================================================
     0. 設定
     ============================================================ */
  var CFG = W.SPLASH_CONFIG || {};
  var APP_ID = CFG.appId || "app";
  var APP_VER = String(CFG.version == null ? "1" : CFG.version);
  var KEYRING_URL = has(CFG, "keyringUrl")
    ? CFG.keyringUrl
    : "https://xd1104.github.io/keyring/keyring.json";
  var SPLASH_SEL = CFG.splashSelector || "#splash";
  var BOOT_SEL = CFG.bootSelector || "#app";
  var DEFAULTS = CFG.defaults || {};

  /* localStorage：外觀快取。key 由 PM 定死，不可以自己改。 */
  var CACHE_KEY = "splash:" + APP_ID;
  /* sessionStorage：冷啟動判斷。帶版本是為了改版後第一次進站再播一次。 */
  var SEEN_KEY = "splash-seen:" + APP_ID + ":" + APP_VER;

  var REDUCE = false;
  try {
    REDUCE = !!(W.matchMedia && W.matchMedia("(prefers-reduced-motion: reduce)").matches);
  } catch (e) {}

  var nowFn =
    W.performance && typeof W.performance.now === "function"
      ? function () { return W.performance.now(); }
      : function () { return Date.now(); };
  /* ⭐ t0 要在**這裡**取，不可以在 splash.js 取：splash.js 現在跑得比較晚，
     用它自己的起點算「最短顯示」會讓開場整段往後多停一截。 */
  var t0 = nowFn();
  function elapsed() { return nowFn() - t0; }

  /* ============================================================
     1. 外觀資料的清洗（鑰匙圈是外部來源，一律當成不可信）
     ------------------------------------------------------------
     每個欄位都可能不存在或是空字串 → 一律 fallback 到 app 的預設值。
     缺欄位不是錯誤，不要報錯、不要在 console 留紅字。
     ============================================================ */
  /* 契約只收 3 碼與 6 碼：開場底色帶 alpha 沒有意義（下面是空的），不該進契約。 */
  var RE_COLOR = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;

  /* 丟掉控制字元（含換行——CSS 字串裡不能有），再去頭尾空白、截長度。
     刻意用迴圈不用正則的控制字元類別：原始碼裡不要出現真的控制字元。 */
  function txt(v, max) {
    if (v == null) return "";
    var raw = String(v);
    var s = "";
    for (var i = 0; i < raw.length; i++) {
      var c = raw.charCodeAt(i);
      if (c < 32 || c === 127) continue;
      s += raw.charAt(i);
    }
    s = s.replace(/^\s+|\s+$/g, "");
    return s.length > max ? s.slice(0, max) : s;
  }
  function col(v) {
    var s = txt(v, 12);
    return RE_COLOR.test(s) ? s : "";
  }
  function oneChar(v) {
    var s = txt(v, 8);
    if (!s) return "";
    /* 用 Array.from 才不會把 emoji／罕用字的代理對切成半個字 */
    var arr = typeof Array.from === "function" ? Array.from(s) : s.split("");
    return arr[0] || "";
  }

  /* ⭐ 符號字色：白字與深字各算一次 WCAG 對比度，取高的那個；
     近乎平手時偏好白字（見下方 15% 規則）。
     （PM 2026-08-25 拍板：符號本身的文字色「不進契約、不讓使用者設定」。
       多一個色票就多一種「調成看不見」的可能——keyring 踩過主要按鈕
       變透明、純功能測試抓不到的雷。自動算才有下界。
       這段程式碼與鑰匙圈後台的預覽縮圖是同一份，改的話兩邊要一起改，
       否則 Benson 在後台看到的跟實機不一樣。）

     ⚠️ 不要改回「亮度 > 門檻」那種猜法——飽和的綠／青會被誤判成暗底而給白字，
        實測最差只有 2.08:1（全色域 6.8% 低於 3:1）。這裡的 gamma 校正不是裝飾。
     ⭐ 這個做法可靠的理由不是「亮度猜得準」，而是
        「取兩個候選中對比較高的那個，所以最差情況有下界」。
        含 15% 平手偏白之後，全色域「窮舉」16,777,216 色實測最差 3.95:1 @ #438c83，
        0.000% 低於 3:1。
        ⚠️ 這個數字一定要用窮舉量：抽樣（step 8）會給出假的最差色 4.28:1 @ #e04000，
           比真值樂觀 8%，而且指向錯的顏色。
     ⚠️⚠️ 這是**全專案唯一一份** onColor()。2026-08-27 拆檔時它從 splash.js 搬到這裡，
        splash.js 不可以再寫一份、app 的 index.html 也不可以 inline 一份。 */
  function relLum(hex){
    var h = String(hex||"").replace("#","");
    /* 4 碼／8 碼帶 alpha：丟掉 alpha 再算。
       契約已經收窄成只收 3 碼與 6 碼（見 RE_COLOR），這裡仍然要正確處理——
       不要因為上游收窄了就假設不會發生。
       舊版對 4/8 碼一律 return 0（當成純黑）⇒ 永遠給白字，
       #ffffffff 會變成白字白底 1.00:1，「有下界」的保證整個破功。 */
    if(h.length === 4){ h = h.slice(0,3); }
    if(h.length === 8){ h = h.slice(0,6); }
    if(h.length === 3){ h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    if(!/^[0-9a-fA-F]{6}$/.test(h)){ return 0; }
    var c = [0,2,4].map(function(i){
      var v = parseInt(h.substr(i,2),16) / 255;
      return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
    });
    return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
  }
  function contrast(l1, l2){
    var hi = Math.max(l1,l2), lo = Math.min(l1,l2);
    return (hi + 0.05) / (lo + 0.05);
  }
  var ON_LIGHT = "#ffffff";
  var ON_DARK  = "#1a1310";
  function onColor(bg){
    var L = relLum(bg);
    var w = contrast(1, L);               /* 白字 */
    var d = contrast(relLum(ON_DARK), L); /* 深字 */
    if(w >= d){ return ON_LIGHT; }
    /* 近乎平手（差距 <15%）時偏好白字：兩者都夠讀，但深字會讓符號從
       「發光的徽章」變成「挖空的洞」，跟開場其餘的淺色字分屬兩套語言。
       ⚠️ 這個 15% 是拿「最差對比」換來的，動它之前先跑全色域斷言。 */
    return (d - w) / d < 0.15 ? ON_LIGHT : ON_DARK;
  }

  /* 把任意來源（鑰匙圈的 splash 物件 / 快取 / app 預設）洗成同一個形狀。
     只留下有值的欄位，空字串一律丟掉 ⇒ 合併時自然會 fallback。 */
  function clean(o) {
    var s = o && typeof o === "object" ? o : {};
    var out = {};
    var name = txt(s.name, 24);      if (name) out.name = name;
    var glyph = oneChar(s.glyph);    if (glyph) out.glyph = glyph;
    var tag = txt(s.tagline, 48);    if (tag) out.tagline = tag;
    var bg = col(s.bg);              if (bg) out.bg = bg;
    var accent = col(s.accent);      if (accent) out.accent = accent;
    var ink = col(s.ink);            if (ink) out.ink = ink;
    return out;
  }
  function isEmpty(o) {
    for (var k in o) { if (Object.prototype.hasOwnProperty.call(o, k)) return false; }
    return true;
  }
  function merge(base, over) {
    var out = {};
    var k;
    for (k in base) { if (Object.prototype.hasOwnProperty.call(base, k)) out[k] = base[k]; }
    for (k in over) { if (Object.prototype.hasOwnProperty.call(over, k)) out[k] = over[k]; }
    return out;
  }

  /* ============================================================
     2. 快取（localStorage）
     ------------------------------------------------------------
     隱私模式／存取被擋時全部安靜失敗——開場不可以因為存不了東西就掛掉。
     ============================================================ */
  function readCache() {
    try {
      var raw = W.localStorage.getItem(CACHE_KEY);
      if (!raw) return {};
      return clean(JSON.parse(raw));
    } catch (e) {
      return {};
    }
  }
  function writeCache(look) {
    try { W.localStorage.setItem(CACHE_KEY, JSON.stringify(look)); } catch (e) {}
  }
  function dropCache() {
    try { W.localStorage.removeItem(CACHE_KEY); } catch (e) {}
  }

  /* ============================================================
     3. 套用外觀（只動 :root 上的 --splash-* 變數）
     ------------------------------------------------------------
     ⭐ 只影響開場那一幕。不碰 app 的品牌色、標題、manifest、theme-color。
     文字要包成 CSS 字串（splash.css 是用 content:var(--splash-name) 畫的）。
     ============================================================ */
  function cssStr(s) {
    return '"' + String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
  }
  function setVar(name, value) {
    if (value) { root.style.setProperty(name, value); }
  }
  function applyLook(look) {
    setVar("--splash-bg", look.bg);
    setVar("--splash-ink", look.ink);
    if (look.accent) {
      setVar("--splash-accent", look.accent);
      /* 符號字色不是設定項，是算出來的（見 onColor） */
      setVar("--splash-on-accent", onColor(look.accent));
    }
    if (look.glyph) setVar("--splash-glyph", cssStr(look.glyph));
    if (look.name) setVar("--splash-name", cssStr(look.name));
    if (look.tagline) setVar("--splash-tagline", cssStr(look.tagline));
  }

  /* ============================================================
     4. 冷啟動判斷（只有冷啟動才播）
     ------------------------------------------------------------
     用 sessionStorage，不要用 localStorage：
     sessionStorage 的生命週期剛好等於「這一次啟動」——
     PWA 從主畫面重開＝新 session ⇒ 會播；
     切分頁、鎖屏解鎖、返回＝同一個 session ⇒ 不播。
     localStorage 會變成「一輩子只播一次」。
     ⚠️ 不准掛在 visibilitychange / focus / pageshow 上重播。
        bfcache 返回（pageshow.persisted）JS 根本不會重跑，什麼都不用做。
     ============================================================ */
  function isColdStart() {
    try {
      if (W.sessionStorage.getItem(SEEN_KEY)) return false;
      W.sessionStorage.setItem(SEEN_KEY, "1");
      return true;
    } catch (e) {
      return true; /* 隱私模式：寧可多播一次，不要整個 app 掛掉 */
    }
  }

  /* ============================================================
     5. 起手式（在 <head> 就跑完，body 還沒開始解析）
     ============================================================ */
  var builtin = clean(DEFAULTS);
  var cached = readCache();
  /* 快取優先，缺的欄位用 app 內建預設補。沒有快取就整個用內建預設。 */
  var LOOK = merge(builtin, cached);
  applyLook(LOOK);

  var COLD = isColdStart();
  if (!COLD) {
    /* 熱啟動：連一幀都不要畫出來（CSS: html[data-splash="off"] #splash{display:none}） */
    root.setAttribute("data-splash", "off");
  }

  /* ============================================================
     6. 非阻塞 CSS 的閘門（data-cssgate）
     ------------------------------------------------------------
     三支樣式表改成 media="print" onload="this.media='all'" ⇒ 它們不再擋第一次繪製。
     代價是：**熱啟動**（不播開場、直接看 app）在 CSS 到齊之前會看到
     一份沒套樣式的 DOM ＝ FOUC。所以 boot 一進來就先把閘門關上
     （關鍵路徑 CSS 裡：html[data-cssgate] #app{visibility:hidden}），
     CSS 到齊（或失敗、或保險絲燒了）才開。

     ⭐ 三條鐵律：
       ① 閘門**只有 boot 關得起來**。JS 被停用、或這支檔案沒載到 ⇒
          html 上根本不會有 data-cssgate ⇒ 畫面照常顯示。
          （守衛要寫成「有人負責開，才准關」。）
       ② 開閘條件是「每一支 link 都回報過」**或**保險絲時間到；兩條路都會
          強制把 media 改回 all —— 寧可 FOUC，也不可以把 app 永遠藏起來。
       ③ 閘門期間 <html> 的底色是 --splash-bg（深色），不是白的。
          那一段本來就是這場賽跑要贏的一段，不可以在這裡自己補一塊白。
     ============================================================ */
  var CSS_FUSE = 2000;
  var gateOpen = false;
  var domReady = false;

  root.setAttribute("data-cssgate", "");

  function deferredLinks() {
    try { return D.querySelectorAll("link[data-splash-css]"); } catch (e) { return []; }
  }
  function openGate() {
    if (gateOpen) return;
    gateOpen = true;
    /* 強制收尾：onload 沒觸發（某些 Safari 版本對 media 切換的怪癖）
       也要把樣式套上去，否則 app 會永遠是裸的 HTML。 */
    var ls = deferredLinks();
    for (var i = 0; i < ls.length; i++) {
      try { if (ls[i].media !== "all") { ls[i].media = "all"; } } catch (e) {}
    }
    root.removeAttribute("data-cssgate");
  }
  function checkGate() {
    if (gateOpen || !domReady) return;
    var ls = deferredLinks();
    for (var i = 0; i < ls.length; i++) {
      if (!ls[i].getAttribute("data-css-done")) return;
    }
    openGate();   /* 一支都沒有（app 用的是傳統阻塞式 CSS）也算到齊 */
  }
  /* 由 <link onload/onerror> 呼叫。刻意掛在 window 上：行內屬性只看得到全域。
     ⚠️ 404 也要呼叫（onerror）——「CSS 不見了」不可以變成「app 永遠看不見」。 */
  W.__splashCss = function (link) {
    try {
      link.media = "all";
      link.setAttribute("data-css-done", "1");
    } catch (e) {}
    checkGate();
  };
  W.setTimeout(openGate, CSS_FUSE);   /* 保險絲：寧可 FOUC 也不可以永遠藏起來 */

  /* ============================================================
     7. 交棒保險絲：splash.js 沒載到也一定要能用
     ------------------------------------------------------------
     ⭐ splash.js 現在在 <body> 尾端 ⇒ 它離線／漏檔沒載到的機率比以前高。
        以前保險絲住在 splash.js 自己裡面（＝那支檔案沒到就沒有保險絲），
        現在挪一份到 boot：沒有人接手就自己把開場收掉。
        （呼叫端 app.js 的 window.Splash && … 守衛仍然要留，這是第二層。）
     ============================================================ */
  var TAKEOVER_FUSE = 7000;
  /* ⚠️ hardRemove() **刻意不開閘門**。
     熱啟動時 splash.js 一到 DOM ready 就會呼叫它（開場連一幀都不播），
     那時候 CSS 通常還沒到 —— 在這裡順手開閘等於把 ② 的代價又還回去，
     熱啟動會露出沒套樣式的 DOM。閘門只有兩個開法：CSS 全回報，或 2 秒保險絲。
     （2026-08-27 §78c 實測抓到：原本寫在這裡，熱啟動的閘門 0ms 就開了。） */
  function hardRemove() {
    try {
      var sp = D.querySelector(SPLASH_SEL);
      if (sp && sp.parentNode) { sp.parentNode.removeChild(sp); }
      root.setAttribute("data-splash", "off");
    } catch (e) {}
  }
  W.setTimeout(function () {
    if (W.__splashTakeover) { return; }   /* splash.js 有接手，交給它 */
    hardRemove();
    /* 沒有人接手＝這一頁大概也出了別的事，閘門一起開掉，不要留一片空白 */
    openGate();
  }, TAKEOVER_FUSE);

  function onDomReady(fn) {
    if (D.readyState === "loading") {
      D.addEventListener("DOMContentLoaded", fn, { once: true });
    } else {
      fn();
    }
  }
  onDomReady(function () { domReady = true; checkGate(); });

  /* ============================================================
     7b. ⭐⭐ <meta name="theme-color"> 跟著開場的底色走（v1.6.3，2026-08-28）
     ------------------------------------------------------------
     為什麼要有這一段：
       iOS 從主畫面開 PWA 時，**頁面之外**的那一圈（safe-area／overscroll／
       home 指示條那一帶）不是我們畫的，是系統畫的，而系統參考的顏色候選有兩個：
       manifest 的 background_color（安裝當下抄走、改不動）與 **<meta theme-color>**。
       深色 app 開淺色開場（白起）時，這兩個值都還說「我是深色的」
       ⇒ 交接的那一兩格，畫面下緣有機會被畫成一條深色。
       movie-library 2026-08-28 的螢幕錄影就有這麼一條（58px、純 #0b0d12、
       home 指示條同時翻白＝ iOS 認定那塊是深色的）。
       **manifest.background_color 不准動**（動了 iOS 的系統啟動圖才會變，
       而那要使用者把 app 從主畫面移除重加）⇒ 我們能動的只有 theme-color。

     ⚠️ 這條深色帶有**兩個都說得通的成因**，而且本機複現不出來：
       ① 系統拿 theme-color 去畫頁面之外 ⇒ 這一段負責；
       ② 頁面自己有一塊沒被 #splash 蓋到、露出 body 的底色 ⇒ splash.css §7a2 負責。
       兩個成因的顏色**剛好一樣**（app 的 --bg ＝ theme-color ＝ manifest），
       所以錄影分不出來是哪一個。兩邊都修，不要挑一個信。

     做法：**追蹤 <html> 當下的 computed background-color**，不是自己再算一次漸變。
       - 顏色的真相來源只有一個（splash.css §7a 的 sp-sink-bg），
         這裡只是「把畫面上的顏色抄給系統」⇒ 不可能跟畫面對不上。
       - 因此**不需要知道任何時長**（--sp-lead／--sp-sink 都不必讀），
         換 token、換變體、reduce、CSS 沒載到，全部自動正確。
       - 印記變體與 reduce 之下 html 的底色本來就等於 theme-color
         ⇒ tcPut() 比對過就跳過，**一個位元組都不會寫** ＝ 這一段對它們是隱形的。

     ⚠️ 狀態列：Benson 的錄影顯示**淺色開場時狀態列文字已經是黑的**，
        而那時 theme-color 是 #0b0d12（深色）⇒ **iOS 沒有拿 theme-color 決定狀態列文字**
        （這支 app 用的是 apple-mobile-web-app-status-bar-style=black-translucent，
        iOS 自己看內容決定）。就算某個版本的 iOS 會看，這裡給的也永遠是
        **畫面當下的真實底色** ⇒ 「淺底配黑字、深底配白字」自動成立，
        不會出現「theme-color 說淺、畫面已經變深」那種字看不見的窗口。
     ⚠️ 收場一定要換回**原本的字面值**（不是等價的 rgb()），
        否則 app 跑起來之後 theme-color 會變成一個沒人設定過的字串。
     ⚠️ 只在冷啟動跑。熱啟動不播開場，theme-color 從頭到尾都該是 app 自己的深色。
     ============================================================ */
  var TC_META = null, TC_ORIG = null, TC_NOW = null, TC_OFF = false;

  /* 畫面當下的底色（＝ <html> 的 computed background-color）。
     透明或讀不到就回空字串 —— 寧可不寫，也不要把狀態列交給瀏覽器猜。 */
  function tcRead() {
    try {
      var v = W.getComputedStyle(root).backgroundColor;
      if (!v || v === "transparent" || v.indexOf(", 0)") > 0) { return ""; }
      return v;
    } catch (e) { return ""; }
  }
  /* 只為了比對「是不是同一個顏色」：#0b0d12 與 rgb(11, 13, 18) 必須算相等，
     否則印記變體每一幀都會白寫一次。 */
  function tcRGB(s) {
    var t = String(s || "").replace(/\s+/g, "").toLowerCase(), m;
    if (/^#[0-9a-f]{3}$/.test(t)) {
      return [parseInt(t.charAt(1) + t.charAt(1), 16),
              parseInt(t.charAt(2) + t.charAt(2), 16),
              parseInt(t.charAt(3) + t.charAt(3), 16)].join(",");
    }
    if (/^#[0-9a-f]{6}$/.test(t)) {
      return [parseInt(t.substr(1, 2), 16), parseInt(t.substr(3, 2), 16), parseInt(t.substr(5, 2), 16)].join(",");
    }
    m = /^rgba?\((-?\d+),(-?\d+),(-?\d+)/.exec(t);
    if (m) { return m[1] + "," + m[2] + "," + m[3]; }
    return t;
  }
  function tcPut(v) {
    if (!TC_META || !v) { return; }
    if (TC_NOW !== null && tcRGB(v) === tcRGB(TC_NOW)) { return; }
    TC_NOW = v;
    try { TC_META.setAttribute("content", v); } catch (e) {}
  }
  function tcRestore() {
    if (TC_OFF) { return; }
    TC_OFF = true;
    if (TC_META && TC_ORIG) {
      TC_NOW = null;   /* 強制寫回原字面值，不要因為「顏色一樣」而留下 rgb(...) */
      tcPut(TC_ORIG);
    }
  }
  /* 開場收掉了沒？三條路任一條成立都算（跟遮罩那條 CSS 是同一組判準）：
     data-splash="off"／#splash 離開 DOM／下面的保險絲。
     ⚠️ `#splash 不在` 這條**必須等 domReady**：這一段在 <head> 就跑了，
        那時 <body> 根本還沒解析，不擋的話第一個 rAF 就會把自己關掉。 */
  function tcOver() {
    try {
      if (root.getAttribute("data-splash") === "off") { return true; }
      if (domReady && !D.querySelector(SPLASH_SEL)) { return true; }
    } catch (e) { return true; }
    return false;
  }
  function tcNext(fn) {
    try {
      if (typeof W.requestAnimationFrame === "function") { W.requestAnimationFrame(fn); return; }
    } catch (e) {}
    W.setTimeout(fn, 16);
  }
  function tcTick() {
    if (TC_OFF) { return; }
    if (tcOver()) { tcRestore(); return; }
    tcPut(tcRead());
    tcNext(tcTick);
  }
  if (COLD) {
    try { TC_META = D.querySelector('meta[name="theme-color"]'); } catch (e) { TC_META = null; }
    if (TC_META && TC_META.getAttribute("content")) {
      TC_ORIG = TC_META.getAttribute("content");
      /* ⚠️ TC_NOW 要先設成原值，否則第一次寫入沒有東西可以比對 ⇒
         印記變體（底色本來就等於 theme-color）也會被改寫成等價的 rgb(...)。 */
      TC_NOW = TC_ORIG;
      tcPut(tcRead());     /* 第一次繪製之前就要對 */
      tcNext(tcTick);
      /* 保險絲：分頁被切到背景時 rAF 會停，這條保證 theme-color 一定換得回來。
         比交棒保險絲再晚一點（那時開場一定已經被收掉了）。 */
      W.setTimeout(tcRestore, TAKEOVER_FUSE + 1500);
    }
  }

  /* ============================================================
     8. 交給 motion/splash.js（不是公開 API）
     ============================================================ */
  W.SplashBoot = {
    appId: APP_ID, appVer: APP_VER, keyringUrl: KEYRING_URL,
    splashSel: SPLASH_SEL, bootSel: BOOT_SEL,
    cacheKey: CACHE_KEY, seenKey: SEEN_KEY,
    cold: COLD, reduce: REDUCE, look: LOOK, cached: cached,
    t0: t0, elapsed: elapsed, now: nowFn,
    onColor: onColor, relLum: relLum, contrast: contrast,
    clean: clean, merge: merge, isEmpty: isEmpty,
    applyLook: applyLook,
    readCache: readCache, writeCache: writeCache, dropCache: dropCache,
    hardRemove: hardRemove, openCssGate: openGate, onDomReady: onDomReady
  };
})();
</script>
<!-- SPLASH-BOOT-INLINE:END -->

  <!-- ⭐ 三支樣式表一律「非阻塞」載入：media="print" 讓瀏覽器不把它們算成
       render-blocking，onload 再切回 all。這是那場賽跑的第二件套
       （第一件是把開場拆出 splash-boot 並 inline，第三件是上面的 data-cssgate 閘門）。
       ⚠️ 三件事缺一不可，各自單獨做都等於零收益（範本那輪實測）。
       ⚠️ 順序不可以動：style.css → motion.css → splash.css。
          motion.css 排在 style.css 後面是刻意的（同權重時後宣告者勝）；
          splash.css 要吃 motion.css 的 --dur-* token，所以一定排在它後面。
          media="print" 不影響 CSSOM 的順序，順序看的是文件位置。
       ⚠️ motion.css 只有動效、沒有任何顏色 —— 範本那份的色票變數跟這支 App 撞名
          （--bg / --surface / --surface-2 / --line），整包抄會把配色蓋掉。
       ⚠️ onerror 也要回報：CSS 404 不可以變成「App 永遠看不見」。 -->
  <link rel="stylesheet" href="css/style.css" media="print" data-splash-css
        onload="this.media='all';window.__splashCss&amp;&amp;window.__splashCss(this)"
        onerror="window.__splashCss&amp;&amp;window.__splashCss(this)">
  <link rel="stylesheet" href="css/motion.css" media="print" data-splash-css
        onload="this.media='all';window.__splashCss&amp;&amp;window.__splashCss(this)"
        onerror="window.__splashCss&amp;&amp;window.__splashCss(this)">
  <link rel="stylesheet" href="css/splash.css" media="print" data-splash-css
        onload="this.media='all';window.__splashCss&amp;&amp;window.__splashCss(this)"
        onerror="window.__splashCss&amp;&amp;window.__splashCss(this)">
  <noscript>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/motion.css">
    <link rel="stylesheet" href="css/splash.css">
    <!-- JS 停用時沒有人會把開場收掉（收屍在 js/splash.js 裡），全螢幕的 #splash
         會永遠卡在畫面上＝App 打不開。直接不要畫它。
         第二條：關鍵路徑塊的「開場播放中不畫 App」靠 html[data-splash="off"]，
         而那個屬性只有 JS 掛得上去 ⇒ JS 停用時那條會匹配、App 被藏死。這裡解除。
         第三條：同理，「開場播放中 body 底色讓開」也會匹配，畫面會是淺色的。
         這裡把 body 的底色釘回 App 自己的 --bg。 -->
    <style>#splash{display:none !important;} #splash ~ *{visibility:visible !important;} body{background:var(--bg) !important;}</style>
  </noscript>

  <style>
    /* ⭐ 開場外觀的落地值就這一塊（其餘一律不用動 css/splash.css）。
       ⚠️ 這一塊**必須留在 css/splash.css 那個 link 標籤後面**：splash.css 是範本複製品，
          它的 :root 預設值是範本自己的品牌，同權重時後宣告者勝，搬到前面就會被它蓋掉。
       ⚠️ --splash-bg 必須**逐字**等於 manifest.webmanifest 的 background_color
          與上面那條深色 meta theme-color（三處本來就都是 #0F1218 ⇒ manifest 完全不用改，
          他也不必把 App 從主畫面移除重加）。tools/check-splash.js 會逐字比對。
          ⚠️ 白起的第一幀是 --sp-start（#ebebeb），**刻意跟 manifest 不一樣**；
             四處一致講的是「開場**沉到最後**的底色」。
       ⚠️ 開場色票**刻意不跟淺色模式走**：iOS 的系統啟動畫面只吃 manifest 一個固定值，
          開場跟著主題變的話，深色系統啟動圖後面接一段淺色開場會多一次跳動。
          （代價：淺色模式下收場時會從深色開場交棒到淺色 App，見 CLAUDE.md。）
       ⚠️ 符號的文字色**不在這裡也不是設定項**，由 splash-boot.js 的 onColor() 從 accent 算。 */
    :root{
      --splash-bg:#0F1218;      /* = manifest.background_color = 深色 theme-color = --bg（深色） */
      --splash-ink:#E7E9ED;     /* = --text（深色） */
      --splash-accent:#E3A951;  /* = --gold（深色） */
      /* ⭐ 符號與名字也在這裡再寫一次（splash.js 平常會用 :root 的 inline style 蓋過去）。
         為什麼要重複：css/splash.css 是範本的複製品，它的預設值是「範／App 範本」。
         萬一 splash.js 載不到、splash.css 卻載到了，畫面上會出現**別人家的品牌**。 */
      --splash-glyph:"誌";
      --splash-name:"微台指交易日誌";
      --splash-tagline:"一天一筆，記錄與檢討自己";
    }
  </style>
</head>
<body>

<!-- 開場畫面。文字（符號、名字、標語）是 CSS 用 content:var(--splash-*) 畫出來的，
     所以這幾個元素刻意是空的 —— 不要把名字寫死在這裡。
     ⚠️ 必須是 <body> 的**第一個子元素**（關鍵路徑塊用 `#splash ~ *` 蓋住其餘內容）。
     aria-hidden：開場是純視覺的，不要讀給輔助技術聽。 -->
<div id="splash" aria-hidden="true">
  <div class="sp-core">
    <div class="sp-ring"></div>
    <div class="sp-glyph"></div>
    <div class="sp-below">
      <div class="sp-name"></div>
      <div class="sp-tag"></div>
    </div>
  </div>
</div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">📈</div>
        <div>
          <h1>交易日誌</h1>
          <div class="sub">微台指</div>
        </div>
      </div>
      <div class="today-chip">
        <div class="d" id="todayD">—</div>
        <div class="w" id="todayW">—</div>
      </div>
    </header>

    <div class="modebar" id="modeBar" role="tablist">
      <button type="button" data-mode="sim" class="on" role="tab">模擬</button>
      <button type="button" data-mode="real" role="tab">真實操作</button>
    </div>

    <section class="card summary">
      <div class="seg" id="seg">
        <button data-type="days" data-n="7">7 日</button>
        <button data-type="days" data-n="10">10 日</button>
        <button data-type="days" data-n="30" class="on">30 日</button>
        <button data-type="months" data-n="3">3 月</button>
        <button data-type="months" data-n="6">半年</button>
        <button data-type="months" data-n="12">1 年</button>
        <button data-type="custom">自訂</button>
      </div>
      <div class="custrange" id="custRange" hidden>
        <input type="date" id="cFrom" aria-label="起始日期">
        <span class="dash">—</span>
        <input type="date" id="cTo" aria-label="結束日期">
        <button type="button" class="apply" id="cApply">套用</button>
      </div>

      <div class="rate-row">
        <div class="rate-big">
          <span class="num" id="rateNum">—</span><span class="pct">%</span>
          <div class="lab">勝　率</div>
        </div>
        <div class="rate-meta">
          <div class="wl" id="wl"></div>
          <div class="net" id="net"><span class="v">±0</span><span class="u">點</span></div>
          <div class="cash" id="cash"></div>
        </div>
      </div>
    </section>

    <div id="todaySlot"></div>

    <div class="sec-head">
      <h2>交易紀錄</h2>
      <span class="count" id="histCount"></span>
    </div>
    <div class="list" id="list"></div>

    <footer class="foot">
      <a id="settingsBtn">⚙︎ 每筆手續費 NT$<span id="feeLabel">50</span></a><br>
      真實交易只存在這台裝置 · 記得定期<a id="exportBtn">匯出備份</a><br>
      <span id="syncLine"></span>
      <div id="krChip"></div>
      <a id="importBtn">匯入備份</a> · <a id="sampleBtn">重設為初始資料</a><br>
      <span id="verLabel" style="opacity:.6">版本 —</span> · <a id="forceUpdBtn">強制更新</a>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </footer>
  </div>

  <div class="fab"><button id="openBtn">＋ 記錄今日交易</button></div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="記錄交易">
    <div class="handle"></div>
    <h3 id="sheetTitle">記錄今日交易</h3>
    <form id="form">
      <div class="field">
        <label>類型</label>
        <div class="mode-toggle" id="modeToggle">
          <button type="button" data-mode="sim" aria-pressed="true">模擬</button>
          <button type="button" data-mode="real" aria-pressed="false">真實操作</button>
        </div>
      </div>
      <div class="field">
        <label>方向</label>
        <div class="dir-toggle">
          <button type="button" class="long" data-dir="long" aria-pressed="true">▲ 做多</button>
          <button type="button" class="short" data-dir="short" aria-pressed="false">▼ 做空</button>
        </div>
      </div>
      <div class="two">
        <div class="field">
          <label>進場點數</label>
          <input type="number" id="entry" inputmode="decimal" placeholder="23200" step="1">
        </div>
        <div class="field">
          <label>出場點數</label>
          <input type="number" id="exit" inputmode="decimal" placeholder="23240" step="1">
        </div>
      </div>
      <div class="preview idle" id="preview">輸入進出場點數，自動計算損益</div>
      <div class="field">
        <label>心得備註</label>
        <textarea id="note" placeholder="今天的盤感、進出場理由、紀律有沒有守…"></textarea>
      </div>
      <div class="field">
        <label>日期</label>
        <input type="date" id="date">
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn-cancel" id="cancelBtn">取消</button>
        <button type="submit" class="btn-save" id="saveBtn" disabled>儲存紀錄</button>
      </div>
      <button type="button" class="btn-delete" id="deleteBtn" hidden>刪除這筆紀錄</button>
    </form>
  </div>

  <div class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-label="手續費設定">
    <div class="handle"></div>
    <h3>手續費設定</h3>
    <div class="field">
      <label>每筆手續費（來回，NT$）</label>
      <input type="number" id="feeInput" inputmode="numeric" step="1" min="0" placeholder="50">
      <div class="hint">淨損益 = 點數 × 10 − 手續費。你 Notion 用的是每筆 NT$50；勝敗仍以「點數」判定，手續費只影響台幣金額。</div>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn-cancel" id="feeCancelBtn">取消</button>
      <button type="button" class="btn-save" id="feeSaveBtn">儲存</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ══════════ 開場的其餘部分（時序、收場、鑰匙圈）══════════
       ⚠️ 同步 script，而且必須排在 js/app.js **之前** ——
          app.js 一開頭就會呼叫 Splash.hold()，window.Splash 那時必須已經存在。
       ⚠️ 沒載到也不可以把 App 弄死：app.js 一律寫 window.Splash && …，
          自己有 splashFallback()；js/splash-boot.js 也有一條交棒保險絲會把開場收掉。 -->
  <script src="js/splash.js"></script>
  <script src="js/keyring-unlock.js"></script>
  <script src="js/seed-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' })
          .then(function (reg) {
            reg.update();                       // 每次開啟主動檢查有沒有新版
            // 新版接手後自動重載一次，不用手動清快取
            var refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
              if (refreshing) return; refreshing = true; location.reload();
            });
          })
          .catch(function () {});
      });
    }
  </script>
</body>
</html>
