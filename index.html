<!DOCTYPE html>
<!-- ⭐ 2026-09-24 改版：交易日誌 ⇒ 【早盤儀表板・手機監控】（Benson：晚上不在電腦前，只要看面板還活著沒、有沒有自動下單）。
     ⛔ 純看、一顆會動到交易的按鈕都沒有。資料 ＝ 面板每 2 分鐘推到 GitHub `monitor` 分支的**加密**快照，
     輸入密碼才解得開（repo 是公開的 ⇒ 沒密碼只看得到亂碼）。舊的練習日誌功能已拿掉。 -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0F1218" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="儀表板監控">
  <title>儀表板監控</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/monitor.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><span class="mark">📈</span><div><h1>早盤儀表板</h1><div class="sub">手機監控・只看不動</div></div></div>
      <div class="upd" id="upd"></div>
    </header>

    <!-- 解鎖 -->
    <section id="lock" class="card lock" hidden>
      <h2>輸入監控密碼</h2>
      <p class="dim">就是你在電腦上跑 monitor_setup.py 設的那一組。</p>
      <form id="lockForm" autocomplete="off">
        <input id="pw" type="password" placeholder="密碼" autocomplete="current-password" required>
        <label class="rem"><input id="remember" type="checkbox" checked> 記住這台手機</label>
        <button type="submit" id="unlockBtn">解鎖</button>
        <div id="lockErr" class="err" hidden></div>
      </form>
    </section>

    <!-- 主畫面 -->
    <main id="main" hidden>
      <section id="alive" class="card alive"></section>
      <section id="pos" class="card"></section>
      <section id="day" class="card"></section>
      <section id="night" class="card"></section>
      <section id="acct" class="card"></section>
      <section id="warn" class="card warn" hidden></section>
      <footer class="foot">
        <div id="footInfo" class="dim"></div>
        <button id="logout" class="link">登出（清掉這台手機記住的密碼）</button>
      </footer>
    </main>

    <div id="loading" class="dim center">載入中…</div>
  </div>
  <script src="js/monitor.js"></script>
</body>
</html>
